A1: якщо межі зрозумілі, але надмірно обмежені, головною є M5-A1."},"M1-A2":{"id":"M1-A2","module":1,"title":"Зробити вимоги до роботи, пріоритети та порядок уточнення однозначними","when":"Сигнали E02/E03/E04, L02/L03, P02/P03/P04.","why":"Працівникам мають бути зрозумілі вимоги, пріоритети й очікувані результати; при суперечливих вимогах має бути доступний спосіб отримати рішення.","what":"Визначити мінімум інформації для постановки/зміни завдання: очікуваний результат, пріоритет, критерії якості, строк. Встановити простий порядок для суперечливих, нереалістичних або небезпечних вимог: кому повідомляють, хто може змінити пріоритет, хто ухвалює остаточне рішення і як працівник отримує відповідь.","check":"Переглянути 5 типових завдань і 2–3 випадки зміни/конфлікту пріоритетів; перевірити зрозумілість результату, пріоритету, критеріїв, строку та маршруту ескалації.","dedup":"M6-A1: якщо проблема не в пріоритетах, а в нереалістичному обсязі/строках/ресурсах, головною є M6-A1."},"M1-A3":{"id":"M1-A3","module":1,"title":"Вбудувати ясність ролей і вимог в управління змінами","when":"E05, P05, P06 та пов’язані сигнали про несвоєчасне оновлення вимог.","why":"Під час змін важливо завчасно пояснювати причину, очікуваний вплив і строки, а після зміни перевіряти ролі та вимоги.","what":"Перед суттєвою зміною пояснювати, що змінюється і чому, коли, як це вплине на ролі/завдання/пріоритети і де отримати уточнення. Після впровадження перевіряти відповідність фактичної роботи оновленим ролям та відсутність нових дублювань або прогалин.","check":"Для 2 останніх суттєвих змін відновити хронологію інформування; після наступної зміни вибірково перевірити, чи працівники можуть пояснити, що саме змінилося для їхньої ролі.","dedup":"M5-A3: якщо одночасно бракує участі до рішення, об’єднати в одну дію щодо управління змінами."},"M2-A1":{"id":"M2-A1","module":2,"title":"Закріпити мінімальний стандарт підтримувального керівництва","when":"E06/E07/E09, L04 та/або прогалини P07/P11/P12.","why":"Працівникам потрібні доступна підтримка керівника, регулярний конструктивний feedback і можливість обговорювати робочі труднощі; організація має створити зрозумілий спосіб роботи й умови для його застосування.","what":"Визначити базові управлінські дії: поважне професійне ставлення; конкретний feedback; можливість своєчасно обговорити навантаження, пріоритети й труднощі; узгодження наступного кроку. Вбудувати це у звичні управлінські процеси, без жорсткої однакової частоти 1:1 для всіх ролей.","check":"Через визначений період перевірити у кількох командах, чи працівники знають, коли й як можуть обговорити проблему; чи отримують зрозумілий feedback; чи завершуються важливі розмови конкретною домовленістю.","dedup":"M3-A1: якщо проблема саме в безпеці voice/незгоди/прохання про допомогу, головною є M3-A1."},"M2-A2":{"id":"M2-A2","module":2,"title":"Дати керівникам реальні можливості вирішувати проблеми команди","when":"E08, L05/L06, P08; також E09, якщо причина у відсутності ресурсу або повноважень.","why":"Підтримка не працює, якщо керівник бачить проблему, але не має часу, інформації, повноважень або ресурсів для її вирішення.","what":"Для типових проблем визначити: що керівник вирішує сам; які ресурси/інформація потрібні; що ескалується; кому; хто відповідає за рішення; як команда отримує результат. Повторювані системні перешкоди усувати на рівні процесу/ресурсу.","check":"Взяти 5–10 недавніх питань, які керівники не могли вирішити самостійно, і перевірити маршрут, час вирішення та факт повернення рішення команді.","dedup":"M1-A2 або M6-A1 можуть бути головними, якщо причина специфічно в конфлікті пріоритетів або системному перевантаженні."},"M2-A3":{"id":"M2-A3","module":2,"title":"Розвивати й перевіряти управлінські навички там, де вони потрібні","when":"P09/P10/P12, повторювані E06/E07/E09, проблеми незнання порядку дій або меж ролі.","why":"Навчання корисне лише тоді, коли є конкретний дефіцит управлінської спроможності; воно не замінює процесів, ресурсів, повноважень або чітких правил.","what":"Спочатку визначити конкретну спроможність: feedback, управління навантаженням, складні розмови, реагування на неприйнятну поведінку, межі ролі, перенаправлення. Навчання будувати на реальних кейсах і поєднувати з алгоритмами та ресурсами.","check":"Через визначений період використати 3–5 типових кейсів або 180°/360° feedback; перевірити застосування потрібної поведінки та зміну досвіду працівників.","dedup":"Не робити тренінг головною дією за структурної причини."},"M3-A1":{"id":"M3-A1","module":3,"title":"Створити в команді безпечний спосіб говорити про проблеми, ставити запитання, просити допомоги й висловлювати незгоду","when":"E11/E13/E14, L09, P14; за потреби P13.","why":"Психологічна безпека проявляється у готовності брати міжособистісний ризик: ставити запитання, визнавати невизначеність, просити допомоги, висловлювати занепокоєння або незгоду без приниження чи покарання.","what":"1) Пояснювати, навіщо потрібна відвертість у роботі з невизначеністю й ризиком. 2) Активно запрошувати внесок і альтернативну думку. 3) Конструктивно реагувати: дякувати за сигнал, уточнювати факти, не принижувати, пояснювати рішення і повертатися з відповіддю. Вбудувати це у регулярні робочі формати.","check":"Взяти 3–5 недавніх ситуацій, коли працівник поставив складне запитання, визнав помилку, попросив допомоги, висловив незгоду або повідомив про проблему. Перевірити не лише можливість сказати, а що сталося після цього: реакція, відповідь, негативні наслідки, конкретна дія.","dedup":"Ключовий критерій з Edmondson/Clark: «Що відбувається після того, як людина заговорила?». M2-A1 не дублювати, якщо проблема саме у voice."},"M3-A2":{"id":"M3-A2","module":3,"title":"Запровадити розбір помилок і інцидентів з фокусом на причини та запобігання повторенню","when":"E12, L07, P17, P18; за потреби P14.","why":"Помилка часто має робочі та системні передумови. Безпечне повідомлення й аналіз причин підтримують організаційне навчання; психологічна безпека не скасовує відповідальність за свідомі або грубі порушення.","what":"Для значущих помилок/збоїв: що сталося; які умови сприяли; які системні фактори; що змінити; хто відповідальний і коли перевірка. Окремо заохочувати повідомлення про near miss. Розмежувати аналіз причин і дисциплінарну відповідальність.","check":"Вибрати 3–5 останніх значущих помилок/інцидентів; для кожного має бути зрозуміло: причини, зміна, відповідальний, виконання й перевірка. Повторні схожі випадки — сигнал неефективності попередніх заходів.","dedup":"M7-A2: за прогалини в офіційному циклі БЗР можна об’єднати з системною дією."},"M3-A3":{"id":"M3-A3","module":3,"title":"Забезпечити безпечний канал і надійне реагування на неприйнятну поведінку","when":"E15, L08, P13, P15, P16, P18.","why":"Безпечне повідомлення потребує зрозумілих правил, альтернативного конфіденційного каналу, захисту від помсти, неупередженого розгляду, інформування та підтримки.","what":"Забезпечити: правила й приклади неприйнятної поведінки; заборону помсти; канал незалежний від безпосереднього керівника; порядок первинного реагування; неупереджений розгляд; інформування заявника в межах конфіденційності; підтримку; аналіз повторів і контроль виконання. Конкретні скарги не розбирати у групових фокус-групах.","check":"Провести «тест маршруту»: чи працівник може знайти канал; чи керівник знає перші дії; чи простежується прийняття звернення, конфіденційність, розгляд і контроль виконання. Переглянути зведені повтори.","dedup":"Може рекомендуватися превентивно за прогалин P13/P15/P16 навіть без вираженого E15. M4-A3 потрібна окремо, якщо проблема у нерівному рішенні/адаптації."},"M4-A1":{"id":"M4-A1","module":4,"title":"Зробити значущі рішення щодо роботи, оцінювання й винагороди зрозумілими та обґрунтованими","when":"E16/E17, L10/L12, P19/P20/P24.","why":"Справедливість залежить від критеріїв, послідовності їх застосування та можливості отримати пояснення. Низький E16 — сигнал перевірити, а не доказ несправедливої оплати.","what":"Для значущих рішень визначити критерії, дані, відповідального, правила винятків, спосіб отримати пояснення і перегляд. Для оплати порівнювати ролі за відповідальністю, складністю й вимогами; перевіряти суттєві відмінності. Визнання внеску не зводити до премій.","check":"Вибрати 5–10 останніх рішень щодо оплати, преміювання, оцінювання або розподілу роботи; перевірити критерії та обґрунтування. Для порівнюваних ролей — суттєві відмінності в оплаті.","dedup":"E16 ≠ доказ дискримінації. P19 у M1 лише допоміжний зв’язок для E02."},"M4-A2":{"id":"M4-A2","module":4,"title":"Забезпечити фактично рівний доступ до ресурсів, розвитку й кар’єрних можливостей","when":"E18/E19, L12, P22/P23/P24; частково L10.","why":"Формальна наявність ресурсу, програми чи вакансії не гарантує фактичної рівності доступу.","what":"Для ресурсів: мінімально необхідний набір для порівнюваних ролей, критерії дефіцитного розподілу, перевірка локацій/змін/форматів. Для розвитку: завчасна інформація, доступні канали, критерії до відбору, однакова структура оцінки, документування істотних винятків.","check":"Порівняти кілька порівнюваних команд/груп: доступ до ключових ресурсів, інформація про розвиток, подання, відбір. Повторювана відмінність — сигнал перевірити причину й критерії.","dedup":"Відмінність між групами не є автоматичним доказом дискримінації."},"M4-A3":{"id":"M4-A3","module":4,"title":"Забезпечити справедливу адаптацію індивідуальних потреб і захист від нерівного ставлення","when":"E20, L11, P21; за потреби P23/P24/P13.","why":"Рівність не завжди означає однакове ставлення. Іноді для фактично рівної можливості потрібна обґрунтована адаптація графіка, робочого місця, завдання, обладнання або способу взаємодії.","what":"Створити конфіденційний маршрут: куди звернутися; запитувати лише необхідну для робочої потреби інформацію; оцінювати варіанти разом із працівником; розглядати альтернативи; пояснювати рішення; визначати відповідального і дату перегляду; обмежувати доступ до приватної інформації. Для нерівного ставлення перевіряти конкретний процес рішення.","check":"На кількох анонімізованих кейсах перевірити шлях: звернення → оцінка потреби → рішення → виконання → повторний перегляд; окремо — чи не вимагали зайвої приватної інформації.","dedup":"M6-A3 — якщо адаптація є частиною повернення після тривалої відсутності; M7-A1 — якщо це загальний бар’єр середовища."},"M5-A1":{"id":"M5-A1","module":5,"title":"Розширити обґрунтовану самостійність у виконанні роботи","when":"E21/E22, L13, P25/P26.","why":"Низький контроль над способом виконання роботи є психосоціальним фактором ризику, але автономія має відповідати характеру роботи, вимогам безпеки, компетентності й ризику.","what":"Визначити, які рішення справді стандартизовані через ризик/якість/регуляцію; відокремити їх від низькоризикових; передати більше повноважень працівнику/команді; скоротити непотрібні погодження; де можливо дати вибір способу, послідовності, темпу або часу. Цифровий контроль робити пропорційним меті й прозорим.","check":"Для 3–5 типових рішень перевірити кількість погоджень і час очікування до/після зміни; запитати, чи зрозумілі межі самостійності; переконатися, що не погіршилися критичні показники безпеки/якості.","dedup":"M1-A1 — якщо проблема в невизначених межах, а не в надмірному контролі. E22 → M6-A1 за перевантаження/дефіциту відновлення."},"M5-A2":{"id":"M5-A2","module":5,"title":"Залучати працівників до вдосконалення роботи та управління психосоціальними ризиками","when":"E23, L15, P27/P28; частково E25/P30.","why":"Працівники часто першими бачать непрактичні процедури, перешкоди й ризики; змістовна участь підвищує якість рішень і заходів контролю.","what":"Вбудовувати участь у планування нової роботи, перегляд проблемного процесу, вибір інструментів, зміни, оцінювання психосоціальних ризиків і визначення заходів. До обговорення пояснювати, що можна змінити, які обмеження, хто вирішує, коли потрібна пропозиція і коли буде відповідь.","check":"Для 3–5 консультацій/пропозицій простежити внесок працівників: прийнято, адаптовано, використано для іншого рішення або обґрунтовано не прийнято. Для психосоціальних заходів — чи працівники оцінювали практичність.","dedup":"Якщо P37–P39 також мають прогалини, M7-A2 є головною і включає P28 як крок."},"M5-A3":{"id":"M5-A3","module":5,"title":"Проводити консультації до рішень і завжди повертати результат","when":"E24/E25, L14/L15, P29/P30; P05 перехресно.","why":"Участь втрачає сенс, якщо людей залучають після фактичного рішення або не повертають відповідь.","what":"Для суттєвої зміни: визначити питання, на які ще можна вплинути; завчасно дати інформацію; залучити до обговорення до остаточного рішення; зафіксувати пропозиції; після рішення повідомити, що враховано, що ні і чому. Для робочих проблем — статус рішення + пояснення + наступний крок + відповідальний.","check":"Для кількох змін і звернень перевірити часову послідовність: коли залучили, що ще можна було змінити, які пропозиції були й яку відповідь отримали.","dedup":"M1-A3: за одночасного дефіциту ясності змін об’єднати в одну action card щодо управління змінами."},"M6-A1":{"id":"M6-A1","module":6,"title":"Усунути системне перевантаження і забезпечити реальне відновлення","when":"E26/E27/E28, L16, P31/P32; перехресно E09/E22.","why":"Надмірне навантаження, інтенсивний темп, тривалий робочий час і недостатнє відновлення є психосоціальними ризиками. Організаційна відповідь має змінювати умови, а не лише здатність «витримувати».","what":"Визначити, де перевантаження повторюване; зіставити обсяг, чисельність, строки, пріоритети, вакансії, понаднормову роботу, пропущені перерви; визначити головну причину; змінити обсяг, пріоритети, строки, чисельність, розподіл, графік або процес; усунути бар’єри для перерв; визначити межі позаробочих контактів.","check":"Повторно перевірити ті самі показники, що підтверджували проблему: понаднормову роботу, пропущені перерви, накопичення завдань, позаробочі контакти, помилки/переробки. Покращення має проявитися в умовах роботи.","dedup":"Має пріоритет над психологічною підтримкою, якщо підтверджено шкідливі умови роботи."},"M6-A2":{"id":"M6-A2","module":6,"title":"Зробити підтримку доступною, конфіденційною і зрозумілою для працівників та керівників","when":"E29/E30, L17/L18, P33/P34.","why":"Наявність сервісу не гарантує доступу. Працівник має знати маршрут і довіряти конфіденційності; керівник — знати межі ролі й перенаправлення.","what":"Єдиний зрозумілий опис: види підтримки, для кого, як звернутися, чи потрібне погодження, хто надає, що конфіденційно, яку інформацію отримує компанія, альтернативний маршрут без керівника. Для керівників: помітив зміни → приватно запитав про робочий стан → перевірив робочі фактори → пояснив варіанти → за потреби скерував. Не діагностувати.","check":"Анонімно перевірити, чи працівники знають маршрут і конфіденційність; чи керівники правильно проходять 2–3 типові сценарії й знають межу своєї ролі.","dedup":"Не змішувати з M2-A1 (повсякденна підтримка) або M3-A1 (безпека попросити допомоги)."},"M6-A3":{"id":"M6-A3","module":6,"title":"Визначити безпечний порядок повернення до роботи та реагування після складних подій","when":"P35/P36; за потреби L17/L18.","why":"Повернення після тривалої відсутності та реагування після потенційно травматичної події потребують підготовленого процесу, а не імпровізації.","what":"Повернення: конфіденційно обговорити робочі потреби; визначити тимчасові/постійні зміни; за потреби поетапне повернення; дата повторної перевірки; обмеження доступу до приватної інформації. Після травматичної події: фізична безпека, практична допомога, відпочинок/заміна, добровільна підтримка, без примусового групового розкриття пережитого, перевірка робочих причин і повторна оцінка потреб.","check":"Для повернення — кілька анонімізованих кейсів: домовленості, перегляд, виконання. Для події — tabletop/практична перевірка маршруту реагування й подальшої підтримки.","dedup":"M7-A3 відповідає за негайну безпеку під час події; M6-A3 — за подальшу підтримку/повернення."},"M7-A1":{"id":"M7-A1","module":7,"title":"Усувати небезпечні умови та бар’єри, що заважають безпечно виконувати роботу","when":"E32/E33, L19, P41; за потреби P21.","why":"Небезпечні або непридатні фізичні умови, недостатня ергономіка, обладнання, цифрові та інформаційні бар’єри можуть заважати безпечному виконанню роботи.","what":"Визначити конкретне робоче місце, маршрут, обладнання, інструмент, цифровий сервіс або інформацію, що створюють бар’єр/небезпеку; оцінити ризик і пріоритет; відповідальний і термін; тимчасовий захід, якщо негайне усунення неможливе; після виконання перевірити в реальній роботі. Критичні правила безпеки перевіряти практичним сценарієм, а не лише підписом.","check":"Повторно пройти той самий робочий сценарій і перевірити, чи небезпека/бар’єр фактично усунені. Для критичних правил попросити працівника показати правильну дію.","dedup":"M4-A3 — якщо це індивідуальна адаптація; M6-A3 — якщо бар’єр виникає в контексті повернення після відсутності."},"M7-A2":{"id":"M7-A2","module":7,"title":"Вбудувати управління психосоціальними ризиками в систему БЗР","when":"P37/P38/P39, L21; особливо коли проблемні сигнали повторюються в кількох модулях.","why":"Психосоціальні ризики мають управлятися системно: відповідальні, оцінювання, заходи контролю, ресурси, строки, перевірка результативності та повторне оцінювання.","what":"Включити психосоціальні ризики до чинного циклу БЗР: виявити небезпеку → оцінити ризик → організаційний захід → відповідальний/строк/ресурс → реалізувати → перевірити результат → повторно оцінити. Робити регулярно, перед суттєвими змінами, після значущих подій і за нових сигналів. Залучати працівників. Спочатку змінювати робоче джерело ризику.","check":"Вибрати 3–5 психосоціальних ризиків і перевірити ланцюг: сигнал → робоча причина → організаційний захід → відповідальний → строк → перевірка результату. Якщо є лише тренінг/EAP, перевірити, чи усунуто робоче джерело.","dedup":"M5-A2 не дублювати, якщо проблема саме в системі ризик-менеджменту і P28 може бути включений як крок участі."},"M7-A3":{"id":"M7-A3","module":7,"title":"Перевірити готовність до прямої загрози, насильства з боку третіх осіб і надзвичайних ситуацій","when":"E34/E35, L20, P42; P40 за підтвердженого ризику.","why":"Для подій із потенційно тяжкими наслідками наявності документа недостатньо: люди мають знати дії, зв’язок має працювати, порядок — бути перевіреним. Ризик третьої сторони враховується лише там, де він актуальний.","what":"Для НС перевірити: оповіщення; укриття/евакуація; допомога людям із додатковими потребами; резервний зв’язок; рішення про зупинку й безпечне відновлення; офіційні подальші вказівки. Для третьої сторони — небезпечні сценарії, виклик допомоги, можливість припинити контакт, правила роботи наодинці, повідомлення, підтримка після інциденту, аналіз причин.","check":"Провести практичний або tabletop-сценарій без покрокового підказування; перевірити дії працівників/керівників, зв’язок і чи всі виявлені недоліки отримали відповідального та строк; повторно перевірити, що недоліки не повторилися.","dedup":"P40 — лише за підтвердженого актуального ризику. M6-A3 — подальша підтримка після події, а не emergency response."},"C01":{"id":"C01","module":1,"title":"Проводити зміни із завчасним залученням і чітким оновленням ролей та вимог","when":"Одночасно активні M1-A3 і M5-A3.","why":"Сигнали показують, що під час змін людям бракує і ясності щодо впливу на роботу, і реальної можливості вплинути до остаточного рішення.","what":"До зміни пояснити що/чому/коли змінюється і як це вплине на ролі; визначити питання, на які ще можна вплинути; провести консультацію до остаточного рішення; після рішення повідомити, що враховано і чому; оновити ролі, вимоги та пріоритети; після впровадження перевірити розуміння й нові розбіжності.","check":"Для 2–3 останніх/наступних змін відновити часову послідовність: інформація → консультація → рішення → оновлення ролей → зворотний зв’язок → перевірка після впровадження.","dedup":"У Плані один запис; owner_module=M1 для відображення; M5 показує cross-reference."}},"clarifications":{"M1-A1":{"base":"Порівняйте визначену роль із фактичною роботою в 2–3 типових ролях. Окремо попросіть працівника і керівника описати основні обов’язки, межі рішень і підпорядкування; зафіксуйте розбіжності.","formalVsExperience":"Якщо P показує, що ролі формально визначені, перевірте 2–3 реальні ситуації, де виникла плутанина, і з’ясуйте, чи актуальні документи та чи однаково їх розуміють.","transition":"Повторювана невизначеність або розрив між формальною й фактичною роллю → дія пряма."},"M1-A2":{"base":"Перегляньте 2–3 типові завдання або випадки зміни пріоритетів: чи були зрозумілі результат, пріоритет, критерії якості, строк і хто вирішує конфлікт вимог.","formalVsExperience":"Якщо P формально реалізований, порівняйте визначений порядок із реальними кейсами та перевірте, де саме рішення або уточнення затримується.","transition":"Підтверджена повторювана неоднозначність → дія пряма."},"M1-A3":{"base":"Для 2 останніх суттєвих змін відновіть хронологію: коли працівників поінформували, що саме пояснили про вплив на роль і коли оновили вимоги.","formalVsExperience":"Якщо формальний процес змін є, перевірте, чи інформація надходила до того, як зміна почала впливати на роботу.","transition":"За одночасного дефіциту участі об’єднати з M5-A3."},"M2-A1":{"base":"У кількох командах перегляньте 3–5 недавніх розмов про feedback, навантаження або робочі труднощі: чи була конкретна відповідь, домовленість і подальша дія.","formalVsExperience":"Якщо регулярні зустрічі формально є, перевірте їх зміст і результат, а не лише частоту.","transition":"Проблема саме в voice/страху говорити → M3-A1 головна."},"M2-A2":{"base":"Візьміть 3–5 ситуацій, у яких керівник не зміг вирішити проблему команди. Простежте: що міг вирішити сам, чого бракувало, куди ескалював і що реально змінилося.","formalVsExperience":"Якщо ресурси/маршрут формально визначені, перевірте час проходження й фактичний результат.","transition":"Якщо першопричина — конфлікт пріоритетів або системне перевантаження, головна M1-A2 або M6-A1."},"M2-A3":{"base":"Дайте керівникам 3–5 типових кейсів і перевірте, чи правильно вони визначають свої дії, межі ролі, доступні ресурси та момент перенаправлення.","formalVsExperience":"Якщо програма навчання формально є, перевірте застосування поведінки в роботі, а не участь у курсі.","transition":"Навчання не є головною дією, якщо бракує процесу, ресурсу або повноважень."},"M3-A1":{"base":"Візьміть 3–5 ситуацій, коли працівник поставив складне запитання, висловив незгоду, попросив допомоги або підняв проблему. Перевірте, що відбулося після цього: реакція, відповідь, наслідки, дія.","formalVsExperience":"Якщо канали/зустрічі формально існують, оцінюйте не їх наявність, а реакцію після висловленого сигналу.","transition":"Ключовий критерій: чи безпечно заговорити і що відбувається після цього."},"M3-A2":{"base":"Перегляньте 3–5 останніх помилок, збоїв або near miss: як їх повідомили, які системні причини шукали, що змінили і чи перевірили виконання.","formalVsExperience":"Якщо порядок аналізу формально є, порівняйте його з реальними розборами і реакцією на людину, яка повідомила.","transition":"Якщо проблема ширша за навчання на помилках і стосується системи БЗР, додати M7-A2."},"M3-A3":{"base":"Проведіть «тест маршруту»: чи може працівник знайти безпечний канал, чи знає керівник перші дії, як захищається конфіденційність і як контролюється розгляд. Конкретні скарги не обговорюйте у групі.","formalVsExperience":"Якщо канал формально існує, перевірте обізнаність, доступність, захист від помсти й фактичне проходження кейсу.","transition":"Прогалини P13/P15/P16 можуть запускати дію превентивно без E15."},"M4-A1":{"base":"Виберіть 5–10 останніх рішень щодо оплати, оцінювання, преміювання або розподілу роботи. Перевірте критерії, обґрунтування, винятки й можливість отримати пояснення.","formalVsExperience":"Якщо критерії формально визначені, перевірте їх послідовне застосування та суттєві відмінності між порівнюваними ролями.","transition":"Не робити висновок про дискримінацію лише з E16 або різниці показників."},"M4-A2":{"base":"Порівняйте кілька порівнюваних груп/команд: хто мав доступ до ключових ресурсів, інформації про розвиток, хто подавався і кого відбирали.","formalVsExperience":"Якщо можливості формально відкриті для всіх, перевірте фактичний доступ за локаціями, змінами й форматами роботи.","transition":"Повторювана відмінність → перевірити причину й критерії, не називати автоматично дискримінацією."},"M4-A3":{"base":"На кількох анонімізованих кейсах перевірте шлях: звернення про потребу/нерівне ставлення → оцінка → рішення → виконання → перегляд. Визначте конкретний процес, де виникає бар’єр.","formalVsExperience":"Якщо порядок адаптації формально існує, перевірте обізнаність керівників, конфіденційність і фактичне виконання.","transition":"При приниженні/мобінгу/домаганнях паралельно маршрутизувати до M3-A3."},"M5-A1":{"base":"У 2–3 типових ролях окремо попросіть працівників і керівника назвати рішення, які можна приймати без погодження. Відокремте необхідні обмеження безпеки/якості від зайвого контролю.","formalVsExperience":"Якщо формальних ознак надмірного контролю немає, перевірте реальну кількість погоджень, затримки та практику цифрового моніторингу.","transition":"Якщо проблема лише в неясних межах, M1-A1 головна."},"M5-A2":{"base":"Перегляньте 3–5 останніх пропозицій/консультацій: що працівники могли змінити, що запропонували, що врахували або обґрунтовано не прийняли.","formalVsExperience":"Якщо формальний механізм участі є, перевірте, чи він реально впливає на рішення, а не лише збирає ідеї.","transition":"Якщо проблема стосується лише P28 і P37–P39 також мають GAP, M7-A2 головна."},"M5-A3":{"base":"Для 2–3 останніх суттєвих змін відновіть часову послідовність: коли рішення формувалося, коли працівників залучили, що ще можна було змінити і яку відповідь вони отримали.","formalVsExperience":"Якщо консультації формально проводяться, перевірте, чи відбуваються вони до остаточного рішення і чи повертається результат.","transition":"За одночасного дефіциту ясності змін об’єднати з M1-A3."},"M6-A1":{"base":"Перегляньте 2–3 останні періоди перевантаження: обсяг, строки, чисельність, понаднормову роботу, пропущені перерви, зміну пріоритетів і рішення керівників.","formalVsExperience":"Якщо механізм контролю навантаження формально є, перевірте, чи спрацював він достатньо рано і чи змінив реальні умови.","transition":"За підтвердженого системного перевантаження дія має пріоритет над wellness/EAP."},"M6-A2":{"base":"Анонімно перевірте, чи працівники знають, які сервіси доступні, як звернутися, що конфіденційно і яку інформацію отримує компанія; керівникам дайте 2–3 типові сценарії referral.","formalVsExperience":"Якщо сервіс формально є, перевірте бар’єри доступу і довіру, а не купуйте автоматично новий сервіс.","transition":"E29/E30 не є показниками психічного здоров’я."},"M6-A3":{"base":"Для повернення перегляньте кілька анонімізованих кейсів; для потенційно травматичної події проведіть tabletop: безпека, заміна/відпочинок, добровільна підтримка, подальший перегляд.","formalVsExperience":"Якщо порядок формально визначений, перевірте готовність відповідальних і фактичне виконання на кейсі/сценарії.","transition":"M7-A3 відповідає за безпеку під час події; M6-A3 — за підтримку після неї."},"M7-A1":{"base":"Пройдіть 2–3 типові робочі сценарії на місці: маршрут, робоче місце, обладнання, цифровий інструмент, інформація. Зафіксуйте конкретний бар’єр і повторно перевірте після усунення.","formalVsExperience":"Якщо огляди формально проводяться, перевірте реальне виконання роботи, а не лише нормативний стан середовища.","transition":"Індивідуальна адаптація → M4-A3; повернення після відсутності → M6-A3."},"M7-A2":{"base":"Візьміть 3–5 психосоціальних ризиків і простежте повний цикл: сигнал → причина → захід → відповідальний → строк → виконання → перевірка результату.","formalVsExperience":"Якщо формальна система БЗР є, перевірте, чи психосоціальні ризики реально включені в цей цикл і чи організаційні заходи мають пріоритет.","transition":"Не замінює конкретні причинні дії інших модулів."},"M7-A3":{"base":"Проведіть tabletop або практичний сценарій без покрокового підказування: оповіщення, укриття/евакуація, допомога, резервний зв’язок, зупинка/відновлення роботи; для P40 окремо перевірте актуальність ризику третьої сторони.","formalVsExperience":"Якщо план формально є, перевірте практичну готовність людей і закриття недоліків після попередніх тренувань.","transition":"P40 запускає дію лише за p40_applicable=true; актуальна пряма загроза має негайний пріоритет."}},"clusters":{"1":[{"id":"M1-C1","number":1,"name":"Роль, відповідальність і межі рішень","eCodes":["E01"],"lCodes":["L01"],"pCodes":["P01","P02","P06"],"check":"Чи розуміють люди, за що відповідають, які рішення можуть ухвалювати і чи відповідає фактична робота визначеній ролі."},{"id":"M1-C2","number":2,"name":"Очікуваний результат і пріоритети роботи","eCodes":["E02","E03"],"lCodes":["L02"],"pCodes":["P02","P03"],"check":"Чи зрозуміло, що саме треба зробити, що зараз важливіше і за якими ознаками робота вважається виконаною належно."},{"id":"M1-C3","number":3,"name":"Нечіткі або суперечливі вимоги","eCodes":["E04"],"lCodes":["L03"],"pCodes":["P04"],"check":"Чи є зрозумілий і реально працюючий спосіб вирішити конфлікт вимог або пріоритетів."},{"id":"M1-C4","number":4,"name":"Ясність під час змін","eCodes":["E05"],"lCodes":[],"pCodes":["P05","P06","P03"],"check":"Чи знає працівник до впровадження зміни, що саме зміниться в його роботі, і чи оновлюються після змін ролі та вимоги."}],"2":[{"id":"M2-C1","number":1,"name":"Якість повсякденної взаємодії з керівником","eCodes":["E06","E07"],"lCodes":["L04"],"pCodes":["P07","P11","P12"],"check":"Чи отримує працівник повагу, конструктивний зворотний зв’язок і реальну можливість обговорити тр function barometerUnique(values){return [...new Set((values||[]).filter(Boolean))]}
function barometerSourceOf(code){return code?.charAt(0)||''}
function barometerSignalActive(input,code){
  const source=barometerSourceOf(code);
  return source==='P'?input.P.states[code]==='G':input[source].states[code]==='S'
}
function barometerStateForCodes(input,source,codes){
  const relevant=(codes||[]).filter(code=>barometerSourceOf(code)===source);
  if(!relevant.length)return source==='P'?'N':'N';
  if(source!=='P'&&!input[source].eligible)return 'X';
  const states=relevant.map(code=>input[source].states[code]||(source==='P'?'T':'T'));
  if(source==='P'){
    if(states.includes('G'))return 'G';
    if(states.includes('T'))return 'T';
    return 'N';
  }
  if(states.includes('S'))return 'S';
  if(states.every(state=>state==='T'))return 'T';
  return 'N'
}
function barometerMetricDetail(item){
  if(!item||!item.adequate)return null;
  return {favorable:item.favorable,unfavorable:item.unfavorable,applicable:item.applicable,na:item.na}
}
function barometerRuntimeInput(){
  const eobj=env(S.env),sr=getSurveyResults(eobj)||{},cp=period()?.checkup||{answers:{}},answers=cp.answers||{};
  const makeSurvey=source=>{
    const result=sr[source.toLowerCase()]||{},minimum=source==='E'?20:10,total=Number(result.totalResponses||0);
    const eligible=result.eligible===false?false:(result.eligible===true||total>=minimum),states={},metrics={};
    for(const [code,meta] of Object.entries(BAROMETER_ALGORITHM_SPEC.signals)){
      if(meta.source!==source)continue;
      if(!eligible){states[code]='X';continue}
      const item=result.items?.[code];metrics[code]=barometerMetricDetail(item);
      if(!item||item.adequate===false){states[code]='T';continue}
      states[code]=(item.favorable<55||item.unfavorable>=30)?'S':'N';
    }
    const nearModules={};
    for(let moduleId=1;moduleId<=7;moduleId++)nearModules[moduleId]=!!result.modules?.[moduleId]?.borderline;
    return {eligible,total,minimum,states,metrics,nearModules,qualityModules:result.modules||{}}
  };
  const pStates={};
  for(const [code,meta] of Object.entries(BAROMETER_ALGORITHM_SPEC.signals)){
    if(meta.source!=='P')continue;
    const answer=answers[code];
    pStates[code]=answer==='no'||answer==='partial'?'G':answer==='full'?'N':'T';
  }
  return {
    E:makeSurvey('E'),
    L:makeSurvey('L'),
    P:{states:pStates,p40Applicable:cp.p40Risk==='confirmed',p40Known:cp.p40Risk==='confirmed'||cp.p40Risk==='not_confirmed'},
    criticalNow:cp.criticalNow===true,
    environmentId:eobj?.id||S.env||null,
  }
}
function barometerNormaliseFixture(input={}){
  const result={criticalNow:!!input.criticalNow,environmentId:input.environmentId||'fixture'};
  for(const source of ['E','L']){
    const supplied=input[source]||{},states={};
    const eligible=supplied.eligible!==false;
    for(const [code,meta] of Object.entries(BAROMETER_ALGORITHM_SPEC.signals))if(meta.source===source)states[code]=eligible?(supplied.states?.[code]||'N'):'X';
    result[source]={eligible,total:Number(supplied.total??(source==='E'?20:10)),minimum:source==='E'?20:10,states,metrics:supplied.metrics||{},nearModules:supplied.nearModules||{},qualityModules:{}};
  }
  const pStates={};
  for(const [code,meta] of Object.entries(BAROMETER_ALGORITHM_SPEC.signals))if(meta.source==='P')pStates[code]=input.P?.states?.[code]||'N';
  result.P={states:pStates,p40Applicable:input.P?.p40Applicable===true,p40Known:input.P?.p40Known===true||input.P?.p40Applicable===true};

}
function barometerFillTemplate(text,replacements){
  return String(text||'').replace(/\{([A-Z_]+)\}/g,(_,key)=>replacements[key]||'')
}
function barometerClusterResult(input,moduleId,cluster){
  const e=barometerStateForCodes(input,'E',cluster.eCodes),l=barometerStateForCodes(input,'L',cluster.lCodes),p=barometerStateForCodes(input,'P',cluster.pCodes),key=`${e}|${l}|${p}`,combo=BAROMETER_ALGORITHM_SPEC.combos[key];
  if(!combo)throw new Error(`Немає комбінації ${key}`);
  const activeLabels=(source,codes,state)=>state===(source==='P'?'G':'S')?barometerUnique(codes.filter(code=>barometerSignalActive(input,code)).map(code=>BAROMETER_ALGORITHM_SPEC.signals[code]?.label)):[];
  const eLabels=activeLabels('E',cluster.eCodes,e),lLabels=activeLabels('L',cluster.lCodes,l),pLabels=activeLabels('P',cluster.pCodes,p);
  const replacements={E_SIGNAL_LIST:eLabels.join(', '),L_SIGNAL_LIST:lLabels.join(', '),P_GAP_LIST:pLabels.join(', ')};
  return {
    id:cluster.id,name:cluster.name,module:moduleId,e,l,p,key,
    eCodes:cluster.eCodes,lCodes:cluster.lCodes,pCodes:cluster.pCodes,
    eLabels,lLabels,pLabels,
    attention:barometerFillTemplate(combo.attention,replacements),

function barometerEvidence(code,kind='PRIMARY'){
  const meta=BAROMETER_ALGORITHM_SPEC.signals[code];
  return {code,source:meta.source,sourceLabel:BAROMETER_SOURCE_LABELS[meta.source],topic:meta.label,kind}

function barometerCandidate(actionId){
  return {actionId,primaryCodes:new Set(),evidence:new Map(),criticalNow:false,p40Direct:false}
}
function barometerAddEvidence(candidate,code,kind='SUPPORT'){
  if(!candidate||!BAROMETER_ALGORITHM_SPEC.signals[code])return;
  if(!candidate.evidence.has(code))candidate.evidence.set(code,barometerEvidence(code,kind))
}
function barometerEnsureCandidate(candidates,actionId){
  if(!actionId||!BAROMETER_ALGORITHM_SPEC.actions[actionId])return null;
  if(!candidates.has(actionId))candidates.set(actionId,barometerCandidate(actionId));
  return candidates.get(actionId)
}
function barometerRelevantPrimaryPCodes(actionId){
  return Object.entries(BAROMETER_ALGORITHM_SPEC.triggers)
    .filter(([code,trigger])=>code.startsWith('P')&&trigger.actionId===actionId&&(trigger.role==='PRIMARY'||trigger.role==='CONDITIONAL_PRIMARY'))

function barometerFormalPracticeConfirmed(input,actionId){

function barometerActionClarification(actionId,input,formal=false){
  if(actionId==='C01'){
    const left=BAROMETER_ALGORITHM_SPEC.clarifications['M1-A3'],right=BAROMETER_ALGORITHM_SPEC.clarifications['M5-A3'];

      :`${left.base} ${right.base}`

function barometerSpecialClarifications(input,candidates){
  const byModule={1:[],2:[],3:[],4:[],5:[],6:[],7:[]};
  if(input.E.states.E31==='S')byModule[7].push({id:'E31_ROUTE',text:'Уточніть, де і ким проявляється неприйнятна поведінка: у внутрішній взаємодії, у нерівному рішенні або з боку клієнта, пасажира, пацієнта чи іншої третьої сторони. Перевірте 2–3 конкретні ситуації без розкриття персональних даних і після цього маршрутизуйте дію до модуля 3, 4 або 7.'});
  if(input.P.states.P18==='G'&&!candidates.has('M3-A2')&&!candidates.has('M3-A3'))byModule[3].push({id:'P18_ROUTE',text:'Перегляньте 3–5 повторюваних випадків і визначте, що саме повторюється: помилки чи інциденти або звернення про неприйнятну поведінку. Після цього використайте P18 як підтвердження відповідно M3-A2 або M3-A3.'});

  if(input.P.states.P40==='G'&&!input.P.p40Applicable)byModule[7].push({id:'P40_ROUTE',text:'Перевірте, чи мають працівники цього середовища контакт із клієнтами, пасажирами, пацієнтами, відвідувачами або іншими третіми особами, від яких можлива агресія чи насильство. Перегляньте інциденти, near miss і типові сценарії роботи. Лише за підтвердженої актуальності цього ризику маршрутизуйте P40 до дії M7-A3.'});
  return byModule
}
function barometerBuildCandidates(input){
  const candidates=new Map(),activeCodes=Object.keys(BAROMETER_ALGORITHM_SPEC.triggers).filter(code=>barometerSignalActive(input,code));
  for(const code of activeCodes){
    const trigger=BAROMETER_ALGORITHM_SPEC.triggers[code];
    if(!BAROMETER_ROLE_SET.has(trigger.role))throw new Error(`Невідома роль ${trigger.role} для ${code}`);
    if(trigger.role==='PRIMARY'){
      const candidate=barometerEnsureCandidate(candidates,trigger.actionId);
      if(candidate){candidate.primaryCodes.add(code);barometerAddEvidence(candidate,code,'PRIMARY')}
    }else if(trigger.role==='CONDITIONAL_PRIMARY'&&code==='P40'&&input.P.p40Applicable){
      const candidate=barometerEnsureCandidate(candidates,trigger.actionId);
      if(candidate){candidate.primaryCodes.add(code);candidate.p40Direct=true;barometerAddEvidence(candidate,code,'PRIMARY')}
    }
  }
  for(const code of activeCodes){
    const trigger=BAROMETER_ALGORITHM_SPEC.triggers[code];
    for(const actionId of trigger.supportActionIds||[])barometerAddEvidence(candidates.get(actionId),code,'SUPPORT');
  }
  const overload=BAROMETER_ALGORITHM_SPEC.overloadCodes.some(code=>barometerSignalActive(input,code));
  if(overload&&candidates.has('M6-A1')){
    if(input.E.states.E09==='S')barometerAddEvidence(candidates.get('M6-A1'),'E09','CROSS_SUPPORT');
    if(input.E.states.E22==='S')barometerAddEvidence(candidates.get('M6-A1'),'E22','CROSS_SUPPORT');
  }
  if(candidates.has('M7-A2')&&['P37','P38','P39'].some(code=>input.P.states[code]==='G')){
    for(const code of ['P28','P17'])if(input.P.states[code]==='G')barometerAddEvidence(candidates.get('M7-A2'),code,'CROSS_SUPPORT');
    if(input.E.states.E10==='S')barometerAddEvidence(candidates.get('M7-A2'),'E10','CROSS_SUPPORT');
  }
  for(const candidate of candidates.values())candidate.criticalNow=input.criticalNow&&candidate.actionId.startsWith('M7-');
  return candidates
}
function barometerMergeCandidates(actionId,candidates){
  const merged=barometerCandidate(actionId);
  for(const candidate of candidates){
    for(const code of candidate.primaryCodes)merged.primaryCodes.add(code);
    for(const [code,evidence] of candidate.evidence)merged.evidence.set(code,evidence);
    merged.criticalNow=merged.criticalNow||candidate.criticalNow;
    merged.p40Direct=merged.p40Direct||candidate.p40Direct;
  }
  return merged
}
function barometerApplyDedup(input,candidates){
  const crossRefs={1:[],2:[],3:[],4:[],5:[],6:[],7:[]};
  if(candidates.has('M1-A3')&&candidates.has('M5-A3')){

  'M1-A3':{title:'Вбудувати ясність ролей і вимог в управління змінами',aspect:'Ясність ролей і вимог під час змін',why:'Під час змін навіть добре визначені ролі швидко стають неактуальними, якщо працівникам не пояснити вплив змін на їхню роботу і не оновити вимоги.',what:'До впровадження суттєвої зміни пояснюйте її причину, очікуваний вплив на роботу та ключові строки. Після рішення оновлюйте ролі, відповідальність, пріоритети й вимоги там, де вони змінилися, та повідомляйте це працівникам.',check:'Для 2 останніх або наступних суттєвих змін відновіть послідовність: коли працівників поінформували, коли оновили ролі та вимоги і чи перевірили їх розуміння після впровадження.'},
  'M2-A1':{title:'Закріпити мінімальний стандарт підтримувального керівництва',aspect:'Повсякденна підтримка керівника',why:'Підтримка керівника має проявлятися в повсякденній роботі, а не лише в наявності формальних зустрічей або загальних очікувань.',what:'Визначте мінімальний стандарт взаємодії керівника з командою: поважне ставлення, регулярний контакт, конкретний зворотний зв’язок, обговорення робочих перешкод і домовленість про подальші дії. Стандарт має бути реалістичним для навантаження керівників.',check:'Перегляньте 3-5 недавніх розмов у кількох командах і перевірте, чи після обговорення проблеми була конкретна відповідь, домовленість і подальша дія, а не лише факт проведення зустрічі.'},
  'M2-A2':{title:'Дати керівникам реальні можливості вирішувати проблеми команди',aspect:'Повноваження, ресурси та передавання проблем',why:'Керівник не може підтримати команду, якщо йому бракує повноважень, часу, ресурсів або зрозумілого способу передати проблему туди, де її можна вирішити.',what:'Визначте, які питання керівник має вирішувати сам, які ресурси для цього доступні і куди передавати питання за межами його повноважень. Для типових проблем зафіксуйте відповідальних і очікуваний строк відповіді.',check:'Простежте 3-5 реальних ситуацій від моменту виникнення проблеми до рішення: що керівник міг зробити сам, куди звертався, скільки тривало вирішення і що реально змінилося для команди.'},
  'M2-A3':{title:'Розвивати й перевіряти управлінські навички там, де вони потрібні',aspect:'Управлінські навички та межі ролі',why:'Навчання доречне лише тоді, коли процеси, ресурси та повноваження вже визначені, а прогалина справді пов’язана з тим, як керівник застосовує потрібні навички.',what:'Визначте конкретні управлінські ситуації, у яких бракує навичок, і працюйте саме з ними через короткі практичні сценарії, розбір кейсів, наставництво або супервізію. Не використовуйте навчання як заміну відсутнім ресурсам, повноваженням чи процесам.',check:'Дайте керівникам 3-5 типових робочих сценаріїв і перевірте, чи вони правильно визначають свої дії, межі ролі, доступні ресурси та момент перенаправлення. Оцінюйте фактичну поведінку, а не участь у навчанні.'},
  'M3-A1':{title:'Створити в команді безпечний спосіб говорити про проблеми, ставити запитання, просити допомоги й висловлювати незгоду',aspect:'Безпечна можливість говорити про проблеми',why:'Психологічна безпека визначається не лише наявністю каналів для висловлювання, а й тим, що відбувається після того, як людина поставила складне запитання, попросила допомоги або висловила незгоду.',what:'Домовтеся про зрозумілі способи піднімати проблеми й незгоду в команді. Керівникам потрібно активно запрошувати різні думки, дякувати за важливий сигнал, не карати за добросовісне висловлювання і повертатися з відповіддю або наступним кроком.',check:'Візьміть 3-5 недавніх ситуацій, коли працівник підняв проблему, попросив допомоги або висловив незгоду. Перевірте реакцію, отриману відповідь, можливі негативні наслідки і те, чи відбулася подальша дія.'},
  'M3-A2':{title:'Запровадити розбір помилок і інцидентів з фокусом на причини та запобігання повторенню',aspect:'Розбір помилок, збоїв та інцидентів',why:'Якщо після помилки увага зосереджується лише на винній людині, організація може не побачити робочі умови й системні причини, які здатні спричинити повторення.',what:'Для значущих помилок і збоїв з’ясуйте, що сталося, які умови цьому сприяли, які системні чинники треба змінити, хто відповідає за зміни і коли перевірятиметься результат. Окремо заохочуйте повідомлення про події, які могли призвести до шкоди, але не призвели. Аналіз причин проводьте окремо від дисциплінарної відповідальності.',check:'Перегляньте 3-5 останніх помилок, збоїв або інцидентів: чи були визначені системні причини, чи змінили умови або процеси і чи перевірили виконання заходів. Окремо перевірте, чи люди продовжують повідомляти про помилки без страху приниження.'},
  'M3-A3':{title:'Забезпечити безпечний канал і надійне реагування на неприйнятну поведінку',aspect:'Повідомлення та реагування на неприйнятну поведінку',why:'Для повідомлень про мобінг, домагання, дискримінацію або принизливе ставлення недостатньо мати формальний канал. Важливі конфіденційність, захист від негативних наслідків і зрозумілий неупереджений розгляд.',what:'Забезпечте щонайменше один конфіденційний спосіб звернення поза безпосереднім керівником. Визначте перші дії після повідомлення, захист від негативних наслідків, порядок неупередженого розгляду, інформування заявника та доступну підтримку.',check:'Проведіть перевірку маршруту без використання реальної конфіденційної скарги: чи може працівник знайти канал, чи знають відповідальні перші дії, як захищається конфіденційність і як контролюється завершення розгляду.'},
  'M4-A1':{title:'Зробити значущі рішення щодо роботи, оцінювання й винагороди зрозумілими та обґрунтованими',aspect:'Справедливість значущих рішень, оплати та винагороди',why:'Відчуття несправедливості посилюється, коли критерії значущих рішень незрозумілі, застосовуються непослідовно або працівник не може отримати пояснення.',what:'Визначте зрозумілі критерії для оцінювання, оплати, винагороди та інших значущих рішень. Для порівнюваних ролей перевіряйте суттєві відмінності та фіксуйте обґрунтування. Передбачте спосіб отримати пояснення і переглянути рішення, якщо є підстава.',check:'Виберіть 5-10 останніх рішень щодо оплати, оцінювання, винагороди або розподілу роботи. Перевірте критерії, пояснення, винятки і суттєві відмінності між порівнюваними ролями. Саму різницю не трактуйте як доказ дискримінації.'},
  'M4-A2':{title:'Забезпечити фактично рівний доступ до ресурсів, розвитку й кар’єрних можливостей',aspect:'Рівний доступ до ресурсів і розвитку',why:'Формально однакові можливості не гарантують рівного доступу, якщо інформація, ресурси або розвиток фактично доступні не всім порівнюваним групам.',what:'Зробіть інформацію про ресурси, навчання й розвиток доступною для всіх відповідних працівників. Перевірте критерії відбору та фактичний доступ за підрозділами, локаціями, змінами і форматами роботи, а суттєві відмінності аналізуйте окремо.',check:'Порівняйте кілька порівнюваних груп: хто отримав інформацію, хто мав доступ до ресурсу або можливості розвитку, хто подавався і кого відібрали. Для повторюваних відмінностей перевірте конкретну причину та критерії.'},
  'M4-A3':{title:'Забезпечити справедливу адаптацію індивідуальних потреб і захист від нерівного ставлення',aspect:'Адаптація індивідуальних потреб і рівне ставлення',why:'Індивідуальні потреби потребують передбачуваного і конфіденційного розгляду, а ознаки нерівного ставлення - перевірки конкретних рішень без передчасних юридичних висновків.',what:'Визначте конфіденційний порядок звернення щодо адаптації робочих умов, критерії розгляду, відповідальних і строк перегляду домовленостей. Якщо є сигнал нерівного ставлення, перевіряйте конкретне рішення, його критерії та фактичне виконання.',check:'На кількох анонімізованих кейсах простежте шлях від звернення до рішення, виконання та перегляду. Перевірте, чи подібні ситуації розглядаються за однаковою логікою і чи працівник знає, куди звернутися.'},
  'M5-A1':{title:'Розширити обґрунтовану самостійність у виконанні роботи',aspect:'Самостійність у виконанні роботи',why:'Надмірні погодження, контроль або нечіткі межі самостійності можуть зменшувати вплив працівника на спосіб, час і темп виконання роботи без реальної потреби для безпеки чи якості.',what:'Для типових ролей визначте рішення, які працівник може приймати самостійно. Відокремте обмеження, необхідні для безпеки, якості або законодавчих вимог, від зайвих погоджень, затримок і надмірного контролю, включно з цифровим моніторингом.',check:'У 2-3 типових ролях порівняйте формально визначені межі самостійності з реальною кількістю погоджень і затримок. Перевірте, чи працівник і керівник однаково розуміють, які рішення можна приймати без додаткового дозволу.'},
  'M5-A2':{title:'Залучати працівників до вдосконалення роботи та управління психосоціальними ризиками',aspect:'Участь у плануванні та вдосконаленні',why:'Сам факт збору пропозицій не означає реальної участі. Працівники мають бачити, у яких питаннях вони можуть впливати на рішення і що відбулося з їхніми пропозиціями.',what:'Визначте регулярні способи залучати працівників до планування, вдосконалення процесів і визначення заходів щодо психосоціальних ризиків. До обговорення надавайте достатньо інформації та чітко пояснюйте межі впливу.',check:'Простежте 3-5 останніх пропозицій або консультацій: що працівники могли змінити, що запропонували, що було враховано або обґрунтовано не прийнято і який результат вони отримали.'},
  'M5-A3':{title:'Проводити консультації до рішень і завжди повертати результат',aspect:'Участь у змінах та зворотний зв’язок',why:'Консультація має сенс лише тоді, коли відбувається до остаточного рішення і працівники розуміють, що було враховано після їхнього внеску.',what:'Перед суттєвими змінами визначайте питання, на які працівники ще можуть вплинути, надавайте необхідну інформацію і проводьте консультацію до остаточного рішення. Після рішення повідомляйте, що враховано, що не враховано і чому.',check:'Для 2-3 останніх суттєвих змін відновіть послідовність: коли формувалося рішення, коли залучили працівників, що ще можна було змінити і яку відповідь вони отримали після рішення.'},
  'M6-A1':{title:'Усунути системне перевантаження і забезпечити реальне відновлення',aspect:'Навантаження, відпочинок і межі робочого часу',why:'Коли обсяг, строки або графік системно не залишають часу для якісного виконання роботи і відновлення, психологічна підтримка не усуває джерело ризику.',what:'Перегляньте обсяг роботи, пріоритети, строки, чисельність, ресурси, графіки та процеси. Забезпечте реальну можливість робити передбачені перерви і не вимагайте постійної доступності поза робочим часом, крім обґрунтованих кризових або екстрених ситуацій.',check:'Перегляньте 2-3 останні періоди перевантаження: понаднормову роботу, пропущені перерви, зміну пріоритетів і рішення керівників. Після змін перевірте, чи звичайний обсяг роботи реально виконується в робочий час і чи зменшилися системні перешкоди для відновлення.'},
  'M6-A2':{title:'Зробити підтримку доступною, конфіденційною і зрозумілою для працівників та керівників',aspect:'Доступ до психологічної підтримки та межі ролі керівника',why:'Наявність сервісу не допомагає, якщо працівники не знають, як ним скористатися, не довіряють конфіденційності або керівники не розуміють меж своєї ролі та порядок перенаправлення.',what:'Чітко опишіть доступні види підтримки, спосіб звернення, правила конфіденційності та інформацію, яку компанія може або не може отримувати. Керівникам дайте прості орієнтири щодо підтримувальної розмови, меж їхньої ролі та перенаправлення до відповідних фахівців.',check:'Анонімно перевірте, чи працівники знають, куди і як звернутися, та чи розуміють правила конфіденційності. Керівникам дайте 2-3 типові ситуації і перевірте, чи вони правильно визначають свої дії та момент перенаправлення.'},
  'M6-A3':{title:'Визначити безпечний порядок повернення до роботи та реагування після складних подій',aspect:'Повернення після відсутності та підтримка після складних подій',why:'Після тривалої відсутності або потенційно травматичної події працівникові можуть бути потрібні тимчасові зміни умов, відпочинок, практична підтримка або поступове повернення, а відповідальні мають знати порядок дій заздалегідь.',what:'Для повернення після тривалої відсутності визначте конфіденційне обговорення потреб, можливі тимчасові адаптації, поступове повернення за потреби і дату перегляду домовленостей. Після потенційно травматичної події спочатку забезпечте безпеку, практичну допомогу й відпочинок, а психологічну підтримку пропонуйте добровільно. Не вимагайте детального групового обговорення пережитої події.',check:'Перегляньте кілька анонімізованих випадків повернення або проведіть сценарну перевірку потенційно травматичної події. Перевірте, чи відповідальні знають порядок дій, чи домовленості виконуються і чи передбачений повторний перегляд потреб.'},
  'M7-A1':{title:'Усувати небезпечні умови та бар’єри, що заважають безпечно виконувати роботу',aspect:'Безпечні та доступні умови роботи',why:'Небезпечна умова або фізичний, цифровий чи інформаційний бар’єр має усуватися в самому робочому середовищі, а не компенсуватися лише індивідуальними зусиллями працівника.',what:'Пройдіть типові робочі сценарії на місці і визначте конкретні небезпечні умови або бар’єри в маршрутах, робочих місцях, обладнанні, цифрових інструментах чи доступі до інформації. Визначте відповідального, строк і спосіб усунення кожної суттєвої перешкоди.',check:'Повторно пройдіть 2-3 ті самі робочі сценарії після змін і перевірте, чи бар’єр або небезпечна умова справді усунені та чи не виникли нові перешкоди.'},

function barometerFinalClusterNumber(cluster){
  const raw=String(cluster?.id||''),match=raw.match(/(?:C)?(\d+)$/);
  return match?match[1]:raw
}
function barometerFinalClusterCopy(moduleId,cluster){
  return BAROMETER_FINAL_CLUSTER_COPY[String(moduleId)+':'+barometerFinalClusterNumber(cluster)]||{
    title:cluster.name,
    topic:'цього аспекту',
    practice:'підтримує відповідну організаційну практику',
    risk:'У цьому аспекті є ознаки, які потребують додаткової перевірки.'
  }
}
function barometerFinalEvidenceIntro(action,copy){
  const s=new Set(action.sources||[]);
  const aspect=String(copy?.aspect||'організаційній практиці').toLocaleLowerCase('uk-UA');
  if(s.has('E')&&s.has('L')&&s.has('P'))return `Оцінки працівників і керівників указують на труднощі в аспекті «${aspect}», а організаційний чекап показує прогалину у відповідній практиці.`;
  if(s.has('E')&&s.has('L'))return `Працівники й керівники незалежно вказують на труднощі в аспекті «${aspect}».`;
  if(s.has('E')&&s.has('P'))return `Працівники вказують на труднощі в аспекті «${aspect}», а організаційний чекап показує прогалину у відповідній практиці.`;
  if(s.has('L')&&s.has('P'))return `Керівники вказують на труднощі в аспекті «${aspect}», а організаційний чекап показує прогалину у відповідній практиці.`;
  if(s.has('P'))return `Організаційний чекап показує прогалину в аспекті «${aspect}».`;
  if(s.has('E'))return `Працівники вказують на труднощі в аспекті «${aspect}».`;
  if(s.has('L'))return `Керівники вказують на труднощі в аспекті «${aspect}».`;
  return '';
}
function barometerFinalAction(action){
  const copy=BAROMETER_FINAL_ACTION_COPY[action.final_action_id]||BAROMETER_FINAL_ACTION_COPY[action.id];
  if(!copy)return action;
  const intro=barometerFinalEvidenceIntro(action,copy);
  return Object.assign({},action,{
    title:copy.title,
    why:(intro?intro+' ':'')+copy.why,
    action:copy.what,
    check:copy.check,
    issues:[{source:'',topic:copy.aspect}],
    clarifications:action.clarifications||[]
  })
}
const barometerSemanticInterpretationBeforeTextAudit=barometerSemanticInterpretation;
barometerSemanticInterpretation=function(){
  const analysis=barometerSemanticInterpretationBeforeTextAudit();
  const mapped=new Map();
  analysis.actions=(analysis.actions||[]).map(a=>{const x=barometerFinalAction(a);mapped.set(x.final_action_id,x);return x});
  for(const moduleId of Object.keys(analysis.modules||{})){
    const mod=analysis.modules[moduleId];
    mod.actions=(mod.actions||[]).map(a=>mapped.get(a.final_action_id)||barometerFinalAction(a));
  }
  return analysis
};

  else if(e==='T')parts.push('Для цього аспекту в опитуванні працівників недостатньо застосовних відповідей, тому оцінку досвіду цієї групи не можна вважати достатньо надійною.');
  else if(e==='X')parts.push('Вибірка працівників недостатня для окремого аналізу цього середовища.');


  if(l==='S')parts.push('Керівники також вказують на труднощі щодо '+c.topic+'.');
  else if(l==='N')parts.push('Керівники загалом не оцінюють цей аспект як проблемний.');
  else if(l==='T')parts.push('Для цього аспекту в опитуванні керівників недостатньо застосовних відповідей, тому оцінку досвіду цієї групи не можна вважати достатньо надійною.');
  else if(l==='X')parts.push('Вибірка керівників недостатня для окремого аналізу цього середовища.');


  if(p==='G')parts.push('Організаційний чекап показує прогалину в тому, як компанія '+c.practice+'.');
  else if(p==='N')parts.push('Організаційний чекап не показує прогалини у відповідній практиці.');
  else if(p==='T')parts.push('За організаційним чекапом недостатньо підтверджених даних, щоб оцінити, наскільки компанія '+c.practice+'.');


  return c.title+': '+parts.join(' ')
}
function barometerFinalAttention(row,semantic,analysis){
  const issueClusters=(semantic.clusters||[]).filter(c=>c.e==='S'||c.l==='S'||c.p==='G');
  const strongClusters=(semantic.clusters||[]).filter(c=>c.e==='N'&&c.l==='N'&&c.p==='N');
  const out=[];
  const m1PracticeGap=row.m===1&&['P01','P02','P03','P06'].some(code=>analysis?.input?.P?.states?.[code]==='G');
  if(m1PracticeGap){
    out.push('Організаційний чекап показує прогалини в тому, як визначаються і підтримуються ролі та робочі вимоги: не всюди однозначно закріплені відповідальність і повноваження, пріоритети та критерії результату, а після змін фактична робота не завжди повторно звіряється з визначеними ролями.')
  }
  for(const cluster of issueClusters){
    if(out.length>=3)break;
    if(m1PracticeGap&&cluster.p==='G'&&cluster.e!=='S'&&cluster.l!=='S')continue;
    const c=barometerFinalClusterCopy(row.m,cluster);
    if(!out.includes(c.risk))out.push(c.risk)
  }
  if(strongClusters.length&&out.length<3){
    const c=barometerFinalClusterCopy(row.m,strongClusters[0]);
    out.push('Сильна сторона - '+c.title.toLocaleLowerCase('uk-UA')+': працівники й керівники сприятливо оцінюють цей аспект, а організаційний чекап показує, що відповідна практика працює. Її варто зберігати і повторно перевіряти після суттєвих змін.')
  }
  if(!out.length){
    out.push('У доступних даних конкретних проблемних сигналів не виявлено. Висновок потрібно читати разом зі статусами джерел і примітками про якість даних.')
  }
  return out.slice(0,3)
}
function barometerFinalModuleSynthesis(row,semantic){
  if(row.m===5&&row.e==='Хмарно'&&row.l==='Буря'&&row.p==='Хмарно')return 'За всіма трьома джерелами є підстави перевірити автономію та вплив. Керівники оцінюють ситуацію найкритичніше; працівники також вказують на окремі труднощі, а організаційний чекап показує, що частина відповідних практик працює не повністю або нерівномірно.';
  if(row.m===6&&row.e==='Буря'&&row.l==='Хмарно'&&row.p==='Туман')return 'Працівники дають виражений негативний сигнал щодо здоров’я та відновлення, у керівників також є окремі проблемні оцінки. За організаційним чекапом недостатньо підтверджених даних, тому він не може ні підтвердити, ні спростувати ці результати. Далі потрібно визначити, яких саме аспектів стосуються проблемні оцінки і які організаційні практики потрібно перевірити.';
  const focus=BAROMETER_FINAL_MODULE_GENITIVE[row.m]||'цього модуля';
  if(row.e==='Ясно'&&row.l==='Ясно'&&row.p==='Ясно')return 'Усі три джерела узгоджено показують сприятливу ситуацію щодо '+focus+'. Наявні практики варто зберігати і повторно перевіряти після суттєвих змін.';
  const surveyClause=(label,state)=>{
    const genitive=label==='працівники'?'працівників':'керівників';
    if(state==='Буря')return label+' дають виражений негативний сигнал щодо '+focus;
    if(state==='Хмарно')return label+' вказують на окремі проблемні аспекти щодо '+focus;
    if(state==='Ясно')return label+' загалом сприятливо оцінюють ситуацію щодо '+focus;
    if(state==='Туман')return 'для цього модуля в опитуванні '+genitive+' недостатньо застосовних відповідей, тому оцінку досвіду цієї групи не можна вважати достатньо надійною';
    if(state==='Недостатня вибірка')return 'дані '+genitive+' не включено в окремий аналіз через недостатню вибірку';
    return label+' не мають окремого статусу щодо '+focus
  };
  const surveyText=surveyClause('працівники',row.e)+'; '+surveyClause('керівники',row.l)+'.';
  let practiceText='';
  if(row.p==='Буря')practiceText='Організаційний чекап показує суттєві прогалини в практиках щодо '+focus+'.';
  else if(row.p==='Хмарно')practiceText='Організаційний чекап показує, що частина практик щодо '+focus+' працює не повністю або нерівномірно.';
  else if(row.p==='Ясно')practiceText='Організаційний чекап не показує прогалин в оцінених практиках щодо '+focus+'; це не скасовує проблемні оцінки в опитуваннях, якщо вони є.';
  else if(row.p==='Туман')practiceText='За організаційним чекапом недостатньо підтверджених даних, щоб оцінити практики щодо '+focus+'; він нічого не підтверджує і нічого не спростовує.';
  const active=(semantic?.clusters||[]).filter(cluster=>cluster.e==='S'||cluster.l==='S'||cluster.p==='G').slice(0,2);
  const detail=active.length?'Насамперед потрібно розглянути аспекти «'+active.map(cluster=>barometerFinalClusterCopy(row.m,cluster).title.toLocaleLowerCase('uk-UA')).join('» і «')+'».' :'';
  return [surveyText.charAt(0).toLocaleUpperCase('uk-UA')+surveyText.slice(1),practiceText,detail].filter(Boolean).slice(0,3).join(' ')
}
function barometerFinalClarifications(semantic){
  const out=[];
  for(const item of semantic.clarifications||[]){
    let text='';
    if(item.actionId&&BAROMETER_FINAL_CLARIFICATIONS[item.actionId])text=BAROMETER_FINAL_CLARIFICATIONS[item.actionId];
    else if(String(item.id||'').includes('E31_ROUTE'))text='Перевірте 2-3 конкретні ситуації без розкриття персональних даних і визначте, де виникла неприйнятна поведінка: у внутрішній взаємодії, під час значущого рішення або з боку клієнта, пасажира, пацієнта чи іншої третьої особи. Від цього залежить, який організаційний механізм потрібно перевіряти далі.';
    else if(String(item.id||'').includes('P18_ROUTE'))text='Перегляньте 3-5 повторюваних випадків і визначте, що саме повторюється: помилки чи інциденти або звернення про неприйнятну поведінку. Після цього перевіряйте саме відповідний процес реагування.';
    else if(String(item.id||'').includes('P24_ROUTE'))text='Порівняйте кілька груп або анонімізованих рішень і визначте, де саме виникає суттєва відмінність: в оплаті чи інших рішеннях, у доступі до ресурсів і розвитку або в адаптації індивідуальних потреб. Не трактуйте саму відмінність як доказ дискримінації.';
    else if(String(item.id||'').includes('P40_ROUTE'))text='Перевірте, чи мають працівники цього середовища контакт із клієнтами, пасажирами, пацієнтами, відвідувачами або іншими третіми особами, від яких можлива агресія чи насильство. Перегляньте інциденти, події, які могли призвести до шкоди, але не призвели, та типові сценарії роботи.';
    else if(String(item.id||'').includes('-P-T'))text='Для практик, за якими бракує підтверджених даних, перевірте охоплення, спосіб реалізації та 2-3 фактичні приклади застосування. Брак підтверджень не означає, що практика відсутня.';
    else if(String(item.id||'').includes('-EL-T'))text='Перевірте, чому для цього аспекту недостатньо застосовних відповідей: чи справді він стосується роботи цієї групи, чи однаково зрозуміле формулювання та чи правильно визначені межі робочого середовища.';
    if(text&&!out.includes(text))out.push(text)
  }
  for(const action of semantic.actions||[]){
    if((action.classification==='CONDITIONAL'||(action.clarifications||[]).length)&&BAROMETER_FINAL_CLARIFICATIONS[action.final_action_id]){
      const text=BAROMETER_FINAL_CLARIFICATIONS[action.final_action_id];
      if(!out.includes(text))out.push(text)
    }
  }
  return out.slice(0,3)
}
function barometerFinalDataNotes(semantic){

}
function barometerFinalView(row,semantic,analysis){
  const alignmentSeen=new Set();
  const alignment=(semantic.clusters||[]).map(cluster=>{
    const title=barometerFinalClusterCopy(row.m,cluster).title,text=barometerFinalClusterAlignment(cluster,row.m,analysis.input);
    return {title,text,standalone:!text.startsWith(title+': ')}
  }).filter(item=>{
    const key=String(item.text||'').replace(/\s+/g,' ').trim();
    if(!key||alignmentSeen.has(key))return false;
    alignmentSeen.add(key);
    return true
  });
  return {
    lead:barometerFinalModuleSynthesis(row,semantic),
    attention:barometerFinalAttention(row,semantic,analysis),
    alignment,
    clarifications:barometerFinalClarifications(semantic),
    actions:(semantic.actions||[]).map(barometerFinalAction),
    dataNotes:barometerFinalDataNotes(semantic),
    crossRefs:semantic.crossRefs||[]
  }
}
function barometerVisibleTextCleanup(text){
  return String(text||'')
    .replace(/[—–]/g,'-')
    .replace(/near miss/gi,'подія, яка могла призвести до шкоди, але не призвела')
    .replace(/\bwellness\b/gi,'програми підтримки добробуту')
    .replace(/\bfeedback\b/gi,'зворотний зв’язок')
    .replace(/фідбек/gi,'зворотний зв’язок')
    .replace(/\bEAP\b/g,'програма допомоги працівникам')
    .replace(/\btabletop\b/gi,'сценарна перевірка')
    .replace(/risk-management/gi,'управління ризиками')
    .replace(/\bgovernance\b/gi,'системне управління')
    .replace(/\breferral\b/gi,'перенаправлення')
    .replace(/speak-up/gi,'можливість безпечно говорити про проблеми')
    .replace(/стрес-менеджмент/gi,'індивідуальне управління стресом')
}
function barometerCleanVisibleText(root){
  if(!root||!document.createTreeWalker)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  for(const node of nodes){
    const parent=node.parentElement;
    if(!parent||parent.closest('script,style'))continue;
    const cleaned=barometerVisibleTextCleanup(node.nodeValue);
    if(cleaned!==node.nodeValue)node.nodeValue=cleaned
  }
}

    :'';
  const reportButton=ready.length
    ?`<button class="btn secondary" data-a="report"${needsChoice?' onclick="const chosen=document.getElementById(\'report-env-select-final\');if(chosen)S.env=chosen.value"':''}>Завантажити звіт</button>`
    :`<button class="btn secondary" type="button" disabled title="Спочатку мають бути готові результати робочого середовища">Завантажити звіт</button>`;
  const hasPlan=currentPlan().length>0;
  const planButton=hasPlan
    ?'<button class="btn secondary" data-a="export">Завантажити План Excel</button>'
    :'<button class="btn secondary" type="button" disabled title="План організаційних дій поки порожній">Завантажити План Excel</button>';
  const emptyPlanNote=hasPlan?'':'<p class="muted">План організаційних дій поки порожній. Додайте хоча б одну дію, щоб завантажити Excel.</p>';
  const footer=`<section class="section plan-downloads"><div class="env-card"><div class="toolbar"><div><h3>Завантаження результатів</h3><p class="muted">Після перегляду та редагування Плану завантажте потрібні файли.</p>${emptyPlanNote}</div></div><div class="card-actions" style="align-items:end">${selector}${reportButton}${planButton}</div></div></section>`;
  const pos=html.lastIndexOf('</div>');
  return pos>=0?html.slice(0,pos)+footer+html.slice(pos):html+footer
};


const barometerRenderBeforeTextAudit=render;
render=function(){
  const out=barometerRenderBeforeTextAudit();
  barometerCleanVisibleText(document.body);
  return out
};
/* BAROMETER_FINAL_TEXT_AUDIT_2026_09_23_END */


render();
</script>
