<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Барометр психосоціальної безпеки робочого середовища</title>
<style>
:root{--paper:#f3f1ec;--white:#fbfaf7;--ink:#394649;--muted:#6e7878;--line:#d7d2c8;--gold:#c58a35;--gold-soft:#f1e2c6;--teal:#617f7e;--teal-soft:#dfe8e5;--storm:#985d42;--storm-soft:#f2e3da;--cloud:#7b766f;--cloud-soft:#CBD5E1;--fog:#9aa4a3;--fog-soft:#F1F3F4;--shadow:0 16px 45px rgba(57,70,73,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--white);color:var(--ink);font-family:Arial,sans-serif;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;gap:12px;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-weight:700}.brand-mark{width:30px;height:30px;border:6px solid var(--gold);border-right-color:var(--teal);border-radius:50%;position:relative}.brand-mark:after{content:"";position:absolute;left:8px;top:6px;width:10px;height:2px;background:var(--ink);transform:rotate(-42deg);transform-origin:left}.spacer{flex:1}.saved{font-size:13px;color:var(--muted)}


.shell{max-width:1180px;margin:0 auto;padding:34px 24px 64px}
.start{min-height:100vh;display:grid;place-items:center;padding:28px 24px;background:linear-gradient(118deg,#f4f1ea 0%,#ece8df 62%,#e7e0d6 100%);position:relative;overflow:hidden}
.start:before{content:'';position:absolute;inset:-8% auto -8% -16%;width:54%;background:radial-gradient(circle at 18% 40%,rgba(255,255,255,.95) 0%,rgba(255,248,235,.74) 22%,rgba(255,242,215,.26) 42%,rgba(255,255,255,0) 70%);pointer-events:none}
.start-card{position:relative;isolation:isolate;width:min(1120px,100%);background:#fbfaf7;border:1px solid rgba(215,210,200,.9);border-radius:0;padding:0;box-shadow:var(--shadow);overflow:hidden}
.start-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:0;align-items:stretch;min-height:620px}
.start-copy{position:relative;padding:38px 46px 34px 48px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03)),linear-gradient(90deg,#fbfaf7 0%,#f4f1ea 100%)}
.start-copy:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.012),rgba(0,0,0,.012) 2px,transparent 2px,transparent 12px);opacity:.45;pointer-events:none}
.start-copy:after{content:'';position:absolute;inset:-12% auto -12% -16%;width:66%;background:radial-gradient(circle at 16% 34%,rgba(255,255,255,.98),rgba(255,249,238,.84) 24%,rgba(255,241,211,.34) 42%,rgba(255,255,255,0) 70%);transform:rotate(-11deg);pointer-events:none}
.start-copy-top,.start-copy-bottom,.start-actions,.demo-link{position:relative;z-index:5}
.eyebrow{font-size:12px;letter-spacing:.11em;color:var(--teal);font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin:0}
.eyebrow:before{content:'';width:52px;height:2px;background:var(--teal);border-radius:99px}
h1,h2,h3,h4{line-height:1.15}
.hero-title{margin:34px 0 0;display:grid;gap:4px;max-width:460px}
.hero-title-main{font-size:clamp(58px,7vw,78px);line-height:.96;font-weight:700;letter-spacing:-.05em;color:var(--gold)}
.hero-title-sub{font-size:clamp(28px,3.1vw,36px);line-height:1.16;font-weight:400;letter-spacing:-.03em;color:var(--ink)}
h2{font-size:clamp(30px,4vw,46px);font-weight:400;letter-spacing:-.03em;margin:0 0 16px}
.lead{font-size:19px;color:#586566}
.fru-logo{display:block;width:165px;height:auto;margin:0 0 -28px -30px}
@media(max-width:860px){.fru-logo{margin-left:-24px}}
.start-copy-bottom{margin-top:18px}
.start-version{display:flex;align-items:center;gap:12px;font-size:14px;color:#607575;letter-spacing:.02em}
.start-version:before{content:'';width:52px;height:2px;background:var(--gold);border-radius:99px}

.hero-dial-wrap{position:absolute;z-index:3;left:52%;top:49%;transform:translate(-50%,-50%);width:min(86%,470px);aspect-ratio:1;background:transparent;border:0;box-shadow:none;backdrop-filter:none}
.hero-dial{width:100%;height:100%;display:block}
.hero-dial .dial-ring{fill:none;stroke:rgba(255,255,255,.72);stroke-width:2}
.hero-dial .dial-seg{fill:none;stroke-width:15;stroke-linecap:round}
.hero-dial .dial-label{font-family:Arial,sans-serif;fill:#394649;font-size:19px;font-weight:700;text-anchor:middle}
.hero-dial .dial-icon{font-family:Arial,sans-serif;font-size:29px;text-anchor:middle}
.hero-dial .needle{stroke:#485758;stroke-width:6;stroke-linecap:round}
.hero-dial .needle-shadow{stroke:rgba(57,70,73,.16);stroke-width:11;stroke-linecap:round}
.hero-dial .hub{fill:#b56d39;stroke:#f8efe7;stroke-width:6}
.action-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px;position:relative;z-index:6}
.action-card{position:relative;z-index:7;pointer-events:auto;border:1px solid rgba(215,210,200,.95);background:rgba(255,255,255,.92);border-radius:18px;padding:22px;text-align:left;min-height:145px;backdrop-filter:blur(2px)}
.action-card strong{display:block;font-size:19px;margin-bottom:8px}
.action-card span{color:var(--muted)}
.action-card:disabled{opacity:.55;cursor:not-allowed}
.demo-link{pointer-events:auto;align-self:flex-start;margin-top:18px;border:none;background:transparent;color:#7d571f;padding:0;text-decoration:underline;text-underline-offset:3px}
.btn{border:1px solid transparent;border-radius:10px;padding:12px 16px;font-weight:700;background:#fff;color:var(--ink)}.btn.primary{background:var(--gold);color:#242a2b}.btn.secondary{background:var(--ink);color:#fff}.btn.ghost{border-color:var(--line);background:transparent}.btn.danger{background:#f6e8e4;color:#7d3f2b}.btn.small{padding:9px 12px;font-size:13px}.action-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}.action-cards.single{grid-template-columns:1fr}.action-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:22px;text-align:left;min-height:145px}.action-card strong{display:block;font-size:19px;margin-bottom:8px}.action-card span{color:var(--muted)}.action-card:disabled{opacity:.55;cursor:not-allowed}
.panel,.card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:22px;box-shadow:0 7px 22px rgba(57,70,73,.04)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}label{font-weight:700;font-size:14px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:12px 13px;min-height:46px}textarea{min-height:86px;resize:vertical}.help,.muted{color:var(--muted)}.help{font-size:12px}.card-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.hero-mini{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin-bottom:24px}.meta{display:flex;flex-wrap:wrap;gap:8px}.pill{display:inline-flex;align-items:center;gap:6px;background:#f1eee8;border-radius:999px;padding:7px 10px;font-size:13px}.question-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.question-strip article{border-left:3px solid var(--gold);padding:14px 16px;background:#f7f5f0;border-radius:0 12px 12px 0}.question-strip strong{display:block;margin-bottom:4px}.section{margin-top:28px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.section-head p{margin:4px 0 0;color:var(--muted)}.env-list{display:grid;gap:16px}.env-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:22px;box-shadow:0 7px 22px rgba(57,70,73,.045)}.env-top{display:flex;gap:14px;align-items:start;justify-content:space-between}.env-top h3{font-size:23px;margin:0}.env-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.progressbar{height:8px;background:#ece9e3;border-radius:99px;overflow:hidden;margin:18px 0 10px}.progressbar i{display:block;height:100%;background:var(--teal)}.source-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.source-state{border:1px solid var(--line);border-radius:12px;padding:14px;background:#faf9f6}.source-state strong{display:block;margin-bottom:5px}.state-ok{color:#476f68}.state-warn{color:#8a6026}.state-muted{color:var(--muted)}.notice{border-left:4px solid var(--gold);background:#f5f1e8;padding:14px 16px;border-radius:0 10px 10px 0;margin:16px 0}.first-env-form{border:1px solid var(--line);background:#fff;border-radius:18px;padding:22px;box-shadow:0 7px 22px rgba(57,70,73,.045)}
.checkup{max-width:900px;margin:0 auto}.stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0}.stepdot{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff;font-weight:700}.stepdot.active{background:var(--gold);border-color:var(--gold)}.stepdot.done{background:var(--teal-soft);border-color:#a6b9b6}.practice{border:1px solid var(--line);border-radius:16px;background:#fff;padding:18px;margin:12px 0}.practice-title{display:flex;gap:12px}.code{background:var(--gold-soft);color:#80571f;border-radius:9px;padding:5px 7px;font-size:12px;font-weight:700;height:max-content}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.choice{border:1px solid var(--line);border-radius:10px;padding:10px;background:#faf9f6}.choice input{width:auto;min-height:auto;margin-right:7px}.checkup-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;position:sticky;bottom:0;background:rgba(251,250,247,.96);padding:14px 0;border-top:1px solid var(--line)}

    <div style="font-size:14px;font-weight:700;letter-spacing:.02em;color:#7b5b3b;margin-bottom:10px">Барометр психосоціальної безпеки робочого середовища</div>

    <div style="font-size:14px;font-weight:700;letter-spacing:.02em;color:#7b5b3b;margin-bottom:10px">Барометр психосоціальної безпеки робочого середовища</div>

    <p style="margin:0">Якщо JavaScript заборонений корпоративними налаштуваннями, зверніться до ІТ-підтримки або відкрийте портал у дозволеному сучасному браузері.</p>

<script>
const M=["Ясність ролі й вимог","Лідерство й управлінська підтримка","Психологічна безпека та взаємодія","Справедливість і рівні можливості","Автономія та вплив","Здоров’я й відновлення","Умови роботи та безпечне середовище"];
const SURVEY_ITEMS=[{"code":"E01","source":"E","module":1,"text":"Мої робочі обов’язки визначені чітко."},{"code":"E02","source":"E","module":1,"text":"Я розумію, за якими критеріями оцінюють результати моєї роботи."},{"code":"E03","source":"E","module":1,"text":"Я чітко розумію пріоритетність своїх робочих завдань."},{"code":"E04","source":"E","module":1,"text":"Якщо виникає суперечність у робочих завданнях, безпосередній керівник допомагає мені визначити черговість їх виконання."},{"code":"E05","source":"E","module":1,"text":"Про зміни, які можуть суттєво вплинути на мою роботу, мене повідомляють завчасно, щоб я міг/могла до них підготуватися."},{"code":"E06","source":"E","module":2,"text":"Безпосередній керівник ставиться до мене з повагою."},{"code":"E07","source":"E","module":2,"text":"Я отримую від безпосереднього керівника зворотний зв’язок, який допомагає мені покращувати роботу."},{"code":"E08","source":"E","module":2,"text":"Безпосередній керівник допомагає усувати робочі перешкоди, які я не можу вирішити самостійно."},{"code":"E09","source":"E","module":2,"text":"Визначаючи завдання і строки, безпосередній керівник враховує моє поточне робоче навантаження."},{"code":"E10","source":"E","module":2,"text":"Безпека і здоров’я працівників є для керівництва компанії пріоритетом поряд із бізнес-результатами."},{"code":"E11","source":"E","module":3,"text":"Я можу відкрито говорити про робочі проблеми та висловлювати конструктивну незгоду з робочими рішеннями без страху негативних наслідків для себе."},{"code":"E12","source":"E","module":3,"text":"Я можу повідомити у своїй команді про власну робочу помилку без страху приниження або осуду."},{"code":"E13","source":"E","module":3,"text":"Коли мені потрібна допомога в роботі, я можу попросити про неї у своїй команді без страху негативної оцінки."},{"code":"E14","source":"E","module":3,"text":"У своїй команді я відчуваю, що можу бути собою та робити свій внесок у роботу без страху негативного ставлення."},{"code":"E15","source":"E","module":3,"text":"Я можу повідомити про неприйнятну поведінку (дискримінацію, домагання, мобінг, принизливе ставлення) без страху негативних наслідків для себе."},{"code":"E16","source":"E","module":4,"text":"Я вважаю свою оплату праці справедливою з огляду на мої обов’язки."},{"code":"E17","source":"E","module":4,"text":"Мій внесок у роботу помічають і визнають (наприклад, через подяку, позитивний зворотний зв’язок або відзначення результатів)."},{"code":"E18","source":"E","module":4,"text":"Я маю доступ до робочої інформації та ресурсів, необхідних для виконання моїх завдань, на рівних умовах з іншими працівниками у подібних ролях."},{"code":"E19","source":"E","module":4,"text":"Я маю рівний з іншими працівниками доступ до можливостей професійного розвитку."},{"code":"E20","source":"E","module":4,"text":"На роботі до мене ставляться справедливо незалежно від моїх особистих характеристик або життєвих обставин (наприклад, віку, статі, походження, стану здоров’я, інвалідності, сімейних обставин чи досвіду військової служби)."},{"code":"E21","source":"E","module":5,"text":"Там, де це дозволяє характер моєї роботи, я маю свободу обирати підходи, методи та інструменти для виконання своїх робочих завдань."},{"code":"E22","source":"E","module":5,"text":"Там, де це дозволяє характер моєї роботи, я маю достатню гнучкість у керуванні власним робочим часом та темпом виконання завдань."},{"code":"E23","source":"E","module":5,"text":"У своїй роботі я маю можливість проявляти ініціативу та пропонувати ідеї."},{"code":"E24","source":"E","module":5,"text":"Перед ухваленням рішень про зміни, які впливають на мою роботу, я маю можливість висловити свою думку."},{"code":"E25","source":"E","module":5,"text":"Коли я повідомляю про робочу проблему, мене інформують про результат її розгляду та рішення щодо подальших дій."},{"code":"E26","source":"E","module":6,"text":"Звичайний обсяг моєї роботи можна виконати якісно в межах установленого робочого часу."},{"code":"E27","source":"E","module":6,"text":"Я маю можливість робити передбачені перерви протягом робочого дня."},{"code":"E28","source":"E","module":6,"text":"У неробочий час я можу не відповідати на робочі повідомлення чи дзвінки, крім кризових або екстрених ситуацій."},{"code":"E29","source":"E","module":6,"text":"За потреби я знаю, куди і як звернутися по психологічну допомогу, доступну працівникам компанії."},{"code":"E30","source":"E","module":6,"text":"Я впевнений/-а, що звернення по доступну в компанії психологічну допомогу залишиться конфіденційним і не матиме негативних наслідків для мене."},{"code":"E31","source":"E","module":7,"text":"На роботі до мене ставляться без дискримінації, приниження, залякування чи інших проявів неприйнятної поведінки."},{"code":"E32","source":"E","module":7,"text":"Моє робоче середовище враховує мої індивідуальні потреби, пов’язані з доступністю фізичного простору, цифрових інструментів і робочої інформації."},{"code":"E33","source":"E","module":7,"text":"Я знаю, яких правил безпеки маю дотримуватися під час виконання своєї роботи."},{"code":"E34","source":"E","module":7,"text":"Під час повітряної тривоги або іншої прямої загрози я знаю, куди маю перейти або де залишатися, щоб бути в безпеці."},{"code":"E35","source":"E","module":7,"text":"Під час кризової події я знаю, де і як отримати офіційні рекомендації та вказівки компанії щодо подальших дій."},{"code":"L01","source":"L","module":1,"text":"Я чітко розумію межі своєї управлінської ролі та рішення, які можу ухвалювати самостійно."},{"code":"L02","source":"L","module":1,"text":"Я маю актуальну інформацію, щоб чітко пояснювати працівникам їхні завдання, межі відповідальності та очікувані результати роботи."},{"code":"L03","source":"L","module":1,"text":"Якщо робочі вимоги чи пріоритети є нечіткими або суперечливими, я знаю, як і у кого своєчасно отримати необхідні уточнення."},{"code":"L04","source":"L","module":2,"text":"Я маю час для регулярних індивідуальних розмов із працівниками, щоб надавати зворотний зв’язок, обговорювати труднощі та потребу в підтримці."},{"code":"L05","source":"L","module":2,"text":"Якщо робоче питання моєї команди виходить за межі моїх повноважень, я знаю, до кого в компанії звернутися по допомогу в його вирішенні."},{"code":"L06","source":"L","module":2,"text":"Я маю достатньо ресурсів, щоб організовувати повсякденну роботу моєї команди."},{"code":"L07","source":"L","module":3,"text":"Як керівник я маю зрозумілі орієнтири щодо того, як реагувати на помилки в роботі команди та обговорювати їх відкрито й конструктивно, щоб з’ясувати причини й запобігти повторенню."},{"code":"L08","source":"L","module":3,"text":"Як керівник я маю зрозумілий порядок дій, якщо працівник повідомляє мені про неприйнятну поведінку."},{"code":"L09","source":"L","module":3,"text":"У моїй команді є зрозумілі способи, за допомогою яких працівники можуть повідомляти про робочі проблеми, ставити запитання, висловлювати незгоду та звертатися по допомогу."},{"code":"L10","source":"L","module":4,"text":"Я маю достатньо інформації, щоб пояснити працівникам, за якими критеріями в команді розподіляють робочі завдання та навантаження."},{"code":"L11","source":"L","module":4,"text":"Я маю чіткий алгоритм дій, якщо працівникові потрібно змінити окремі умови роботи через стан здоров’я, інвалідність або іншу індивідуальну потребу."},{"code":"L12","source":"L","module":4,"text":"Як керівник я маю зрозумілі орієнтири щодо неупередженого оцінювання результатів роботи та забезпечення працівникам рівних можливостей для професійного розвитку."},{"code":"L13","source":"L","module":5,"text":"У межах установлених правил і вимог я маю повноваження визначати, які рішення щодо виконання роботи працівники можуть приймати самостійно."},{"code":"L14","source":"L","module":5,"text":"Про зміни, що впливають на роботу моєї команди, мене інформують достатньо завчасно, щоб обговорити їх із працівниками до ухвалення остаточного рішення."},{"code":"L15","source":"L","module":5,"text":"Я маю можливість вчасно представляти потреби та пропозиції членів своєї команди під час ухвалення рішень на вищих рівнях управління."},{"code":"L16","source":"L","module":6,"text":"Якщо навантаження, темп або графік роботи не залишають працівникам достатньо можливостей для відпочинку та відновлення, у мене є розуміння та механізми ініціювання і впровадження потрібних змін."},{"code":"L17","source":"L","module":6,"text":"У мене є зрозумілі рекомендації щодо дій у межах моєї управлінської ролі, якщо я помічаю зміни в поведінці, взаємодії чи виконанні роботи працівника, які можуть свідчити про потребу в підтримці."},{"code":"L18","source":"L","module":6,"text":"Якщо працівникові потрібна підтримка, що виходить за межі моєї управлінської ролі, я знаю, де отримати консультацію або куди скерувати працівника."},{"code":"L19","source":"L","module":7,"text":"Якщо я виявляю небезпечні умови роботи або несправне обладнання, я знаю, як оперативно організувати усунення небезпеки або передати питання відповідальним особам."},{"code":"L20","source":"L","module":7,"text":"У мене є чіткий алгоритм дій у разі безпосередньої загрози життю чи здоров’ю працівника під час роботи."},{"code":"L21","source":"L","module":7,"text":"Під час планування змін в обладнанні, робочих процесах або умовах роботи моєї команди мене залучають до оцінювання можливих ризиків для здоров’я та безпеки працівників."}];
const ROLE_QUESTION="Чи є у вас хоча б один працівник, роботу якого ви регулярно організовуєте та координуєте як безпосередній керівник незалежно від назви вашої посади?";
const RESPONSE_SCALE=["Зовсім не погоджуюся","Скоріше не погоджуюся","Частково погоджуюся, частково ні","Скоріше погоджуюся","Цілком погоджуюся","Не стосується моєї роботи"];
const P_LIST=[{"code":"P01","module":1,"text":"Для кожної робочої ролі визначено основні функції, сфери відповідальності, межі повноважень і порядок підпорядкування."},{"code":"P02","module":1,"text":"Під час прийняття на роботу або переведення працівникові пояснюють основні вимоги ролі, очікуваний результат роботи та до кого звертатися, якщо щось незрозуміло."},{"code":"P03","module":1,"text":"Для різних видів робіт у компанії визначено, як працівників інформують про пріоритетність завдань, очікувані результати, критерії якості та строки виконання, а в разі змін їм своєчасно надають оновлену інформацію."},{"code":"P04","module":1,"text":"У компанії визначено, що робити, якщо вимоги суперечать одна одній, є небезпечними або нереалістичними: до кого звернутися, хто ухвалює рішення і як працівник дізнається про результат."},{"code":"P05","module":1,"text":"Перед суттєвою запланованою зміною працівникам своєчасно пояснюють причини зміни та її очікуваний вплив на їхні ролі, завдання, пріоритети й умови роботи."},{"code":"P06","module":1,"text":"Компанія періодично перевіряє, чи відповідає фактична робота визначеним ролям і чи зрозумілі працівникам актуальні вимоги, а в разі виявлення розбіжностей уточнює ролі й вимоги або коригує організацію роботи."},{"code":"P07","module":2,"text":"У компанії визначено, як керівники команд мають планувати й розподіляти роботу, обговорювати навантаження, надавати зворотний зв’язок, реагувати на повідомлення про проблеми та передавати питання на відповідний рівень, якщо їх неможливо вирішити в межах наданих повноважень."},{"code":"P08","module":2,"text":"Компанія періодично перевіряє, чи мають керівники команд достатньо часу, інформації, повноважень і ресурсів для організації роботи та реагування на проблеми, і забезпечує своєчасне вирішення питань, що виходять за межі їхніх повноважень."},{"code":"P09","module":2,"text":"У компанії діє програма навчання та розвитку керівників команд, що охоплює практичну підготовку зокрема з підтримуючого лідерства, управління навантаженням, проведення складних робочих розмов, реагування на неприйнятну поведінку, а її зміст регулярно переглядають і оновлюють відповідно до змін у роботі та виявлених потреб у розвитку управлінських навичок."},{"code":"P10","module":2,"text":"У компанії керівникам команд надають чіткі орієнтири, як діяти й куди спрямовувати працівників, коли їм потрібна спеціалізована підтримка, з дотриманням меж управлінської ролі та принципів «не нашкодь» і конфіденційності."},{"code":"P11","module":2,"text":"У компанії діє практика регулярних індивідуальних зустрічей керівників команд із працівниками для обговорення робочого навантаження, пріоритетних завдань, труднощів у роботі й потреб у підтримці, а також для обміну зворотним зв’язком."},{"code":"P12","module":2,"text":"Компанія регулярно перевіряє, як керівники команд застосовують визначені підходи до управління людьми, зокрема щодо підтримки працівників, надання зворотного зв’язку, розподілу навантаження, дій у складних робочих ситуаціях та реагування на неприйнятну поведінку, і вживає заходів у разі виявлення системних прогалин."},{"code":"P13","module":3,"text":"У компанії чітко визначено правила поважної взаємодії у робочих відносинах, описано ознаки дискримінації, мобінгу та домагань і встановлено заборону помсти чи інших негативних наслідків за добросовісне повідомлення про неприйнятну поведінку."},{"code":"P14","module":3,"text":"У командах діють регулярні формати та правила конструктивного обговорення, які дають працівникам змогу ставити запитання, говорити про помилки, робочі ризики, проблеми та пропозиції без звинувачення або приниження."},{"code":"P15","module":3,"text":"У компанії діє конфіденційний канал на який працівники можуть звернутися через порушення правил поважної взаємодії у робочих відносинах, про які не можуть або не хочуть повідомляти безпосередньому керівникові."},{"code":"P16","module":3,"text":"У компанії діє зрозуміла для всіх працівників процедура неупередженого розгляду та розслідування звернень щодо неприйнятної поведінки: працівників, які звернулися, інформують про перебіг і результат розгляду з дотриманням конфіденційності, а постраждалим надають необхідну підтримку."},{"code":"P17","module":3,"text":"У компанії визначено, як аналізують помилки, збої та інциденти, щоб виявляти їхні робочі й системні причини, удосконалювати процеси та запобігати повторенню."},{"code":"P18","module":3,"text":"Компанія регулярно аналізує зведену інформацію про звернення та повторювані проблеми, захищає конфіденційність працівників у звітності та контролює виконання погоджених заходів реагування."},{"code":"P19","module":4,"text":"У компанії визначено й пояснено працівникам критерії оцінювання результатів роботи, визначення оплати, преміювання та інших заохочень."},{"code":"P20","module":4,"text":"У компанії визначено, як працівники можуть отримати пояснення причин важливих рішень, що їх стосуються, та звернутися по перегляд цих рішень до іншої уповноваженої особи або на вищий рівень."},{"code":"P21","module":4,"text":"У компанії діє порядок конфіденційного розгляду запитів працівників на адаптацію графіка, робочого місця, завдань або способу взаємодії до індивідуальних потреб, за яким збирають лише необхідну інформацію, пояснюють рішення та розглядають інші варіанти, якщо запропонована адаптація неможлива."},{"code":"P22","module":4,"text":"У компанії працівникам доступна інформація про внутрішні вакансії та можливості навчання й розвитку, а також про порядок подання заявки."},{"code":"P23","module":4,"text":"Рішення про найм, участь у програмах навчання й розвитку та кар’єрне просування ухвалюють за визначеними наперед критеріями і процедурами, що зменшують вплив суб’єктивних суджень і ризик дискримінації."},{"code":"P24","module":4,"text":"Компанія регулярно аналізує зведені дані про оплату й преміювання, участь у навчанні та програмах розвитку, а також кар’єрне просування, щоб виявляти необґрунтовані відмінності між групами працівників та вживати заходів для їх усунення."},{"code":"P25","module":5,"text":"Компанія періодично аналізує порядок і строки погодження рішень та зворотний зв’язок працівників, щоб виявляти й усувати зайві процедури, необґрунтовані затримки та надмірний контроль."},{"code":"P26","module":5,"text":"Під час запровадження або перегляду способів контролю за роботою, зокрема цифрового чи автоматизованого моніторингу, компанія оцінює їхню доцільність, вплив на самостійність працівників і ризик надмірного психологічного тиску та за потреби змінює порядок їх застосування."},{"code":"P27","module":5,"text":"Компанія залучає працівників до планування роботи та вдосконалення процесів, особливо якщо можливості самостійно визначати порядок роботи обмежені."},{"code":"P28","module":5,"text":"Працівників безпосередньо або через їхніх представників залучають до виявлення психосоціальних небезпек і визначення заходів для усунення або зменшення пов’язаних із ними ризиків."},{"code":"P29","module":5,"text":"Суттєві зміни, що впливатимуть на роботу працівників, обговорюють із ними або їхніми представниками до ухвалення рішення, а якщо через невідкладність це неможливо, після впровадження разом оцінюють наслідки та за потреби коригують зміни або спосіб їх реалізації."},{"code":"P30","module":5,"text":"Після консультацій із працівниками щодо заходів з управління психосоціальними ризиками чи змін у роботі компанія повідомляє їм про ухвалене рішення та пояснює, які пропозиції враховано, а які ні й чому."},{"code":"P31","module":6,"text":"У компанії регулярно відстежують робоче навантаження та своєчасно реагують на ознаки системного перевантаження, наприклад переглядають пріоритети й строки, перерозподіляють завдання, забезпечують необхідні ресурси, коригують графіки або робочі процеси."},{"code":"P32","module":6,"text":"Компанія відстежує, чи фактична організація робочого часу дає працівникам змогу повноцінно відпочивати й відновлюватися, та усуває виявлені системні перешкоди."},{"code":"P33","module":6,"text":"Компанія забезпечує працівникам доступ до програм і сервісів підтримки здоров’я та відновлення, наприклад, до медичних і психологічних послуг, страхових програм або кризової допомоги, і надає зрозумілу інформацію про доступні можливості, порядок звернення та умови конфіденційності."},{"code":"P34","module":6,"text":"Компанія періодично оцінює, наскільки працівники знають про доступні програми підтримки, можуть ними скористатися, які бар’єри ускладнюють доступ і чи відповідає наявна підтримка їхнім потребам."},{"code":"P35","module":6,"text":"У компанії діє визначений процес повернення та реінтеграції працівника після тривалої відсутності, який передбачає конфіденційне обговорення його/її потреб, погодження необхідних змін у роботі та строків їх перегляду."},{"code":"P36","module":6,"text":"У компанії визначено порядок реагування після потенційно травматичних подій та надання необхідної підтримки працівникам, яких вони торкнулися."},{"code":"P37","module":7,"text":"Управління психосоціальними ризиками інтегровано до системи управління безпекою і здоров’ям на роботі (БЗР): визначено відповідальних, необхідні ресурси та механізми регулярного контролю й удосконалення заходів."},{"code":"P38","module":7,"text":"Компанія регулярно та перед суттєвими змінами в роботі проводить оцінювання для виявлення психосоціальних небезпек і пов’язаних із ними ризиків, а також повторює оцінювання після значущих інцидентів; для пріоритетних ризиків визначає заходи, відповідальних, строки й ресурси та перевіряє результативність вжитих заходів."},{"code":"P39","module":7,"text":"Під час управління психосоціальними ризиками компанія насамперед застосовує організаційні заходи, спрямовані на усунення або зменшення ризиків у самих умовах і організації роботи, а навчання працівників і керівників та індивідуальну підтримку використовує як додаткові заходи."},{"code":"P40","module":7,"text":"Компанія оцінює ризик насильства та домагань з боку третіх осіб (клієнтів, підрядників, партнерів тощо) та, за його наявності, впроваджує заходи запобігання, повідомлення про інциденти й реагування на них."},{"code":"P41","module":7,"text":"Компанія регулярно перевіряє безпечність і придатність фізичних умов роботи, зокрема робочих місць, обладнання, інструментів, маршрутів переміщення, ергономіки та доступності, та контролює усунення виявлених суттєвих недоліків."},{"code":"P42","module":7,"text":"Компанія має актуальний порядок дій у надзвичайних ситуаціях, який охоплює оповіщення, укриття або евакуацію, надання допомоги та безпечне відновлення роботи, і регулярно перевіряє його під час навчань і тренувань."}];
const P={"1":[{"code":"P01","module":1,"text":"Для кожної робочої ролі визначено основні функції, сфери відповідальності, межі повноважень і порядок підпорядкування."},{"code":"P02","module":1,"text":"Під час прийняття на роботу або переведення працівникові пояснюють основні вимоги ролі, очікуваний результат роботи та до кого звертатися, якщо щось незрозуміло."},{"code":"P03","module":1,"text":"Для різних видів робіт у компанії визначено, як працівників інформують про пріоритетність завдань, очікувані результати, критерії якості та строки виконання, а в разі змін їм своєчасно надають оновлену інформацію."},{"code":"P04","module":1,"text":"У компанії визначено, що робити, якщо вимоги суперечать одна одній, є небезпечними або нереалістичними: до кого звернутися, хто ухвалює рішення і як працівник дізнається про результат."},{"code":"P05","module":1,"text":"Перед суттєвою запланованою зміною працівникам своєчасно пояснюють причини зміни та її очікуваний вплив на їхні ролі, завдання, пріоритети й умови роботи."},{"code":"P06","module":1,"text":"Компанія періодично перевіряє, чи відповідає фактична робота визначеним ролям і чи зрозумілі працівникам актуальні вимоги, а в разі виявлення розбіжностей уточнює ролі й вимоги або коригує організацію роботи."}],"2":[{"code":"P07","module":2,"text":"У компанії визначено, як керівники команд мають планувати й розподіляти роботу, обговорювати навантаження, надавати зворотний зв’язок, реагувати на повідомлення про проблеми та передавати питання на відповідний рівень, якщо їх неможливо вирішити в межах наданих повноважень."},{"code":"P08","module":2,"text":"Компанія періодично перевіряє, чи мають керівники команд достатньо часу, інформації, повноважень і ресурсів для організації роботи та реагування на проблеми, і забезпечує своєчасне вирішення питань, що виходять за межі їхніх повноважень."},{"code":"P09","module":2,"text":"У компанії діє програма навчання та розвитку керівників команд, що охоплює практичну підготовку зокрема з підтримуючого лідерства, управління навантаженням, проведення складних робочих розмов, реагування на неприйнятну поведінку, а її зміст регулярно переглядають і оновлюють відповідно до змін у роботі та виявлених потреб у розвитку управлінських навичок."},{"code":"P10","module":2,"text":"У компанії керівникам команд надають чіткі орієнтири, як діяти й куди спрямовувати працівників, коли їм потрібна спеціалізована підтримка, з дотриманням меж управлінської ролі та принципів «не нашкодь» і конфіденційності."},{"code":"P11","module":2,"text":"У компанії діє практика регулярних індивідуальних зустрічей керівників команд із працівниками для обговорення робочого навантаження, пріоритетних завдань, труднощів у роботі й потреб у підтримці, а також для обміну зворотним зв’язком."},{"code":"P12","module":2,"text":"Компанія регулярно перевіряє, як керівники команд застосовують визначені підходи до управління людьми, зокрема щодо підтримки працівників, надання зворотного зв’язку, розподілу навантаження, дій у складних робочих ситуаціях та реагування на неприйнятну поведінку, і вживає заходів у разі виявлення системних прогалин."}],"3":[{"code":"P13","module":3,"text":"У компанії чітко визначено правила поважної взаємодії у робочих відносинах, описано ознаки дискримінації, мобінгу та домагань і встановлено заборону помсти чи інших негативних наслідків за добросовісне повідомлення про неприйнятну поведінку."},{"code":"P14","module":3,"text":"У командах діють регулярні формати та правила конструктивного обговорення, які дають працівникам змогу ставити запитання, говорити про помилки, робочі ризики, проблеми та пропозиції без звинувачення або приниження."},{"code":"P15","module":3,"text":"У компанії діє конфіденційний канал на який працівники можуть звернутися через порушення правил поважної взаємодії у робочих відносинах, про які не можуть або не хочуть повідомляти безпосередньому керівникові."},{"code":"P16","module":3,"text":"У компанії діє зрозуміла для всіх працівників процедура неу упами працівників та вживати заходів для їх усунення."}],"5":[{"code":"P25","module":5,"text":"Компанія періодично аналізує порядок і строки погодження рішень та зворотний зв’язок працівників, щоб виявляти й усувати зайві процедури, необґрунтовані затримки та надмірний контроль."},{"code":"P26","module":5,"text":"Під час запровадження або перегляду способів контролю за роботою, зокрема цифрового чи автоматизованого моніторингу, компанія оцінює їхню доцільність, вплив на самостійність працівників і ризик надмірного психологічного тиску та за потреби змінює порядок їх застосування."},{"code":"P27","module":5,"text":"Компанія залучає працівників до планування роботи та вдосконалення процесів, особливо якщо можливості самостійно визначати порядок роботи обмежені."},{"code":"P28","module":5,"text":"Працівників безпосередньо або через їхніх представників залучають до виявлення психосоціальних небезпек і визначення заходів для усунення або зменшення пов’язаних із ними ризиків."},{"code":"P29","module":5,"text":"Суттєві зміни, що впливатимуть на роботу працівників, обговорюють із ними або їхніми представниками до ухвалення рішення, а якщо через невідкладність це неможливо, після впровадження разом оцінюють наслідки та за потреби коригують зміни або спосіб їх реалізації."},{"code":"P30","module":5,"text":"Після консультацій із працівниками щодо заходів з управління психосоціальними ризиками чи змін у роботі компанія повідомляє їм про ухвалене рішення та пояснює, які пропозиції враховано, а які ні й чому."}],"6":[{"code":"P31","module":6,"text":"У компанії регулярно відстежують робоче навантаження та своєчасно реагують на ознаки системного перевантаження, наприклад переглядають пріоритети й строки, перерозподіляють завдання, забезпечують необхідні ресурси, коригують графіки або робочі процеси."},{"code":"P32","module":6,"text":"Компанія відстежує, чи фактична організація робочого часу дає працівникам змогу повноцінно відпочивати й відновлюватися, та усуває виявлені системні перешкоди."},{"code":"P33","module":6,"text":"Компанія забезпечує працівникам доступ до програм і сервісів підтримки здоров’я та відновлення, наприклад, до медичних і психологічних послуг, страхових програм або кризової допомоги, і надає зрозумілу інформацію про доступні можливості, порядок звернення та умови конфіденційності."},{"code":"P34","module":6,"text":"Компанія періодично оцінює, наскільки працівники знають про доступні програми підтримки, можуть ними скористатися, які бар’єри ускладнюють доступ і чи відповідає наявна підтримка їхнім потребам."},{"code":"P35","module":6,"text":"У компанії діє визначений процес повернення та реінтеграції працівника після тривалої відсутності, який передбачає конфіденційне обговорення його/її потреб, погодження необхідних змін у роботі та строків їх перегляду."},{"code":"P36","module":6,"text":"У компанії визначено порядок реагування після потенційно травматичних подій та надання необхідної підтримки працівникам, яких вони торкнулися."}],"7":[{"code":"P37","module":7,"text":"Управління психосоціальними ризиками інтегровано до системи управління безпекою і здоров’ям на роботі (БЗР): визначено відповідальних, необхідні ресурси та механізми регулярного контролю й удосконалення заходів."},{"code":"P38","module":7,"text":"Компанія регулярно та перед суттєвими змінами в роботі проводить оцінювання для виявлення психосоціальних небезпек і пов’язаних із ними ризиків, а також повторює оцінювання після значущих інцидентів; для пріоритетних ризиків визначає заходи, відповідальних, строки й ресурси та перевіряє результативність вжитих заходів."},{"code":"P39","module":7,"text":"Під час управління психосоціальними ризиками компанія насамперед застосовує організаційні заходи, спрямовані на усунення або зменшення ризиків у самих умовах і організації роботи, а навчання працівників і керівників та індивідуальну підтримку використовує як додаткові заходи."},{"code":"P40","module":7,"text":"Компанія оцінює ризик насильства та домагань з боку третіх осіб (клієнтів, підрядників, партнерів тощо) та, за його наявності, впроваджує заходи запобігання, повідомлення про інциденти й реагування на них."},{"code":"P41","module":7,"text":"Компанія регулярно перевіряє безпечність і придатність фізичних умов роботи, зокрема робочих місць, обладнання, інструментів, маршрутів переміщення, ергономіки та доступності, та контролює усунення виявлених суттєвих недоліків."},{"code":"P42","module":7,"text":"Компанія має актуальний порядок дій у надзвичайних ситуаціях, який охоплює оповіщення, укриття або евакуацію, надання допомоги та безпечне відновлення роботи, і регулярно перевіряє його під час навчань і тренувань."}]};
const CHECKUP_GUIDE={"1":{"title":"Ясність ролі й вимог","what":"Чи визначено в компанії зміст робочих ролей, відповідальність і межі повноважень. Як працівників інформують про вимоги, пріоритети та зміни в роботі. Який порядок дій у разі суперечливих, небезпечних або нереалістичних вимог, відповідність фактичної роботи визначеним ролям і зрозумілість вимог для працівників.","important":"Під «визначено» мається на увазі, що відповідна інформація зафіксована або узгоджена у прийнятний для компанії спосіб і доступна працівникам, яких вона стосується. Це може бути посадова інструкція, опис ролі, регламент, опис процесу, цілі, план роботи, домовленість із керівником або інший робочий механізм. Не обов’язково, щоб уся інформація була оформлена в одному документі."},"2":{"title":"Лідерство й управлінська підтримка","what":"Чи визначено в компанії, що мають робити керівники для організації роботи та підтримки працівників. Чи мають вони на практиці достатньо повноважень, ресурсів та інформації, а також необхідну підготовку. Як компанія перевіряє застосування цих управлінських підходів.","important":"Під управлінською підтримкою мається на увазі не психологічне консультування працівників, а звичайні управлінські дії керівника: планування роботи, уточнення пріоритетів, обговорення навантаження і перешкод, зворотний зв’язок, реагування на робочі проблеми та своєчасне передавання питань на відповідний рівень."},"3":{"title":"Психологічна безпека та взаємодія","what":"Чи створює компанія умови, за яких працівники можуть просити про допомогу, ставити запитання, висловлювати іншу думку, говорити про помилки, ризики, проблеми у взаємодії та неприйнятну поведінку, не побоюючись приниження, звинувачення, покарання або помсти.","important":"Психологічна безпека - це не про постійний комфорт у робочій взаємодії, а про прийняття кожної людини, повагу до її індивідуальності та конструктивне обговорення складних питань."},"4":{"title":"Справедливість і рівні можливості","what":"Чи встановлено в компанії зрозумілі й послідовні правила ухвалення важливих рішень щодо працівників, зокрема щодо оплати, винагороди та визнання. Чи забезпечено рівний доступ до навчання, розвитку й кар’єрних можливостей та запобігання дискримінації.","important":"Критерії ухвалення рішень мають бути зрозумілими, пов’язаними з роботою та застосовуватися послідовно, а відмінності в рішеннях - мати об’єктивне обґрунтування."},"5":{"title":"Автономія та вплив","what":"Чи створює компанія умови, за яких працівники можуть самостійно приймати рішення в межах своєї ролі, впливати на організацію власної роботи та брати участь в обговоренні рішень і змін, що стосуються їхньої роботи.","important":"Автономія не означає повної свободи у виконанні роботи. Можливості самостійно приймати рішення залежать від ролі, вимог безпеки, технологічних обмежень та організації процесу. Обмеження мають бути обґрунтованими, а працівникам мають бути доступні інші реальні способи впливу на роботу."},"6":{"title":"Здоров’я й відновлення","what":"Чи має компанія практики, які допомагають запобігати надмірному навантаженню, забезпечувати достатнє відновлення й доступ до психологічної допомоги, надавати необхідну підтримку у складних робочих ситуаціях, забезпечувати безпечне повернення до роботи після тривалої відсутності та належне реагування після потенційно травматичних подій.","important":"У цьому модулі оцінюємо не стан здоров’я конкретних працівників, а організаційні умови та практики, які допомагають зменшувати ризики для здоров’я і підтримувати відновлення."},"7":{"title":"Умови роботи та безпечне середовище","what":"Чи має компанія системний підхід до виявлення психосоціальних та інших пов’язаних із роботою небезпек, планування і реалізації заходів реагування, оцінки їх результативності, а також до забезпечення безпечних фізичних умов праці та готовності до надзвичайних ситуацій.","important":"Оцінюємо не лише наявність політик та інструкцій, а й те, чи ризики регулярно виявляють, чи визначають конкретні заходи, відповідальних і строки та чи перевіряють, наскільки вжиті заходи працюють."}};

function validateBackupResearch(r){

  }

function setup(){return `${bar()}<div class="shell"><div class="hero-mini"><div><p class="eyebrow">Нове дослідження</p><h2>Визначте основні <span>параметри</span></h2><p class="muted">Загальні дані задаються один раз. Робочі середовища можна додати далі.</p></div></div><form id="setup" class="panel"><div class="form-grid"><div class="field"><label for="company">Назва компанії *</label><input id="company" required></div><div class="field"><label for="owner">Власник дослідження *</label><input id="owner" required></div><div class="field"><label for="ps">Початок дослідження *</label><input id="ps" type="date" required></div><div class="field"><label for="pe">Завершення дослідження *</label><input id="pe" type="date" required></div></div><div class="card-actions"><button class="btn primary" type="submit">Зберегти і перейти далі</button><button class="btn ghost" type="button" data-a="start">Назад</button></div></form></div>`}
function surveyEligibility(e){
  const sr=getSurveyResults(e),eN=Number(sr?.e?.totalResponses||0),lN=Number(sr?.l?.totalResponses||0);
  return {employee:eN>=20,manager:lN>=10,eN,lN}
}
function count(e){
  const ready=surveyEligibility(e);
  return Number(ready.employee)+Number(ready.manager)+Number(!!period().checkup.done)
}
function canDashboard(e){return !!e&&count(e)===3}
function envCard(e){
  let n=count(e),p=progress(),sr=getSurveyResults(e),er=sr?.e,lr=sr?.l,ready=surveyEligibility(e);
  let etxt=!er?'Не завантажено'
    :!ready.employee
      ?`Аналіз відповідей працівників для цього робочого середовища поки неможливий: отримано ${ready.eN} валідних анкет із необхідних 20. Потрібно отримати ще щонайменше ${Math.max(0,20-ready.eN)} валідних відповідей.`
      :`Отримано ${ready.eN} валідних анкет. Доступні результати за модулями й окремими твердженнями.`;
  let ltxt=!lr?'Не завантажено'
    :!ready.manager
      ?`Аналіз відповідей керівників для цього робочого середовища поки неможливий: отримано ${ready.lN} валідних анкет із необхідних 10. Потрібно отримати ще щонайменше ${Math.max(0,10-ready.lN)} валідних відповідей.`
      :`Отримано ${ready.lN} валідних анкет. Доступні результати за модулями й окремими твердженнями.`;
  return `<article class="env-card"><div class="env-top"><div><h3>${h(e.name)}</h3></div><span class="pill"><strong>${n} із 3 джерел готові до аналізу</strong></span></div><div class="progressbar"><i style="width:${n/3*100}%"></i></div><div class="source-grid"><div class="source-state"><strong>Працівники</strong><span class="${ready.employee?'state-ok':er?'state-warn':'state-muted'}">${h(etxt)}</span></div><div class="source-state"><strong>Керівники</strong><span class="${ready.manager?'state-ok':lr?'state-warn':'state-muted'}">${h(ltxt)}</span></div><div class="source-state"><strong>Організаційний чекап</strong><span class="${period().checkup.done?'state-ok':p.a?'state-warn':'state-muted'}">${period().checkup.done?'Завершено':p.a?`У процесі, ${p.mods} із 7 модулів завершено`:'Не розпочато'}</span></div></div><div class="card-actions no-print"><button class="btn secondary small" data-a="upload" data-id="${e.id}">${er?'Замінити дані опитування':'Завантажити дані опитування'}</button><button class="btn ghost small" data-a="checkup">${period().checkup.done?'Переглянути організаційний чекап':p.a?'Продовжити організаційний чекап':'Заповнити організаційний чекап'}</button>${n===3?`<button class="btn primary small" data-a="dash" data-id="${e.id}">Переглянути дашборд результатів</button>`:''}<button class="btn ghost small" data-a="edit-env" data-id="${e.id}">Редагувати</button></div></article>`
}




function summary(){
  let p=period(),es=p.envs||[];
  if(!es.length)return{
    scope:'Робочі середовища ще не визначені.',
    data:'Даних ще немає. Спочатку додайте робоче середовище.',
    next:'Додайте перше робоче середовище.'
  };
  let total=es.reduce((n,e)=>n+count(e),0),max=es.length*3,next='';
  let noSurvey=es.find(e=>!e.survey?.ok),insufficient=es.find(e=>e.survey?.ok&&(!surveyEligibility(e).employee||!surveyEligibility(e).manager));
  if(noSurvey)next=`Завантажте дані опитування для «${noSurvey.name}».`;
  else if(insufficient){const q=surveyEligibility(insufficient);next=!q.employee?`Для «${insufficient.name}» потрібно ще щонайменше ${20-q.eN} валідних відповідей працівників.`:`Для «${insufficient.name}» потрібно ще щонайменше ${10-q.lN} валідних відповідей керівників.`}
  else if(!p.checkup.done)next='Заповніть організаційний чекап для поточного періоду.';
  else next='Усі три джерела готові до аналізу. Перейдіть до дашборду результатів.';
  return{
    scope:`${es.length} ${es.length===1?'робоче середовище':'робочих середовища'} у поточному періоді.`,
    data:`Готові до аналізу ${total} із ${max} джерел даних.`,
    next
  };
}

function checkup(){
  let m=S.module,cp=period().checkup,ans=cp.answers||{},list=P[m],done=list.filter(x=>ans[x.code]).length,guide=CHECKUP_GUIDE[m];
  return `${bar()}<div class="shell checkup">
    <div class="hero-mini"><div><p class="eyebrow">Організаційний чекап</p>
      <h2>Модуль ${m} із 7. <span>${M[m-1]}</span></h2>
      <p class="muted">${done} із ${list.length} практик оцінено в цьому модулі.${cp.asOfDate?` Станом на ${h(fmtDate(cp.asOfDate))}.`:''}</p>
    </div><button class="btn ghost" data-a="home">Назад</button></div>


    <div class="stepper">${M.map((_,i)=>`<span class="stepdot ${i+1===m?'active':''}">${i+1}</span>`).join('')}</div>


    ${m===1?`<div class="notice checkup-intro">
      <strong>Як заповнювати організаційний чекап</strong>
      <p>Відповіді мають ґрунтуватися на перевірці фактичного стану практик. За потреби уточнюйте інформацію у працівників, які відповідають за відповідні процеси, координують їх або володіють необхідними даними.</p>
      <div class="field checkup-date-field"><label for="checkup-date">Дата, станом на яку проведено організаційний чекап</label><input id="checkup-date" type="date" value="${h(cp.asOfDate||'')}"></div>
    </div>`:''}


    <section class="module-guide-card">
      <div class="guide-col">
        <span class="guide-kicker">Що оцінюємо</span>
        <p>${h(guide.what)}</p>
      </div>
      <div class="guide-col important">
        <span class="guide-kicker">Важливо</span>
        <p>${h(guide.important)}</p>
      </div>
    </section>


    <details class="scale-details" ${m===1?'open':''}>
      <summary>Шкала оцінювання та правила факт-перевірки</summary>
      <div class="scale-content">
        <p>Оцінюйте поточний стан практик на рівні всієї компанії станом на зазначену дату. Для підтвердження регулярності та фактичного застосування спирайтеся на актуальні дані й приклади за останні 12 місяців.</p>
        <p><b>Реалізовано повністю</b> — практика фактично працює й охоплює всі суттєві складові, передбачені її описом. Під час оцінювання перевірте її фактичне охоплення, спосіб реалізації, факти або приклади, які підтверджують, що практика справді діє, а не лише передбачена документами.</p>
        <p><b>Реалізовано частково або нерівномірно</b> — практика охоплює не всі суттєві складові, діє лише в частині підрозділів або локацій, поширюється не на всі відповідні категорії працівників чи застосовується нерегулярно.</p>
        <p><b>Не реалізовано або не працює</b> — практика відсутня або існує лише формально й фактично не застосовується. Запланована, але ще не впроваджена зміна не вважається реалізованою практикою.</p>
        <p><b>Недостатньо підтверджених даних для оцінювання</b> — після уточнення інформації неможливо достовірно визначити рівень реалізації практики.</p>
        <p><b>Якщо практика потрібна лише в певних ситуаціях.</b> Якщо компанія ще не стикалася з такими випадками, оцінюйте готовність застосувати практику за потреби: чи визначено порядок дій і відповідальних, чи забезпечено необхідні ресурси, чи поінформовано відповідних працівників та, за можливості, чи перевірено цей порядок під час навчання або моделювання ситуації.</p>
        <p><b>Як визначається статус модуля.</b> «Ясно» — усі шість практик реалізовано повністю. «Буря» — не реалізовано одну критичну практику (P04, P13, P15, P16, P21, P28, P31, P36, P38 або P42) чи щонайменше дві будь-які практики. Якщо умова «Бурі» не спрацювала, три або більше відповідей «недостатньо підтверджених даних» дають «Туман»; в інших випадках — «Хмарно». P40 вважається критичним лише тоді, коли підтверджено актуальний ризик насильства або домагань з боку третіх осіб.</p>
      </div>
    </details>


    ${list.map(pr=>`<article class="practice">

        ['no','Не реалізовано або не працює'],

      ].map(x=>`<label class="choice"><input type="radio" name="${pr.code}" value="${x[0]}" ${ans[pr.code]===x[0]?'checked':''}>${x[1]}</label>`).join('')}</div>


      ${pr.code==='P40'&&ans.P40==='no'?`<div class="notice p40-risk" style="margin-top:14px">
        <strong>Уточнення для P40</strong>
        <p>Чи виявлено в компанії актуальний ризик насильства або домагань з боку третіх осіб?</p>
        <div class="choices" style="margin-top:10px">${[
          ['confirmed','Так, ризик виявлено'],
          ['not_confirmed','Ні, ризик не виявлено'],
          ['needs_check','Це ще не визначено']
        ].map(x=>`<label class="choice"><input type="radio" name="p40Risk" value="${x[0]}" ${cp.p40Risk===x[0]?'checked':''}>${x[1]}</label>`).join('')}</div>
      </div>`:''}


      <div class="field" style="margin-top:12px"><label>Підтвердження / прогалини</label><textarea data-note="${pr.code}" placeholder="Зафіксуйте факти або те, що потрібно уточнити.">${h(cp.notes?.[pr.code]||'')}</textarea></div>
    </article>`).join('')}


    <div class="checkup-nav">
      <div>${m>1?`<button class="btn ghost" data-a="prev">До модуля ${m-1}</button>`:''}</div>
      <div>${m<7?`<button class="btn primary" data-a="next">Перейти до модуля ${m+1}</button>`:'<button class="btn primary" data-a="finish">Завершити організаційний чекап</button>'}</div>
    </div>
  </div>`
}
