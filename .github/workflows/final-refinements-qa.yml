name: Final refinements QA 2026-10-22
on:
  push:
    branches: [feature/checkup-only-verification-2026-10-20]
    paths:
      - local/index.html
      - index.html
      - tests/**
      - .github/workflows/final-refinements-qa.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated QA dependencies
        run: |
          npm install --no-save playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "BAROMETER_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
          pip install pymupdf pillow openpyxl
      - name: Node regressions and storage unit tests
        run: |
          mkdir -p /tmp/barometer-final-qa /tmp/barometer-current-browser
          node --test --test-reporter=tap tests/portal-regression.mjs tests/storage-safety-unit.mjs tests/final-refinements-unit.mjs > /tmp/barometer-final-qa/node-tests.tap 2>&1
          tail -12 /tmp/barometer-final-qa/node-tests.tap
      - name: Existing actual browser regressions
        env:
          BAROMETER_QA_OUTPUT: /tmp/barometer-current-browser
        run: node tests/checkup-browser.cjs
      - name: Targeted actual browser scenarios and downloads
        env:
          BAROMETER_FINAL_OUTPUT: /tmp/barometer-final-qa
        run: node tests/final-refinements-browser.cjs
      - name: Inspect real PDF pages and native XLSX exports
        env:
          BAROMETER_FINAL_OUTPUT: /tmp/barometer-final-qa
        run: python tests/inspect-final-artifacts.py
      - name: Publish QA evidence archive only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barometer-final-refinements-qa
          path: |
            /tmp/barometer-final-qa/
            /tmp/barometer-current-browser/
          retention-days: 30
