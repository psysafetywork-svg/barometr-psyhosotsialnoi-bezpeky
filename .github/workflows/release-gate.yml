name: Final release gate (isolated test branch)
on:
  push:
    branches: [feature/checkup-only-verification-2026-10-20]
permissions:
  contents: read
jobs:
  release-gate:
    if: github.ref == 'refs/heads/feature/checkup-only-verification-2026-10-20'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BAROMETER_QA_OUTPUT: /tmp/barometer-release-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: python -m pip install pymupdf pillow openpyxl
      - name: Full Node regressions
        shell: bash
        run: |
          mkdir -p /tmp/barometer-release-gate
          node --test tests/portal-regression.mjs 2>&1 | tee /tmp/barometer-release-gate/node-tests.tap
      - name: Exhaustive P matrix and ELP sources
        if: always()
        shell: bash
        run: node tests/release-gate-matrix.cjs 2>&1 | tee /tmp/barometer-release-gate/exhaustive-tests.log
      - name: Existing full browser regression and PDF exports
        if: always()
        run: node tests/checkup-browser.cjs
      - name: Real Chromium Firefox WebKit data preservation and stale-tab probes
        if: always()
        run: node tests/release-gate-browser.cjs
      - name: Actual recommendation audit and export inspection
        if: always()
        run: |
          node tests/export-organisational-audit.cjs
          node tests/export-corrective-review.cjs
          python tests/inspect-corrective-pdfs.py
          node tests/package-release-gate.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barometer-release-gate
          path: /tmp/barometer-release-gate/
          retention-days: 30
