name: Corrective patch review (test branch only)
on:
  push:
    branches: [feature/checkup-only-verification-2026-10-20]
permissions:
  contents: read
jobs:
  isolated-review:
    if: github.ref == 'refs/heads/feature/checkup-only-verification-2026-10-20'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAROMETER_QA_OUTPUT: /tmp/barometer-corrective-review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-color-emoji
      - run: python -m pip install pymupdf pillow openpyxl
      - name: Node regressions
        shell: bash
        run: |
          mkdir -p /tmp/barometer-corrective-review
          node --test tests/portal-regression.mjs 2>&1 | tee /tmp/barometer-corrective-review/node-tests.tap
      - name: Actual browser, import, Plan, offline and PDFs
        run: node tests/checkup-browser.cjs
      - name: Audit 168 scenarios and review exports
        run: |
          node tests/export-organisational-audit.cjs
          node tests/export-corrective-review.cjs
          python tests/inspect-corrective-pdfs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrective-review
          path: |
            /tmp/barometer-corrective-review/
            docs/ORGANISATIONAL_ACTIONS_AUDIT_2026-10-20.*
          retention-days: 30
