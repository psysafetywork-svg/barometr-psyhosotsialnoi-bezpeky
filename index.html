const ACTION_LIB={"P01":{"title":"Узгодити фактичну роботу з роллю та межами рішень","verify":"Для 2 або 3 типових ролей порівняйте формальний опис роботи з тим, що працівники фактично роблять: постійні додаткові завдання, реальне підпорядкування, рішення без погодження та взаємодію з іншими ролями.","action":"Оновіть функції, межі повноважень і порядок взаємодії там, де фактична робота регулярно не відповідає формальному опису. Якщо додаткова функція стала постійною, або офіційно закріпіть її разом із потрібними ресурсами й повноваженнями, або приберіть її.","check":"Працівник і керівник не мають суперечностей у розумінні ключових функцій і меж рішень; немає повторюваних завдань, за які ніхто не відповідає або відповідальність дублюється."},"P02":{"title":"Уніфікувати ключову інформацію про роль під час найму та переведення","verify":"Перегляньте 3-5 останніх випадків найму або переведення: що пояснили про функції, очікуваний результат, ключові взаємодії та контакт для уточнень.","action":"Використовуйте короткий обов’язковий перелік інформації для найму і переведення: основні функції, очікуваний результат, ключові взаємодії та контакт для уточнень. Працівник має отримати цю інформацію до початку самостійної роботи.","check":"Нові або переведені працівники можуть пояснити свої основні функції, очікуваний результат і знають, до кого звернутися по уточнення."},"P03":{"title":"Узгодити обов’язкову інформацію під час постановки й оновлення завдань","verify":"Візьміть 5 робочих завдань різних типів і перевірте, чи були зрозуміло визначені пріоритет, очікуваний результат, критерії якості, термін виконання та спосіб повідомлення про зміни.","action":"Додайте до інструмента, яким команда реально користується для постановки завдань, п’ять обов’язкових елементів: пріоритет, очікуваний результат, критерії якості, термін виконання та спосіб повідомлення про зміни.","check":"У перевірених завданнях зрозумілі пріоритет, очікуваний результат, критерії якості й термін; про зміну пріоритету працівники дізнаються до виконання застарілої вимоги."},"P04":{"title":"Визначити порядок дій при суперечливих, небезпечних або нереалістичних вимогах","verify":"Простежте 2-3 реальні випадки або проведіть сценарну перевірку: кому повідомили, хто мав право змінити вимогу, скільки тривало рішення, чи отримав працівник відповідь.","action":"Визначте, кому працівник або керівник передає таку проблему, хто має право змінити пріоритет чи зупинити небезпечну вимогу, хто ухвалює остаточне рішення і як повідомляють результат. Приберіть зайві рівні погодження, якщо вони затримують захисне рішення.","check":"Працівники й керівники знають, кому передати суперечливу або небезпечну вимогу; у перевіреному випадку зрозуміло, хто ухвалив рішення і як про нього повідомили."},"P05":{"title":"Вбудувати ясність ролі в управління змінами","verify":"Для 2 або 3 останніх змін відновіть хронологію: коли рішення було відоме, коли повідомили працівників, що пояснили про вплив, які питання залишилися відкритими.","action":"Для суттєвих змін до впровадження повідомляйте причину, очікуваний вплив, дату або етапи, що змінюється в ролях і задачах та де ставити питання.","check":"Під час наступної суттєвої зміни працівники отримують інформацію до впровадження і можуть пояснити, що саме зміниться у їхній роботі."},"P06":{"title":"Запровадити перевірку розриву між формальною і фактичною роллю","verify":"Порівняйте фактичну роботу 2 або 3 ролей з чинними описами після реорганізацій, запуску нових систем або зміни чисельності.","action":"Переглядайте опис ролі позапланово після реорганізації, запуску нової системи, суттєвого розширення функцій або повторюваних конфліктів відповідальності. За результатом або оновіть роль, або змініть розподіл роботи.","check":"Для виявлених розбіжностей визначено відповідального і термін усунення; повторна перевірка показує, що формальний опис і фактична робота більше не суперечать одне одному."},"P07":{"title":"Узгодити, яку управлінську підтримку працівник має отримувати в типових робочих ситуаціях","verify":"Порівняйте по одному прикладу з кількох команд: чи може працівник уточнити завдання і пріоритети, обговорити навантаження та труднощі, отримати зворотний зв’язок і зрозуміти, що відбувається з проблемою, яку керівник не може вирішити самостійно.","action":"Зафіксуйте, яку підтримку працівник має мати в таких ситуаціях, і включіть це в адаптацію керівників та робочі правила: уточнення завдань і пріоритетів, обговорення навантаження, зворотний зв’язок, допомога з робочими труднощами та передання питання на вищий рівень, коли це потрібно.","check":"У різних командах працівники отримують підтримку з боку керівника: можуть уточнити завдання і пріоритети, обговорити навантаження та труднощі, отримати зворотний зв’язок і зрозуміти подальші дії щодо робочої проблеми."},"P08":{"title":"Перевірити, чи має керівник ресурси й повноваження для роботи з командою","verify":"Для кількох типових робочих тижнів зіставте навантаження керівника, невирішені питання команди, час очікування рішень і питання, які потребують рішення на вищому рівні.","action":"Якщо одна й та сама перешкода повторюється, змініть розподіл роботи, ресурс, межі повноважень або порядок передання питання на вищий рівень. Не компенсуйте дефіцит постійною особистою доступністю керівника.","check":"Менше питань залишаються невирішеними через брак ресурсу або повноважень; скорочується час очікування рішення з типових питань, які передаються на вищий рівень."},"P09":{"title":"Пов’язати навчання керівників із конкретними робочими ситуаціями","verify":"Зіставте програму навчання з реальними ситуаціями: перевантаження, помилка, неприйнятна поведінка, складна розмова, перенаправлення по підтримку.","action":"Будуйте навчання на типових робочих ситуаціях: перевантаження, помилка, неприйнятна поведінка, складна розмова, перенаправлення по підтримку. Для кожної ситуації керівник має знати межі своєї ролі, порядок дій і доступні ресурси. Після навчання перевіряйте застосування в роботі, а не лише факт проходження курсу.","check":"Під час практичної перевірки керівник правильно визначає свої дії, межі ролі та куди передати питання; повторювані помилки в цих ситуаціях зменшуються."},"P10":{"title":"Визначити межі ролі керівника при потребі працівника в підтримці","verify":"Перевірте, чи керівники знають: які робочі спостереження обговорювати, що не слід діагностувати, куди звертатися за консультацією, як захищати конфіденційність.","action":"Дайте керівнику короткий порядок дій: описати робочі спостереження, обговорити, яка підтримка потрібна для роботи, не ставити діагноз і за потреби пояснити, де працівник може отримати спеціалізовану допомогу.","check":"Керівники розуміють, що входить до їхньої ролі, а що потребує перенаправлення; під час перенаправлення не збирають зайві медичні дані й не вимагають розкривати діагноз."},"P11":{"title":"Забезпечити регулярну можливість обговорювати робочі питання з керівником","verify":"Перевірте, чи працівники мають передбачувану можливість обговорити з керівником навантаження, пріоритети, труднощі, потребу в підтримці та отримати зворотний зв’язок.","action":"Визначте теми, які мають бути доступні для такого обговорення: навантаження, пріоритети, труднощі, підтримка, зворотний зв’язок і домовленості про подальші дії. Частоту визначайте з урахуванням характеру роботи, темпу змін і рівня ризику.","check":"Працівники знають, коли і як можуть обговорити робочу проблему з керівником; за важливими домовленостями є наступний крок і дата повторної перевірки."},"P12":{"title":"Перевіряти, як управлінські правила працюють у повсякденній роботі","verify":"Виберіть кілька повторюваних управлінських ситуацій і перевірте, які рішення приймалися, чи були затримки, коли питання передавали на вищий рівень і чи отримував працівник зворотний зв’язок. Не використовуйте це для оцінювання ефективності конкретного керівника.","action":"Шукайте повторювані перешкоди в роботі кількох команд. Якщо проблема пов’язана з браком ресурсу, інформації, повноважень або нечітким порядком дій, змінюйте саме цю організаційну умову.","check":"Повторювані проблеми в однакових управлінських ситуаціях трапляються рідше, а погоджені зміни виконуються в установлені терміни."},"P13":{"title":"Закріпити правила поважної взаємодії та захист від помсти","verify":"Перевірте, чи правила наводять зрозумілі приклади дискримінації, мобінгу, домагань, приниження та інших форм неприйнятної поведінки, містять заборону помсти і пояснюють, куди звертатися.","action":"Оновіть правила так, щоб вони були пов’язані з порядком повідомлення, захисту працівника і розгляду звернення. Заборону помсти після добросовісного повідомлення зазначте окремо.","check":"Працівники можуть пояснити, яка поведінка є неприйнятною, куди звертатися і який захист передбачено після повідомлення."},"P14":{"title":"Забезпечити безпечні способи ставити запитання, висловлювати незгоду й повідомляти про помилки","verify":"На кількох робочих обговореннях перевірте, чи працівники можуть ставити запитання, піднімати ризики, говорити про помилки та висловлювати незгоду без приниження або покарання.","action":"Визначте правила обговорення без приниження та очікувану реакцію керівника на запитання, незгоду, повідомлення про ризик або помилку. Якщо проблема пов’язана з реакцією чи процедурою, не обмежуйте рішення лише навчанням.","check":"Працівники піднімають робочі проблеми до того, як вони переростають в інцидент; під час розбору ненавмисної помилки перевіряють умови й причини, а не лише шукають винного."},"P15":{"title":"Забезпечити конфіденційний спосіб повідомлення поза прямим керівником","verify":"Перевірте на практичному сценарії: куди звертається працівник, хто приймає звернення, хто має доступ до інформації, як визначають терміновість і як повідомляють працівникові наступний крок.","action":"Визначте альтернативний канал поза прямим керівником, відповідального за прийняття звернення, правила конфіденційності, захист від помсти та спосіб повідомляти заявникові про подальші дії.","check":"Працівники знають альтернативний канал; кожне звернення має відповідального, а заявник отримує інформацію про наступний крок."},"P16":{"title":"Зробити розгляд звернень передбачуваним і неупередженим","verify":"Перевірте кілька останніх звернень або змодельований сценарій: хто приймає звернення, як усувають конфлікт інтересів, чи потрібен тимчасовий захист, як інформують сторони і як повідомляють результат.","action":"Опишіть етапи розгляду, хто відповідає за кожен етап, як усувають конфлікт інтересів, як захищають конфіденційність і від помсти та яку інформацію про хід розгляду може отримати заявник.","check":"Звернення не залишаються без відповідального; конфлікт інтересів усувається, а заявник знає статус звернення або наступний крок."},"P17":{"title":"Аналізувати причини ненавмисних помилок, а не лише наслідки","verify":"Виберіть 2-3 помилки або збої і перевірте, чи аналізували інструкції, ресурси, навантаження, взаємодію між ролями, передачу інформації та інші робочі умови, що могли вплинути на подію.","action":"Для ненавмисних помилок проведіть короткий розбір: що мало відбутися, що відбулося фактично, які робочі фактори вплинули, що потрібно змінити і хто перевірить результат.","check":"Після розбору змінюють конкретні умови або порядок роботи, якщо вони сприяли помилці; повторення аналогічних збоїв відстежується."},"P18":{"title":"Виявляти повторювані проблеми й контролювати виконання рішень","verify":"Згрупуйте звернення або збої без персональних даних: які теми повторюються, у яких підрозділах або процесах, скільки часу займає вирішення, які погоджені дії прострочені.","action":"Регулярно переглядайте повторювані теми і стан погоджених змін. Не показуйте деталізацію, за якою можна визначити конкретну людину в малій групі.","check":"Проблеми з тією самою причиною повторюються рідше; для прострочених змін визначено, хто і коли має їх завершити."},"P19":{"title":"Зробити критерії оцінювання, оплати та заохочень зрозумілими й перевірюваними","verify":"Для 2 або 3 типових рішень перевірте критерії, джерела даних, хто ухвалює рішення і чи може працівник отримати пояснення.","action":"Зробіть критерії доступними працівникам у тій частині, яка стосується їхніх рішень, і застосовуйте однакові критерії до порівнюваних ролей. Якщо є виняток, його причина має бути пояснена.","check":"У перевірених рішеннях можна простежити, які критерії використані і чому; працівник може отримати пояснення щодо рішення, яке його стосується."},"P20":{"title":"Забезпечити пояснення та перегляд важливих рішень","verify":"Перевірте останні спірні рішення: хто пояснював, чи був інший рівень перегляду, чи був конфлікт інтересів.","action":"Визначте, де працівник може отримати пояснення рішення і куди звернутися по його перегляд. Якщо можливо, перегляд проводить інша уповноважена особа або інший рівень, а не лише автор первинного рішення.","check":"Для спірного рішення є зафіксоване обґрунтування, а працівник може пройти весь визначений порядок перегляду."},"P21":{"title":"Визначити конфіденційний порядок адаптації умов роботи","verify":"Перевірте, які дані запитують, хто ухвалює рішення, які альтернативи розглядають і як зберігають конфіденційність.","action":"Збирайте лише інформацію, потрібну для визначення робочої потреби. Узгоджуйте конкретну адаптацію, відповідальних і дату перегляду. Якщо запит неможливо виконати повністю, обговоріть і зафіксуйте можливі альтернативи.","check":"Працівник знає, куди звернутися; для рішення не вимагають зайвого розкриття діагнозу; погоджену адаптацію переглядають у визначену дату."},"P22":{"title":"Забезпечити своєчасний доступ до інформації про можливості розвитку","verify":"Порівняйте канали інформування для різних ролей і локацій та останні випадки подання на навчання або вакансії.","action":"Використовуйте доступний для відповідних працівників канал, де завчасно публікуються внутрішні вакансії, навчання та інші можливості розвитку, правила подання і контакт для запитань. Передбачте альтернативний спосіб для працівників без корпоративної пошти або постійного доступу до комп’ютера.","check":"Працівники в порівнюваних ролях і локаціях отримують інформацію до завершення подання; немає групи, яка систематично дізнається про можливість запізно."},"P23":{"title":"Зменшити суб’єктивність у рішеннях про найм, розвиток і просування","verify":"Перевірте 3-5 останніх рішень: які критерії використовували, хто оцінював, як обґрунтували рішення і чи були відхилення від установлених критеріїв.","action":"Визначайте критерії до початку оцінювання, використовуйте однакову структуру оцінки для порівнюваних кандидатів і фіксуйте причину винятків.","check":"У перевірених рішеннях критерії були визначені до оцінювання; винятки мають зафіксоване обґрунтування."},"P24":{"title":"Перевіряти повторювані відмінності між групами у зведених даних","verify":"Аналізуйте зведені дані щодо оплати, премій, навчання, розвитку, просування і адаптацій за групами лише там, де розмір групи дозволяє безпечний аналіз.","action":"Якщо у зведених даних повторюється суттєва відмінність, перевірте критерії та порядок ухвалення відповідних рішень. Не робіть висновок про дискримінацію лише на підставі статистичної різниці.","check":"Для підтверджених причин у правилах або порядку ухвалення рішень запроваджено зміни; повторний аналіз показує, чи зменшилася відмінність."},"P25":{"title":"Прибрати зайві погодження у рішеннях із низьким рівнем ризику","verify":"Зберіть повторювані погодження з найдовшим очікуванням і визначте, яке рішення або ризик кожне з них реально контролює.","action":"Для рішень із низьким рівнем ризику передайте частину повноважень ближче до виконавця, скоротіть кількість погоджень або визначте просте правило, за яким рішення можна приймати без додаткового погодження.","check":"Час очікування рішення скорочується без збільшення помилок або небезпечних подій; працівники розуміють, які рішення можуть приймати самостійно."},"P26":{"title":"Перевірити необхідність цифрового або автоматизованого контролю","verify":"Для кожного інструмента визначте, навіщо він використовується, які дані збирає, хто їх бачить, які рішення на них ґрунтуються і чи можна досягти тієї самої мети менш обмежувальним способом.","action":"Приберіть дублюючий або надмірний контроль, збирайте лише дані, потрібні для визначеної мети, і поясніть працівникам, які дані збираються та як вони використовуються.","check":"Працівники знають, які дані збираються і для чого; немає дублюючих показників, які не використовуються для рішень."},"P27":{"title":"Зробити участь працівників у змінах і вдосконаленні процесів змістовною","verify":"Для останніх консультацій перевірте, які питання працівники могли реально змінити, хто ухвалював остаточне рішення і чи отримали працівники відповідь щодо своїх пропозицій.","action":"До початку консультації поясніть, на що працівники можуть вплинути, до якого терміну подати пропозиції і як вони дізнаються про результат. Залучайте працівників до конкретного рішення або зміни, а не формально.","check":"Працівники можуть навести приклад пропозиції, яку прийняли, змінили разом із ними або обґрунтовано відхилили."},"P28":{"title":"Залучати працівників до виявлення психосоціальних небезпек і вибору заходів контролю","verify":"Порівняйте реєстр ризиків із реальними робочими ситуаціями та перевірте, чи були залучені працівники або представники тих груп, які виконують цю роботу.","action":"Залучайте працівників або їхніх представників до визначення небезпек, вибору заходів контролю та перевірки того, чи можна ці заходи реально виконувати в робочих умовах.","check":"У матеріалах оцінки видно, які робочі ситуації або заходи змінили після консультації; обраний захід можна виконувати в реальній роботі."},"P29":{"title":"Проводити консультацію до остаточного рішення про суттєву зміну","verify":"Для останньої суттєвої зміни відновіть послідовність: коли визначили рішення, коли залучили працівників, які питання на той момент ще можна було змінити і яку відповідь працівники отримали після консультації.","action":"Перед остаточним рішенням передбачте етап, на якому працівники або їхні представники можуть висловити позицію щодо питань, які ще можна змінити. Якщо зміна була невідкладною, після впровадження перевірте її наслідки і за потреби скоригуйте.","check":"Під час наступної суттєвої зміни працівники або їхні представники мали можливість вплинути на визначені питання до рішення; для невідкладної зміни проведено перевірку після впровадження."},"P30":{"title":"Повідомляти працівникам результат розгляду їхніх пропозицій","verify":"Візьміть 5 пропозицій або звернень і простежте: хто розглядав, яке рішення, чи повернули пояснення.","action":"Для кожної пропозиції або звернення повідомляйте один із результатів: прийнято, частково прийнято або не прийнято. Додайте коротке пояснення, наступний крок і відповідального, якщо потрібні подальші дії.","check":"Менше пропозицій залишаються без відповіді; працівники знають результат розгляду і, за потреби, наступний крок."},"P31":{"title":"Виявляти повторюване перевантаження за робочими даними і змінювати організацію роботи","verify":"Зіставте понаднормову роботу, накопичені незавершені завдання, незаповнені вакансії, пропущені перерви, роботу поза графіком, помилки або переробки та пікові періоди.","action":"Якщо перевантаження повторюється через організацію роботи, змініть пріоритети, обсяг роботи, чисельність, розподіл завдань, графік або робочий процес. Не робіть навчання керуванню стресом основною відповіддю на надмірне навантаження.","check":"Після змін зменшуються ті показники, які підтверджували перевантаження: понаднормова робота, накопичені завдання, пропущені перерви або пов’язані з перевантаженням помилки, без погіршення критичної якості чи безпеки."},"P32":{"title":"Усунути повторювані перешкоди для відпочинку і відновлення","verify":"Перевірте пропущені перерви, зміни графіка в останню хвилину, позаробочі контакти, невикористані відпустки і причини.","action":"Якщо проблема повторюється, змініть графік, забезпечення замін, чисельність персоналу, правила контактів поза робочим часом або порядок передання проблеми відповідальній особі так, щоб працівники реально могли використати передбачений відпочинок.","check":"Рідше пропускаються передбачені перерви і зменшуються робочі контакти поза робочим часом, які не пов’язані з кризовими чи екстреними ситуаціями або прямо не передбачені роллю; графік стає передбачуванішим."},"P33":{"title":"Зробити психологічну та іншу підтримку зрозумілою, доступною і конфіденційною","verify":"Перевірте шлях працівника: де знайти інформацію, кому звернутися, які умови доступу, яку інформацію отримує роботодавець і як працівникові пояснюють конфіденційність.","action":"Опишіть доступні види підтримки, як ними скористатися, умови конфіденційності та альтернативні способи звернення. Не оцінюйте психічне здоров’я працівників за кількістю звернень по підтримку.","check":"Працівники знають, куди і як звернутися та які дані залишаються конфіденційними; виявлені бар’єри доступу усуваються."},"P34":{"title":"Перевіряти, чи працівники реально можуть скористатися доступною підтримкою","verify":"За допомогою короткого анонімного опитування перевірте, чи працівники знають про підтримку, можуть отримати до неї доступ, розуміють умови конфіденційності та які бар’єри виникають.","action":"Усуньте конкретні бар’єри: складний порядок звернення, брак інформації, мовні або цифрові обмеження, недовіру до конфіденційності.","check":"Менше працівників повідомляють, що не знають, куди звертатися, або стикаються з конкретним бар’єром; ефективність підтримки не оцінюють лише за кількістю звернень."},"P35":{"title":"Визначити порядок безпечного повернення до роботи після тривалої відсутності","verify":"Перевірте кілька останніх випадків: чи обговорювали робочі обмеження і потреби, можливі адаптації, поетапне повернення, дату перегляду домовленостей та конфіденційність.","action":"Разом із працівником визначте робочі бар’єри, потрібні адаптації, поетапне повернення за потреби, дату перегляду домовленостей і коло залучених осіб за згодою працівника.","check":"Домовленості щодо повернення до роботи зафіксовані, мають дату повторної перевірки і за потреби змінюються відповідно до фактичної ситуації."},"P36":{"title":"Визначити порядок реагування після потенційно травматичної події","verify":"Для реального або змодельованого сценарію перевірте: як припиняють вплив небезпеки, забезпечують фізичну безпеку, заміну або відпочинок, контакт із працівником, доступ до допомоги та повторну перевірку умов роботи.","action":"Спочатку припиніть або зменште вплив небезпеки, за потреби організуйте заміну чи відпочинок, поясніть доступну підтримку і перегляньте умови роботи, які могли сприяти події. Не зводьте реагування до одноразового обов’язкового групового обговорення пережитого.","check":"Після події виконані конкретні захисні дії, переглянуті причини й умови роботи, а працівники знають, де отримати підтримку без примусу до групового розкриття переживань."},"P37":{"title":"Включити психосоціальні ризики до звичайного управління безпекою та здоров’ям на роботі","verify":"Перевірте, чи психосоціальні ризики включені до реєстру ризиків, плану заходів, розподілу відповідальності, ресурсів і регулярного управлінського перегляду.","action":"Включіть психосоціальні ризики до звичайного циклу управління ризиками: виявлення небезпек, оцінка, заходи контролю, відповідальний, ресурси, перевірка результату і повторна оцінка.","check":"Для сигналу Барометра можна простежити пов’язаний ризик, погоджену дію, відповідального та результат повторної перевірки в системі безпеки й здоров’я на роботі."},"P38":{"title":"Забезпечити повний цикл оцінювання й контролю психосоціальних ризиків","verify":"Перевірте останню оцінку: джерела даних, групи робіт, пріоритетні ризики, заходи контролю, відповідальні, ресурс, критерій повторної перевірки.","action":"Визначте, коли проводиться планова оцінка і які події потребують позапланової. Для кожного пріоритетного ризику зафіксуйте конкретний захід, відповідального, потрібні ресурси і дані, за якими перевірятимете результат.","check":"Після виконання заходів повторно оцінюється той самий ризик, а не лише факт закриття завдання."},"P39":{"title":"Спочатку змінювати джерело робочого ризику, а не лише реакцію працівника","verify":"Для кожної запропонованої дії визначте, яку конкретну робочу небезпеку вона усуває або зменшує. Якщо дія лише допомагає працівникові справлятися з наслідками, перевірте, чому не змінюється саме джерело ризику.","action":"Спочатку розглядайте зміни в організації роботи, процесах, ресурсах, графіках, ролях або фізичному середовищі, які усувають чи зменшують небезпеку. Навчання і психологічну підтримку використовуйте як доповнення, а не заміну таким змінам.","check":"Для кожного підтвердженого організаційного ризику в Плані організаційних змін є дія, спрямована на робоче джерело ризику, якщо така зміна можлива."},"P40":{"title":"Зменшити ризик насильства і домагань з боку третіх осіб","verify":"Визначте, де, коли і для яких працівників трапляються інциденти; чи можуть вони швидко припинити небезпечний контакт, отримати допомогу, повідомити про подію і отримати підтримку після неї.","action":"Змініть умови, що впливають на ризик: чисельність і розподіл персоналу, фізичний простір, чергування, доступ до охорони або зв’язку, право припинити небезпечну взаємодію, порядок повідомлення та підтримку після інциденту.","check":"Повторювані типи інцидентів трапляються рідше; перевіряється час до отримання допомоги та виконання погоджених дій після інциденту."},"P41":{"title":"Усувати суттєві недоліки фізичного середовища і перевіряти результат","verify":"Перевірте огляди, заявки, термін закриття, повторні дефекти; вибірково огляньте робочі місця, маршрути, обладнання, ергономіку та фізичну доступність.","action":"Для суттєвого недоліку визначте відповідального і термін усунення. Після виконання перевірте в реальних умовах роботи, чи проблему справді усунуто.","check":"Ті самі дефекти повторюються рідше; прострочені критичні проблеми передаються на рівень, де можна забезпечити їх усунення."},"P42":{"title":"Перевіряти готовність до надзвичайної ситуації на практичному сценарії","verify":"Проведіть практичний сценарій: оповіщення, укриття або евакуація, допомога людям з додатковими потребами, резервний зв’язок і рішення про безпечне відновлення роботи.","action":"Оновіть ролі, контакти, маршрути та резервні канали за результатами тренування або реальної події. Визначте, хто ухвалює рішення про безпечне відновлення роботи.","check":"Під час тренування працівники отримують оповіщення і можуть виконати передбачені дії; виявлені недоліки мають відповідального і усуваються до наступної перевірки."}};
const THEMATIC_LIB={"Рівний доступ до робочої інформації та ресурсів":{"title":"Рівний доступ до робочої інформації та ресурсів","verify":"Працівники в порівнюваних ролях повідомляють про різний доступ до робочої інформації або ресурсів.","action":"Визначте, які ресурси потрібні для типових ролей, за якими критеріями розподіляються дефіцитні ресурси і куди працівник повідомляє про відсутній ресурс. Порівняйте доступ між локаціями, змінами та форматами роботи.","check":"У працівників із порівнюваними ролями немає повторюваної різниці в доступі без зрозумілої робочої причини."},"Визнання внеску без прив’язки лише до премій":{"title":"Визнання внеску без прив’язки лише до премій","verify":"Працівники повідомляють, що їхній внесок у роботу регулярно залишається непоміченим.","action":"Включіть конкретне визнання внеску до регулярного зворотного зв’язку: що саме було зроблено добре і який це дало результат. Звертайте увагу і на менш помітну роботу, важливу для команди.","check":"Працівники в різних командах можуть навести приклади конкретного визнання внеску; практика не зводиться лише до премій або особистих уподобань керівника."},"Пріоритет здоров’я і безпеки в управлінських рішеннях":{"title":"Пріоритет здоров’я і безпеки в управлінських рішеннях","verify":"Працівники бачать, що вимога виконати план або дотриматися терміну може суперечити безпечному способу роботи.","action":"Розберіть 2-3 випадки конфлікту між виробничою вимогою і безпекою. Визначте, хто може зупинити або змінити небезпечну роботу і хто надає додатковий час, людей чи інший ресурс, якщо безпечне виконання цього потребує.","check":"Працівник може повідомити про ризик без негативних наслідків; у перевірених випадках зрозуміло, хто ухвалив рішення і як було забезпечено безпечне виконання."},"Цифрова та інформаційна доступність":{"title":"Цифрова та інформаційна доступність","verify":"Працівник не може повноцінно користуватися цифровим інструментом або робочою інформацією через формат, пристрій, канал або function comboTemplate(e,l,p){
  let key=`${e}|${l}|${p}`;
  if(COMBO64[key])return COMBO64[key];
  // Окремий випадок: у робочому середовищі немає керівників із прямими підлеглими.
  if(l==='Не застосовується'){
    let base=COMBO64[`${e}|Туман|${p}`];
    return {
      ...base,
      signal:(base?.signal||'')+' Джерело керівників у цьому робочому середовищі не застосовується.',
      confirmed:`${E_DESC_RUNTIME[e]||''} У цьому робочому середовищі немає керівників із прямими підлеглими, тому управлінський блок не застосовується. ${P_DESC_RUNTIME[p]||''}`,
      gap_analysis:(base?.gap_analysis||[]).filter(x=>!x.toLowerCase().includes('керівник')).concat(['У цьому робочому середовищі немає керівників із прямими підлеглими, тому управлінський блок не застосовується і не використовується для порівняння.'])

}

    if(em?.masked||lm?.masked)hyp.unshift('Середній результат модуля відповідав би умовам «Ясно», але окреме оцінюване твердження має умови «Бурі». Тому статус модуля обмежено до «Хмарно», щоб сильний локальний сигнал не був замаскований середнім.');
    if(mid===7&&pr.p40Warning)hyp.unshift(pr.p40Warning);
    return {
      m:mid,e,l,p,
      signal:tpl?.signal||comboText(e,l,p),
      confirmed:stats+' '+(tpl?.confirmed||''),
      gap_analysis:tpl?.gap_analysis||[comboText(e,l,p)],
      hypotheses:hyp,
      checks:tpl?.checks||['Перевірте конкретні проблемні аспекти та пов’язані організаційні практики.'],

      actions:[]
    };
  })
}

function weakestSurveyItems(sourceResult,moduleId,limit=3){
  return Object.values(sourceResult?.items||{})
    .filter(x=>x.module===moduleId&&x.adequate&&FINE_ITEMS[x.code])
    .sort((a,b)=>(a.favorable??100)-(b.favorable??100)||(b.unfavorable??0)-(a.unfavorable??0))
    .slice(0,limit)
}
function problemIssues(moduleId){
  if(S.demo)return (DEMO_ISSUES[moduleId]||[]).map(code=>({code,...FINE_ITEMS[code]}));
  let eobj=env(S.env),sr=getSurveyResults(eobj),out=[];
  const add=(x,fallback=false)=>{if(x&&FINE_ITEMS[x.code]&&!out.some(y=>y.code===x.code))out.push({code:x.code,...FINE_ITEMS[x.code],fallback})};
  let eProblems=(sr?.e?.problems||[]).filter(x=>x.module===moduleId&&FINE_ITEMS[x.code]);
  eProblems.forEach(x=>add(x,false));
  if(!eProblems.length&&['Хмарно','Буря'].includes(sr?.e?.modules?.[moduleId]?.status))weakestSurveyItems(sr.e,moduleId,3).forEach(x=>add(x,true));
  if(sr?.l?.detailAllowed){
    let lProblems=(sr?.l?.problems||[]).filter(x=>x.module===moduleId&&FINE_ITEMS[x.code]);
    lProblems.forEach(x=>add(x,false));
    if(!lProblems.length&&['Хмарно','Буря'].includes(sr?.l?.modules?.[moduleId]?.status))weakestSurveyItems(sr.l,moduleId,3).forEach(x=>add(x,true));
  }
  return out
}
function attentionAspects(moduleId,row){
  if(S.demo)return problemIssues(moduleId).map(i=>({source:i.source,topic:i.topic}));
  let eobj=env(S.env),sr=getSurveyResults(eobj),out=[],seen=new Set();
  const add=(source,topic)=>{
    const key=source+'|'+topic;
    if(!topic||seen.has(key))return;
    seen.add(key);out.push({source,topic});
  };

  const routed=problemIssues(moduleId);
  const eRouted=routed.filter(x=>x.source==='Працівники');
  eRouted.forEach(x=>{const ir=sr?.e?.items?.[x.code],nums=ir&&ir.adequate?` (${fmtPct(ir.favorable)} сприятливих; ${fmtPct(ir.unfavorable)} несприятливих)`:'';add('Працівники',(x.fallback?`серед найслабших результатів модуля: ${x.topic}`:x.topic)+nums)});
  if(row.e!=='Ясно'&&eRouted.length===0){
    if(row.e==='Туман')add('Працівники','недостатньо даних, щоб визначити конкретні аспекти цього модуля');
    else add('Працівники','модуль потребує уваги, але доступних деталізованих даних недостатньо для коректного визначення окремого аспекту');
  }

  const lRouted=routed.filter(x=>x.source==='Керівники');
  lRouted.forEach(x=>{const ir=sr?.l?.items?.[x.code],nums=ir&&ir.adequate&&sr?.l?.detailAllowed?` (${fmtPct(ir.favorable)} сприятливих; ${fmtPct(ir.unfavorable)} несприятливих)`:'';add('Керівники',(x.fallback?`серед найслабших результатів модуля: ${x.topic}`:x.topic)+nums)});
  if(row.l!=='Ясно'&&row.l!=='Не застосовується'&&lRouted.length===0){
    if(row.l==='Туман')add('Керівники','недостатньо даних, щоб визначити конкретні аспекти цього модуля');
    else if(sr?.l && !sr.l.detailAllowed) add('Керівники',`результат можна використовувати на рівні модуля, але окремі аспекти не показуються: отримано ${sr.l.totalResponses} відповідей керівників, тому деталізація обмежена для захисту конфіденційності`);
    else add('Керівники','модуль потребує уваги, але доступних деталізованих даних недостатньо для коректного визначення окремого аспекту');
  }

  let pr=period()?.checkup?.results||calculatePResults(period().checkup);
  for(const x of pr?.problems||[])if(x.module===moduleId)add('Організаційний чекап',x.text);
  for(const x of pr?.uncertain||[])if(x.module===moduleId)add('Організаційний чекап',`${x.text} Недостатньо підтверджених даних для оцінювання.`);
  if(row.p!=='Ясно'&&out.filter(x=>x.source==='Організаційний чекап').length===0){
    if(row.p==='Туман')add('Організаційний чекап','недостатньо підтверджених даних, щоб визначити фактичний стан частини практик цього модуля');
    else add('Організаційний чекап','перевірте практики цього модуля, які реалізовані частково або не працюють у повному обсязі');
  }

  const available=[row.e,row.l,row.p].filter(x=>x&&x!=='Не застосовується');
  if(available.length&&available.every(x=>x==='Ясно'))return [];
  return out;
}

function xmlEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function xlsxColName(n){let s='';for(n++;n>0;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}
function crc32Bytes(bytes){
  let c=0xffffffff;
  for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}
  return (c^0xffffffff)>>>0
}
function le16(n){return [n&255,(n>>>8)&255]}
function le32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function zipStored(files){
  const te=new TextEncoder(),locals=[],centrals=[];let offset=0;
  const now=new Date(),dosTime=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xffff,
        dosDate=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xffff;
  for(const f of files){
    const name=te.encode(f.name),data=typeof f.data==='string'?te.encode(f.data):f.data,crc=crc32Bytes(data);
    const local=new Uint8Array([
      0x50,0x4b,0x03,0x04,...le16(20),...le16(0x0800),...le16(0),...le16(dosTime),...le16(dosDate),
      ...le32(crc),...le32(data.length),...le32(data.length),...le16(name.length),...le16(0),...name,...data
    ]);
    locals.push(local);
    const central=new Uint8Array([
      0x50,0x4b,0x01,0x02,...le16(20),...le16(20),...le16(0x0800),...le16(0),...le16(dosTime),...le16(dosDate),
      ...le32(crc),...le32(data.length),...le32(data.length),...le16(name.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(offset),...name
    ]);
    centrals.push(central);offset+=local.length
  }
  const centralSize=centrals.reduce((n,x)=>n+x.length,0),end=new Uint8Array([
    0x50,0x4b,0x05,0x06,...le16(0),...le16(0),...le16(files.length),...le16(files.length),
    ...le32(centralSize),...le32(offset),...le16(0)
  ]);
  const total=offset+centralSize+end.length,out=new Uint8Array(total);let pos=0;
  for(const x of locals){out.set(x,pos);pos+=x.length}
  for(const x of centrals){out.set(x,pos);pos+=x.length}
  out.set(end,pos);return out
}

  const types=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`;

function selectedActions(moduleId){
  const issues=problemIssues(moduleId), map=new Map();
  if(!S.demo){
    for(const pr of period()?.checkup?.results?.problems||[]){
      if(pr.module!==moduleId)continue;
      const state=checkupStateFor(pr.code);if(!state)continue;
      map.set(pr.code,{target:pr.code,state,score:stateWeight(state)+50,issues:[{code:pr.code,source:'Організаційний чекап',topic:pr.text,links:[],compound:false}]});
    }
  }
  for(const issue of issues){
    for(const link of issue.links){
      const target=link.target;
      if(target.startsWith('P')){
        const state=routedPState(target);
        if(link.role==='conditional' && state==='Реалізовано повністю') continue;
        const prev=map.get(target)||{target,state,score:0,issues:[]};
        prev.score=Math.max(prev.score,stateWeight(state)+roleWeight(link.role));
        prev.issues.push(issue); map.set(target,prev);
      } else if(target.startsWith('THEME:')){
        const prev=map.get(target)||{target,state:null,score:130,issues:[]};
        prev.issues.push(issue); map.set(target,prev);
      }
    }
  }
  for(const [key,c] of [...map]){
    if(key.startsWith('THEME:') && c.issues.some(x=>x.compound)){
      const hasWeakP=[...map.values()].some(x=>x.target.startsWith('P')&&x.state!=='Реалізовано повністю'&&x.issues.some(i=>c.issues.some(ci=>ci.code===i.code)));
      if(hasWeakP) map.delete(key);
    }
  }
  for(const c of map.values()){
    const src=new Set(c.issues.map(i=>i.source));
    if(src.size>1)c.score+=40;
  }
  if(!S.demo){for(const pr of P[moduleId]){let state=routedPState(pr.code);if(state!=='Реалізовано повністю'&&ACTION_LIB[pr.code]&&!map.has(pr.code)){map.set(pr.code,{target:pr.code,state,score:stateWeight(state)+20,issues:[{code:pr.code,source:'Організаційний чекап',topic:pr.text,links:[],compound:false}]})}}}
  return [...map.values()].sort((a,b)=>b.score-a.score).slice(0,3).map(c=>{
    if(c.target.startsWith('P')){
      const x=ACTION_LIB[c.target],mode=actionMode(c.state);
      return {...c,mode,
        title:mode==='ПЕРЕВІРИТИ РОЗРИВ'?'Перевірити розрив: '+x.title:
              mode==='УТОЧНИТИ ДАНІ'?'Уточнити дані: '+x.title:x.title,
        verify:mode==='УТОЧНИТИ ДАНІ'
          ?'Зберіть факти про охоплення, спосіб реалізації та приклади застосування практики. Не трактуйте брак підтверджень як відсутність самої практики.'
          :x.verify,
        action:mode==='ПЕРЕВІРИТИ РОЗРИВ'
          ?'Не поспішайте запроваджувати нову практику. Спочатку перевірте, чи наявна практика реально працює в цьому робочому середовищі: чи охоплює потрібних працівників, чи вони знають про неї, мають до неї доступ і чи застосовується вона послідовно у повсякденній роботі. Після цього змінюйте саме ту складову, де підтверджено прогалину.'
          :mode==='УТОЧНИТИ ДАНІ'
            ?'Спочатку уточніть фактичний стан практики. Організаційну дію обирайте лише після того, як буде зрозуміло, чи практика реалізована повністю, частково або не працює.'
            :x.action,
        check:mode==='УТОЧНИТИ ДАНІ'
          ?'Є достатньо підтверджених даних, щоб визначити фактичний рівень реалізації практики: повністю, частково або не реалізовано.'
          :x.check,
        planEligible:mode!=='УТОЧНИТИ ДАНІ'};
    }
    const title=c.target.slice(6),x=THEMATIC_LIB[title];
    return {...c,mode:'ПЕРЕВІРИТИ / ПОКРАЩИТИ',title:x.title,verify:x.verify,action:x.action,check:x.check};
  });
}

function evidenceActionCards(moduleId,actions){

}
function aggregateSource(rows,source,invited){

      continue

    if(usable.length<fullItems)qualityReasons.push('не всі твердження модуля мають достатньо застосовних відповідей');
    if(usable.some(x=>x.naRate>=25))qualityReasons.push('для окремих тверджень значна частка респондентів обрала «Не стосується моєї роботи»');
    if(source==='L'&&n<10)qualityReasons.push(`отримано ${n} відповідей керівників, тому результати окремих тверджень не показуються для захисту конфіденційності`);

function calculatePResults(cp){
  let answers=cp.answers||{},modules={};
  for(let mid=1;mid<=7;mid++){
    let list=P[mid],vals=list.map(x=>answers[x.code]);
    if(vals.some(x=>!x)){
      modules[mid]={status:null,complete:false,quality:'Недостатня',qualityReasons:['не всі практики модуля оцінені']};
      continue
    }
    let noCodes=list.filter((x,i)=>vals[i]==='no').map(x=>x.code);
    let insufficientCodes=list.filter((x,i)=>vals[i]==='insufficient').map(x=>x.code);
    let criticalNo=noCodes.filter(c=>CRITICAL_P.has(c));
    let p40=list.some(x=>x.code==='P40')&&answers.P40==='no'&&cp.p40Risk==='confirmed';
    if(p40)criticalNo.push('P40');

    let quality=insufficientCodes.length===0?'Достатня':insufficientCodes.length<=2?'З обмеженнями':'Недостатня';
    let qualityReasons=insufficientCodes.length?[`для ${insufficientCodes.length} ${insufficientCodes.length===1?'практики':'практик'} недостатньо підтверджених даних для оцінювання`]:[];
    let status;
    if(criticalNo.length||noCodes.length>=2)status='Буря';
    else if(insufficientCodes.length>=3)status='Туман';
    else if(vals.every(v=>v==='full'))status='Ясно';
    else status='Хмарно';

    modules[mid]={
      status,complete:true,quality,qualityReasons,
      full:vals.filter(v=>v==='full').length,
      partial:vals.filter(v=>v==='partial').length,
      notImplemented:noCodes.length,
      insufficient:insufficientCodes.length,
      insufficientCodes,
      criticalMissing:[...new Set(criticalNo)]
    };
  }
  return {
    modules,
    problems:P_LIST.filter(x=>answers[x.code]==='no'||answers[x.code]==='partial').map(x=>({code:x.code,module:x.module,text:x.text,answer:answers[x.code]})),
    uncertain:P_LIST.filter(x=>answers[x.code]==='insufficient').map(x=>({code:x.code,module:x.module,text:x.text,answer:answers[x.code]})),
    p40Risk:cp.p40Risk||null,
    p40Warning:cp.p40Risk==='needs_check'?'Для P40 не вдалося однозначно визначити, чи є актуальний ризик насильства та домагань з боку третіх осіб. Уточніть це перед інтерпретацією цієї практики.':null
  }
}

function comboText(e,l,p){
  let parts=[],rank={'Буря':1,'Хмарно':2,'Ясно':3},available=x=>x&&rank[x]!=null;
  if(e==='Туман'||l==='Туман')parts.push('Одне з опитувальних джерел має недостатньо даних; його не слід використовувати для порівняльного висновку.');
  if(l==='Не застосовується')parts.push('У цьому робочому середовищі джерело керівників не застосовується, тому порівняння виконується за доступними джерелами.');
  if(available(e)&&available(p)&&e!==p)parts.push(rank[e]<rank[p]?'Є розрив між сильнішою формальною організаційною основою та менш сприятливим досвідом працівників.':'Є розрив між сприятливішим досвідом працівників і слабшою організаційною основою.');
  if(available(l)&&available(p)&&l!==p)parts.push(rank[l]<rank[p]?'Є розрив між організаційним механізмом і можливістю керівників реально його застосовувати.':'Є розрив між слабшою організаційною основою та сприятливішими умовами, які описують керівники.');
  if(available(e)&&available(l)&&e!==l)parts.push(rank[e]<rank[l]?'Є розрив між умовами, які описують керівники, і фактичним досвідом працівників.':'Працівники описують ситуацію сприятливіше, ніж керівники оцінюють умови виконання управлінської ролі.');
  let n=[e,l,p].filter(available).length;
  if(!parts.length&&n>=2)parts.push('Вираженого розриву між доступними погодними статусами не виявлено.');
  if(!parts.length&&n<2)parts.push('Розрив не визначається, оскільки доступно менше двох джерел.');
  return parts.join(' ')
}

      <div class="field full"><label>Назва періоду</label><input id="rl" value="${h(period().label||'')}"></div>
    </div>
    <p class="small muted">Якщо для поточного періоду вже завантажені дані, зміна дат має відповідати фактичному періоду збору цих даних.</p>
    <div class="modal-actions"><button class="btn ghost" data-a="close">Скасувати</button><button class="btn primary" data-a="save-research">Зберегти зміни</button></div>
  </div></div>`;
  if(m.t==='manual-action')return `<div class="modal-backdrop"><div class="modal">
    <h3>Додайте організаційну дію</h3>
    <div class="form-grid">
      <div class="field full"><label>Назва дії *</label><input id="ma-title" placeholder="Коротко назвіть дію"></div>
      <div class="field full"><label>Опис дії *</label><textarea id="ma-description" placeholder="Опишіть, що саме потрібно зробити"></textarea></div>
      <div class="field"><label>Робоче середовище</label><select id="ma-env"><option value="">Загальна дія для компанії</option>${(period()?.envs||[]).map(e=>`<option value="${h(e.id)}" ${S.env===e.id?'selected':''}>${h(e.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Пріоритетність</label><select id="ma-priority"><option>Високий</option><option selected>Середній</option><option>Низький</option></select></div>
      <div class="field"><label>Статус</label><select id="ma-status"><option>Не розпочато</option><option>У роботі</option><option>Виконано</option></select></div>
      <div class="field"><label>Відповідальний</label><input id="ma-owner"></div>
      <div class="field"><label>Термін реалізації</label><input id="ma-due"></div>
      <div class="field full"><label>Показник виконання</label><input id="ma-indicator"></div>
    </div>
    <div class="modal-actions"><button class="btn ghost" data-a="close">Скасувати</button><button class="btn primary" data-a="save-manual-action">Додати до Плану організаційних змін</button></div>
  </div></div>`;
  if(m.t==='period')return `<div class="modal-backdrop"><div class="modal"><h3>Додати новий період</h3><div class="form-grid"><div class="field"><label>Початок *</label><input id="ns" type="date"></div><div class="field"><label>Завершення *</label><input id="ne" type="date"></div><div class="field full"><label>Назва періоду</label><input id="nl"></div></div><label class="choice" style="margin-top:12px"><input id="inherit" type="checkbox" checked>Перенести перелік робочих середовищ із поточного періоду</label><div class="modal-actions"><button class="btn ghost" data-a="close">Скасувати</button><button class="btn primary" data-a="save-period">Додати період</button></div></div></div>`;
  return''
}
function growPlanTextareas(){
  document.querySelectorAll('textarea[data-autogrow="1"]').forEach(el=>{
    el.style.height='auto';
    el.style.height=Math.max(96,el.scrollHeight)+'px';
  })
}
function render(){
  let html=S.screen==='start'?start():S.screen==='setup'?setup():S.screen==='home'?home():S.screen==='checkup'?checkup():S.screen==='complete'?complete():S.screen==='dash'?dash():S.screen==='interpret'?interpret():S.screen==='recs'?recs():plan();
  $('#app').innerHTML=html+modal();
  growPlanTextareas()
}
document.addEventListener('submit',e=>{
  if(e.target.id==='first-env'){
    e.preventDefault();
    let name=$('#fen').value.trim(),emp=+$('#fee').value,man=+$('#fem').value,invE=$('#fei').value?+$('#fei').value:null,invL=$('#fli').value?+$('#fli').value:null;
    if(!name||emp<1||man<0)return alert('Заповніть усі обов’язкові поля.');
    period().envs.push({id:uid('e'),name,emp,man,invE,invL,survey:{}});
    save();render();return
  }
  if(e.target.id!=='setup')return;
  e.preventDefault();
  let id=uid('p'),st=$('#ps').value,en=$('#pe').value;
  S.r={company:$('#company').value.trim(),owner:$('#owner').value.trim(),current:id,periods:[{id,label:$('#pl').value.trim()||`${st} - ${en}`,start:st,end:en,envs:[],checkup:{answers:{},notes:{},done:false,asOfDate:todayISO(),schemaVersion:CHECKUP_SCHEMA_VERSION}}],plan:[]};
  save();S.screen='home';render()
});
function updatePlanField(e){if(e.target.dataset.f){let c=e.target.closest('[data-p]'),a=S.r.plan.find(x=>x.id===c.dataset.p);if(a){a[e.target.dataset.f]=e.target.value;save()}}}
document.addEventListener('change',e=>{
  if(e.target.id==='checkup-date'&&S.screen==='checkup'){
    period().checkup.asOfDate=e.target.value;save()
  }
  if(e.target.type==='radio'&&S.screen==='checkup'){
    if(e.target.name==='p40Risk')period().checkup.p40Risk=e.target.value;
    else if(/^P\d{2}$/.test(e.target.name)){
      period().checkup.answers[e.target.name]=e.target.value;
      if(e.target.name==='P40'&&e.target.value!=='no')period().checkup.p40Risk=null;
    }
    period().checkup.results=calculatePResults(period().checkup);save()
  }
  updatePlanField(e)
});
document.addEventListener('input',e=>{
  if(e.target.dataset.note&&S.screen==='checkup'){period().checkup.notes=period().checkup.notes||{};period().checkup.notes[e.target.dataset.note]=e.target.value;save()}
  updatePlanField(e);
  if(e.target.matches('textarea[data-autogrow="1"]')){
    e.target.style.height='auto';
    e.target.style.height=Math.max(96,e.target.scrollHeight)+'px'
  }
});
document.addEventListener('click',async e=>{
  let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a;
  if(a==='new')S.screen='setup';
  if(a==='start'){S.r=null;S.screen='start'}
  if(a==='continue'){S.r=load();S.screen='home'}
  if(a==='restore-open')S.modal={t:'restore'};
  if(a==='home'){if(S.demo){S.screen='dash'}else{S.screen='home'};S.modal=null;window.scrollTo(0,0)}
  if(a==='edit-research')S.modal={t:'edit-research'};
  if(a==='backup-info')S.modal={t:'backup'};
  if(a==='add-env')S.modal={t:'env'};
  if(a==='edit-env')S.modal={t:'env',edit:true,e:env(b.dataset.id)};
  if(a==='close')S.modal=null;
  if(a==='save-env'){
    let name=$('#en').value.trim(),emp=+$('#ee').value,man=+$('#em').value,invE=$('#ei').value?+$('#ei').value:null,invL=$('#li').value?+$('#li').value:null;
    if(!name||emp<1||man<0)return alert('Заповніть усі обов’язкові поля.');
    if(S.modal.edit)Object.assign(S.modal.e,{name,emp,man,invE,invL});
    else period().envs.push({id:uid('e'),name,emp,man,invE,invL,survey:{}});
    S.modal=null;save()
  }
  if(a==='save-research'){
    let company=$('#rc').value.trim(),owner=$('#ro').value.trim(),st=$('#rs').value,en=$('#re').value,label=$('#rl').value.trim(),p=period();
    if(!company||!owner||!st||!en||!label)return alert('Заповніть усі поля.');
    let changed=st!==p.start||en!==p.end,has=p.envs.some(x=>x.survey?.ok);
    if(changed&&has&&!confirm('Для цього періоду вже є дані опитування. Підтвердьте, що нові дати відповідають фактичному періоду збору даних.'))return;
    S.r.company=company;S.r.owner=owner;p.start=st;p.end=en;p.label=label;S.modal=null;save()
  }
  if(a==='upload')S.modal={t:'upload',step:1,e:env(b.dataset.id)};
  if(a==='validate'){
    let file=$('#file')?.files?.[0];if(!file)return alert('Оберіть файл.');let en=S.modal.e;
    try{
      let table=await readSurveyFile(file),v=validateTableRows(table,file.name),calc=null;
      if(!v.errors.length){let eRows=v.rows,lRows=v.rows.filter(x=>x.isManager);calc={e:aggregateSource(eRows,'E',en.invE),l:aggregateSource(lRows,'L',en.invL)}}
      S.modal={t:'upload',step:2,e:en,v,calc,replace:!!getSurveyResults(en)};
    }catch(err){S.modal={t:'upload',step:2,e:en,v:{total:0,managers:0,errors:[String(err.message||err)],warnings:[]},calc:null,replace:!!getSurveyResults(en)}}
  }
  if(a==='accept'){
    if(!S.modal?.calc||S.modal.v.errors.length||S.modal.calc.e.totalResponses<1)return;
    let en=S.modal.e;en.survey={ok:true,leaders:S.modal.calc.l.totalResponses>0||Number(en.man||0)===0,e:S.modal.calc.e.totalResponses,l:S.modal.calc.l.totalResponses,results:S.modal.calc,importMeta:{filename:S.modal.v.fileName,calculatedAt:new Date().toISOString(),warnings:S.modal.v.warnings}};
    S.modal=null;save()
  }
  if(a==='checkup'){
    let cp=period().checkup||{};
    if(cp.schemaVersion!==CHECKUP_SCHEMA_VERSION){
      period().checkup={answers:{},notes:{},done:false,asOfDate:todayISO(),schemaVersion:CHECKUP_SCHEMA_VERSION};
      cp=period().checkup;save()
    }
    if(!cp.asOfDate){cp.asOfDate=todayISO();save()}
    S.screen='checkup';window.scrollTo(0,0)
  }
  if(a==='prev'){S.module=Math.max(1,S.module-1);window.scrollTo(0,0)}
  if(a==='next'){
    let missing=P[S.module].filter(x=>!period().checkup.answers[x.code]);
    if(missing.length)S.modal={t:'missing'};
    else{S.module=Math.min(7,S.module+1);window.scrollTo(0,0)}
  }
  if(a==='force-next'){S.modal=null;S.module=Math.min(7,S.module+1);window.scrollTo(0,0)}
  if(a==='finish'){
    let cp=period().checkup,missing=P_LIST.filter(x=>!cp.answers[x.code]);
    if(!cp.asOfDate)return alert('Вкажіть дату, станом на яку проведено організаційний чекап.');
    if(missing.length)return alert('Щоб завершити організаційний чекап, оцініть усі 42 практики.');
    if(cp.answers.P40==='no'&&!cp.p40Risk)return alert('Для P40 уточніть, чи виявлено актуальний ризик насильства або домагань з боку третіх осіб.');
    cp.results=calculatePResults(cp);cp.done=true;cp.schemaVersion=CHECKUP_SCHEMA_VERSION;save();S.screen='complete';window.scrollTo(0,0)
  }
  if(a==='dash'){let target=env(b.dataset.id||S.env);if(!S.demo&&!canDashboard(target))return alert('Дашборд стане доступним після завантаження необхідних даних опитування та завершення організаційного чекапу.');S.env=b.dataset.id||S.env;S.screen='dash';window.scrollTo(0,0)}
  if(a==='interpret'){S.module=+b.dataset.m||S.module;S.screen='interpret';window.scrollTo(0,0)}
  if(a==='recs')S.screen='recs';
  if(a==='add-plan'){
    S.r.plan.push({
      id:uid('a'),
      module:M[S.module-1],
      aspect:'Проблемний аспект із результатів',
      action:['Уточнити порядок дій і відповідальність','Перевірити, як практика працює на рівні команд','Визначити спосіб повторної перевірки результативності'][+b.dataset.i],
      priority:'Середній',status:'Не розпочато'
    });
    save();b.textContent='Додано до плану';b.disabled=true
  }
  if(a==='plan'){S.screen='plan';window.scrollTo(0,0)}
  if(a==='save-plan'){
    save();
    b.textContent='Збережено';
    b.disabled=true;
    setTimeout(()=>{b.textContent='Зберегти зміни';b.disabled=false},1200);
    return;
  }
  if(a==='plan-nav'){
    const target=document.querySelector(`[data-p="${b.dataset.id}"]`);
    if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(a==='manual')S.modal={t:'manual-action'};
  if(a==='save-manual-action'){
    let title=$('#ma-title').value.trim(),description=$('#ma-description').value.trim();
    if(!title||!description)return alert('Заповніть назву та опис дії.');
    S.r.plan.push({
      id:uid('a'),
      module:'Додано вручну',
      envId:$('#ma-env').value||null,
      aspect:'',
      action:title,
      description,
      priority:$('#ma-priority').value,
      status:$('#ma-status').value,
      owner:$('#ma-owner').value.trim(),
      due:$('#ma-due').value.trim(),
      indicator:$('#ma-indicator').value.trim()
    });
    S.modal=null;save();S.screen='plan'
  }
  if(a==='del'){
    if(confirm('Видалити цю дію з Плану організаційних змін?')){
      S.r.plan=S.r.plan.filter(x=>x.id!==b.dataset.id);save()
    }
  }
  if(a==='backup-download'){
    let payload={format:'barometr-backup',version:'r42',exportedAt:new Date().toISOString(),data:S.r},
      blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),x=document.createElement('a');
    x.href=URL.createObjectURL(blob);
    x.download=`Резервна_копія_${safeFilePart(S.r.company)}_${safeFilePart(period().label)}.json`;
    x.click();setTimeout(()=>URL.revokeObjectURL(x.href),1000);S.modal=null
  }
  if(a==='restore-backup'){
    let file=$('#restore-file')?.files?.[0];if(!file)return alert('Оберіть файл резервної копії.');
    try{
      let obj=JSON.parse(await file.text()),r=obj?.format==='barometr-backup'?obj.data:obj;
      if(!r||typeof r!=='object'||!r.company||!r.owner||!Array.isArray(r.periods)||!r.periods.length)throw new Error('Файл не містить коректної структури дослідження.');
      if(!Array.isArray(r.plan))r.plan=[];
      let resetCheckup=false;
      for(const p of r.periods){
        if(!p.checkup||p.checkup.schemaVersion!==CHECKUP_SCHEMA_VERSION){
          p.checkup={answers:{},notes:{},done:false,asOfDate:todayISO(),schemaVersion:CHECKUP_SCHEMA_VERSION};
          resetCheckup=true;
        } else if(p.checkup.asOfDate===p.end && p.end>todayISO()) {
          p.checkup.asOfDate=todayISO();
        }
      }
      localStorage.setItem(STORE,JSON.stringify(r));S.r=r;S.demo=false;S.returnResearch=null;S.env=null;S.screen='home';S.modal=null;window.scrollTo(0,0);
      if(resetCheckup)alert('Резервну копію відновлено. Оскільки організаційний чекап оновлено, його потрібно заповнити повторно для кожного періоду.')
    }catch(err){alert('Не вдалося відновити резервну копію: '+String(err.message||err));return}
  }
  if(a==='switch-period'){
    const target=S.r.periods.find(x=>x.id===b.dataset.id);
    if(target){S.r.current=target.id;S.env=null;S.screen='home';save();window.scrollTo(0,0);render()}
    return;
  }
  if(a==='new-period')S.modal={t:'period'};
  if(a==='save-period'){
    let st=$('#ns').value,en=$('#ne').value;
    if(!st||!en)return alert('Вкажіть період.');
    let old=period(),id=uid('p'),envs=$('#inherit').checked
      ?old.envs.map(x=>({id:uid('e'),name:x.name,emp:x.emp,man:x.man,invE:x.invE??null,invL:x.invL??null,survey:{}}))
      :[];
    S.r.periods.push({id,label:$('#nl').value.trim()||`${st} - ${en}`,start:st,end:en,envs,checkup:{answers:{},notes:{},done:false,asOfDate:todayISO(),schemaVersion:CHECKUP_SCHEMA_VERSION}});
    S.r.current=id;S.modal=null;save()
  }

  if(a==='toggle-detail'){
    let id='matrix-detail-'+b.dataset.m,el=document.getElementById(id);
    if(el){
      el.classList.toggle('open');
      b.textContent=el.classList.contains('open')?'Згорнути інтерпретацію':'Переглянути інтерпретацію';
    }
    return;
  }
  if(a==='add-routed-action'){
    const moduleId=+b.dataset.m,target=b.dataset.target,x=selectedActions(moduleId).find(z=>z.target===target);
    if(x){
      if(planHasAction(moduleId,target)){b.textContent='Уже додано';b.disabled=true;return}
      S.r.plan.push({id:uid('a'),envId:S.env,sourceTarget:target,module:M[moduleId-1],aspect:[...new Set(x.issues.map(i=>i.topic))].join('; '),action:x.title.replace(/^Перевірити розрив:\s*/,''),description:x.action,priority:'Середній',status:'Не розпочато',indicator:x.check});
      save();
      const replacement=document.createElement('span');
      replacement.className='data-quality';
      replacement.textContent='Дію додано до Плану організаційних змін.';
      b.replaceWith(replacement);
    }
    return;
  }
  if(a==='add-plan-inline'){
    let r=resultModel().find(x=>x.m===+b.dataset.m),action=r?.actions?.[+b.dataset.i];
    if(r&&action){
      S.r.plan.push({id:uid('a'),module:M[r.m-1],aspect:r.signal,action,description:'',priority:'Середній',status:'Не розпочато'});
      save();b.textContent='Додано до плану';b.disabled=true
    }
  }

  if(a==='report'){
    let ready=(period()?.envs||[]).filter(e=>canDashboard(e));
    let target=env(S.env);
    if(!target||!canDashboard(target)){
      let planEnvIds=[...new Set((S.r.plan||[]).map(x=>x.envId).filter(Boolean))];
      if(planEnvIds.length===1)target=env(planEnvIds[0]);
      else if(ready.length===1)target=ready[0];
    }
    if(target&&canDashboard(target))downloadReport(target);
    else if(ready.length>1)alert('Є кілька робочих середовищ із готовими результатами. Відкрийте потрібне робоче середовище на огляді дослідження, а потім завантажте звіт.');
    else alert('Для створення звіту спочатку мають бути готові результати робочого середовища.');
    return;
  }
  if(a==='export'){downloadPlanXlsx();return}
  render()
});
render();
</script>
</body>
</html>
