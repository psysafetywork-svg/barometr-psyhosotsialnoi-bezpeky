<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Ð‘Ð°Ñ€Ð¾Ð¼ÐµÑ‚Ñ€ Ð¿ÑÐ¸Ñ…Ð¾ÑÐ¾Ñ†Ñ–Ð°Ð»ÑŒÐ½Ð¾Ñ— Ð±ÐµÐ·Ð¿ÐµÐºÐ¸ Ñ€Ð¾Ð±Ð¾Ñ‡Ð¾Ð³Ð¾ ÑÐµÑ€ÐµÐ´Ð¾Ð²Ð¸Ñ‰Ð°</title>
  <style>
    :root{
      --paper:#f8f6f1;
      --paper-2:#f1eee7;
      --card:#fffdfa;
      --ink:#18314f;
      --text:#334b62;
      --muted:#6f7d8e;
      --line:#e4ded3;
      --gold:#cd8b32;
      --gold-soft:#f7ead4;
      --teal:#397886;
      --teal-soft:#e7f0f1;
      --storm:#8f5c49;
      --storm-soft:#f2e5df;
      --fog:#7d8c90;
      --fog-soft:#edf0ef;
      --shadow:0 20px 55px rgba(30,48,65,.08);
      --radius:24px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:24px}
    body{margin:0;background:var(--paper);color:var(--text);font-family:Arial,sans-serif;font-size:17px;line-height:1.62}
    button,a{font:inherit}
    a{color:var(--teal);text-underline-offset:3px}
    button{color:inherit}
    .skip-link{position:fixed;left:18px;top:-80px;z-index:1000;padding:10px 16px;border-radius:10px;background:var(--ink);color:#fff;text-decoration:none}
    .skip-link:focus{top:18px}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

    /* The supplied screenshot remains the exact visual base of the first screen. */
    .hero-viewport{width:100%;overflow:hidden;background:#fff}
    .hero-stage{position:relative;width:100%;min-width:820px;aspect-ratio:972/547;isolation:isolate}
    .hero-image{position:absolute;inset:0;width:100%;height:100%;display:block}
    .hero-copy-crisp{position:absolute;inset:0;z-index:5;width:100%;height:100%;display:block;pointer-events:none;text-rendering:geometricPrecision}
    .hero-hit{position:absolute;z-index:6;display:block;border-radius:10px;outline-offset:4px;background:transparent}
    .hero-hit:focus-visible{outline:3px solid var(--gold);background:rgba(255,255,255,.2)}
    .hit-home{left:3.2%;top:1.1%;width:28.3%;height:5.5%}
    .hit-meta{left:45.4%;top:.8%;width:11.1%;height:6.2%}
    .hit-protocol{left:58%;top:.8%;width:14.2%;height:6.2%}
    .hit-actions{left:73.2%;top:.8%;width:12.4%;height:6.2%}
    .hit-evidence{left:85.9%;top:.8%;width:11.1%;height:6.2%}

    /* Only the vertical spacing of the button/card group is changed. */
    .hero-mask{position:absolute;z-index:2;left:2.2%;top:56.8%;width:54.5%;height:37.7%;background:linear-gradient(90deg,#fefaf2 0%,#faf8f1 55%,#f2efe9 82%,#dddcd8 91%,rgba(221,220,216,0) 100%);pointer-events:none}
    .hero-controls{position:absolute;z-index:3;left:3.7%;top:58.3%;width:47.7%;height:29.1%;color:var(--ink)}
    .hero-guide{position:absolute;left:0;top:0;width:46%;height:23.2%;display:flex;align-items:center;justify-content:space-between;padding:0 3.3% 0 7.4%;border:1px solid rgba(218,207,192,.82);border-radius:.84vw;background:rgba(255,255,255,.72);box-shadow:0 .3vw 1.1vw rgba(49,57,62,.035);color:#1e385b;text-decoration:none;font-weight:700;font-size:1.34vw;line-height:1}
    .hero-guide:hover{background:rgba(255,255,255,.94);border-color:#d1b486}
    .hero-guide:focus-visible,.hero-card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    .guide-arrow{font-size:1.6vw;font-weight:400}
    .hero-cards{position:absolute;left:0;top:0;width:100%;height:72.2%;display:grid;grid-template-columns:48.3% 49.6%;gap:2.1%}
    .hero-card{display:grid;grid-template-columns:20.5% 1fr;align-items:start;padding:8.2% 5.8%;border:1px solid rgba(221,214,204,.88);border-radius:.9vw;background:rgba(255,255,255,.82);box-shadow:0 .4vw 1.2vw rgba(53,62,67,.025);color:#27405f;text-align:left;text-decoration:none;cursor:pointer}
    button.hero-card{width:100%;appearance:none}
    .hero-card:hover{background:rgba(255,255,255,.97);border-color:#d6c4aa}
    .hero-card-icon{width:4.1vw;height:4.1vw;border-radius:50%;display:grid;place-items:center;margin-top:-3%;background:var(--gold-soft);color:var(--gold)}
    .hero-card.local .hero-card-icon{background:var(--teal-soft);color:#285d67}
    .hero-card-icon svg{width:56%;height:56%;stroke:currentColor;fill:none;stroke-width:1.8}
    .hero-card-copy{min-width:0;padding-left:4%}
    .hero-card strong{display:block;margin-bottom:2.5%;font-size:1.34vw;line-height:1.2;color:#28415f}
    .hero-card-copy>span{display:block;font-size:1.05vw;line-height:1.48;color:#66798e}

    main{display:block}
    .section{padding:104px 28px;border-top:1px solid var(--line)}
    .section:nth-child(even){background:#fbfaf7}
    .wrap{width:min(1180px,100%);margin:0 auto}
    .section-label{margin:0 0 14px;color:var(--teal);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
    .section-label:before{content:"";width:38px;height:2px;background:var(--gold)}
    h2,h3,h4{margin:0;color:var(--ink);line-height:1.16;letter-spacing:-.025em}
    h2{max-width:980px;font-size:clamp(36px,4.4vw,58px);margin-bottom:22px}
    h2.long-title{max-width:1180px;font-size:clamp(30px,3vw,38px);line-height:1.1}
    h2 .accent{color:var(--gold)}
    h3{font-size:clamp(25px,3vw,36px)}
    h4{font-size:20px;letter-spacing:-.01em}
    p{margin:0 0 16px}
    .lead{max-width:940px;font-size:clamp(19px,2.05vw,26px);line-height:1.46;color:#29445f;margin-bottom:42px}
    .section-intro{max-width:840px;color:var(--muted);margin:0 0 38px;font-size:19px}
    .subsection{margin-top:76px;scroll-margin-top:30px}
    .subhead{display:flex;align-items:center;gap:15px;margin-bottom:26px}
    .subhead:before{content:"";width:8px;height:32px;border-radius:9px;background:var(--gold);flex:0 0 auto}
    .subhead.teal:before{background:var(--teal)}

    .scope-grid,.portal-grid,.source-grid,.owner-grid,.weather-grid,.principles-grid,.safety-grid{display:grid;gap:18px}
    .scope-grid{grid-template-columns:repeat(3,1fr)}
    .portal-grid,.owner-grid{grid-template-columns:repeat(2,1fr)}
    .source-grid{grid-template-columns:repeat(3,1fr)}
    .weather-grid{grid-template-columns:repeat(4,1fr)}
    .principles-grid{grid-template-columns:repeat(3,1fr)}
    .safety-grid{grid-template-columns:repeat(2,1fr)}
    .card{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:28px;box-shadow:0 10px 30px rgba(29,50,70,.035)}
    .card h3,.card h4{margin-bottom:12px}
    .card p:last-child{margin-bottom:0}
    .scope-card{position:relative;padding-top:72px}
    .scope-icon{position:absolute;left:28px;top:24px;width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-weight:700}
    .scope-card:nth-child(2) .scope-icon{background:var(--teal-soft);color:var(--teal)}
    .scope-card:nth-child(3) .scope-icon{background:var(--fog-soft);color:#667578}
    .boundary{margin:28px 0 0;padding:25px 28px;border-left:5px solid var(--gold);border-radius:0 18px 18px 0;background:linear-gradient(90deg,#fff8eb,#fbfaf6);font-size:19px;color:#2e475f}
    .module-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:10px;margin-top:24px;padding:0;list-style:none;counter-reset:modules}
    .module-list li{counter-increment:modules;display:flex;align-items:center;gap:13px;padding:15px 17px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .module-list li:before{content:counter(modules);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);color:var(--gold);font-weight:700;flex:0 0 auto}
    .module-detail{flex:1;min-width:0}.module-detail summary{cursor:pointer;list-style:none;color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:14px}.module-detail summary::-webkit-details-marker{display:none}.module-detail summary:after{content:'+';font-size:22px;font-weight:400;color:var(--gold)}.module-detail[open] summary:after{content:'âˆ’'}.module-detail p{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.48}.sample-note{margin-top:16px;padding:16px 18px;border-radius:14px;background:#f7f1e7;border-left:4px solid var(--gold);color:#3d5368}.sample-note strong{color:var(--ink)}
    .portal-card{display:grid;grid-template-columns:50px 1fr;gap:18px;align-items:start}
    .portal-mark{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-size:23px;font-weight:700}
    .portal-card:nth-child(2) .portal-mark{background:var(--teal-soft);color:var(--teal)}
    .quiet-note{margin-top:20px;padding:18px 22px;border-radius:14px;background:var(--fog-soft);color:#425b65;font-weight:700}

    .owner-grid .card:first-child{border-top:5px solid var(--gold)}
    .owner-grid .card:last-child{border-top:5px solid var(--teal)}
    .owner-grid ul,.plain-list{margin:14px 0 0;padding-left:20px}
    .owner-grid li,.plain-list li{margin:6px 0}
    .journey{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
    .step-tabs{display:grid;gap:8px}
    .step-tab{display:grid;grid-template-columns:34px 1fr;gap:11px;align-items:center;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);text-align:left;cursor:pointer}
    .step-tab:hover{border-color:#ceb58f}
    .step-tab[aria-selected="true"]{border-color:var(--gold);background:#fff7e9;color:var(--ink)}
    .step-tab b{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);color:var(--gold)}
    .step-panel{min-height:330px;display:flex;flex-direction:column;justify-content:space-between;padding:34px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
    .step-kicker{color:var(--teal);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
    .step-panel h4{font-size:30px;margin-bottom:16px}
    .step-panel p{font-size:18px;max-width:720px}
    .step-next{align-self:flex-start;margin-top:26px}
    .import-panel p{margin:0 0 13px}
    .import-panel p:last-child{margin-bottom:0}
    .import-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
    .import-note{padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
    .import-note strong{display:block;color:var(--ink);margin-bottom:7px}
    .import-note p{margin:0}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:11px 18px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-weight:700;text-decoration:none;cursor:pointer}
    .btn:hover{border-color:#cda970;background:#fffaf2}
    .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
    .btn.primary:hover{background:#294866}
    .btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
    .btn-row{display:flex;flex-wrap:wrap;gap:11px;margin-top:20px}
    .source-card{position:relative;overflow:hidden;padding-top:72px}
    .source-code{position:absolute;left:27px;top:24px;font-size:31px;font-weight:800;color:var(--gold)}
    .source-card:nth-child(2) .source-code{color:var(--teal)}
    .source-card:nth-child(3) .source-code{color:#6f7d80}
    .compare-note{margin-top:18px;padding:20px 24px;border-radius:16px;background:#edf3f3;color:#315961}
    .code-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff}
    .code-table th,.code-table td{padding:17px 19px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
    .code-table tr:last-child td{border-bottom:0}
    .code-table th{background:#f2efe9;color:var(--ink)}
    .code-table code{font-family:Arial,sans-serif;font-weight:800;color:var(--gold);font-size:18px}
    .workflow-card{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:start}
    .rule-box{padding:20px;border-radius:16px;background:var(--paper-2)}
    .rule-box strong{display:block;color:var(--ink);margin-bottom:7px}
    .checkup-options{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
    .checkup-options span{padding:9px 12px;border-radius:999px;background:#f3eee5;color:#4c5e6f;font-size:14px;font-weight:700}
    .scale-panel{margin-top:18px;padding:21px 22px;border-radius:16px;background:#f7f1e7;border-left:4px solid var(--gold)}
    .scale-panel h4{margin:0 0 14px;font-size:19px;color:var(--ink)}
    .scale-list{display:grid;gap:7px;margin:0 0 16px}
    .scale-line{margin:0;line-height:1.5;color:var(--text)}
    .scale-line strong{color:var(--ink)}
    .scale-note{margin:12px 0 0;line-height:1.55}
    .scale-panel.checkup-scale{background:#f5f3ee;border-left-color:var(--teal)}

    .weather-card{position:relative;text-align:center;padding:25px 18px}
    .weather-symbol{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:29px;background:var(--gold-soft);color:var(--gold)}
    .weather-card.cloudy .weather-symbol{background:#CBD5E1;color:#4b5660}
    .weather-card.storm .weather-symbol{background:var(--storm-soft);color:var(--storm)}
    .weather-card.fog .weather-symbol{background:#F1F3F4;color:#5b696c}
    .weather-card h4{margin-bottom:9px}
    .weather-card p{font-size:15px;line-height:1.45;color:var(--muted)}
    .matrix-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .matrix-rule{display:flex;gap:15px;align-items:flex-start}
    .matrix-rule b{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:var(--gold-soft);color:var(--gold)}
    .plan-callout{margin-top:20px;padding:28px;border-radius:20px;background:linear-gradient(135deg,#17324e,#28556a);color:#fff}
    .plan-callout h4{color:#fff;font-size:26px;margin-bottom:10px}
    .plan-callout p{margin:0;color:#e5edf2}
    .example{border:1px solid var(--line);border-radius:28px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
    .example-head{padding:28px 30px;background:linear-gradient(135deg,#f5eee1,#edf3f3);border-bottom:1px solid var(--line)}
    .example-head p{margin:8px 0 0;color:var(--muted)}
    .example-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:25px 30px;border-bottom:1px solid var(--line)}
    .select-wrap label{display:block;margin-bottom:7px;color:var(--ink);font-size:14px;font-weight:700}
    select{width:100%;min-height:46px;padding:9px 40px 9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
    .example-output{padding:30px}
    .status-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:23px}
    .status-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:#f3f1ec;font-size:14px;font-weight:700}
    .status-chip.clear{background:var(--gold-soft);color:#8b5c20}
    .status-chip.cloudy{background:#CBD5E1;color:#46535f}
    .status-chip.storm{background:var(--storm-soft);color:#784837}
    .status-chip.fog{background:#F1F3F4;color:#5b696c}
    .interpretation{font-size:20px;color:#29445f;margin-bottom:24px}
    .example-detail{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .example-detail article{padding:21px;border:1px solid var(--line);border-radius:17px;background:#fbfaf7}
    .example-detail h4{margin-bottom:9px}
    .example-detail p{font-size:16px;margin:0}

    .principle{padding:23px 24px;border-left:4px solid var(--gold);border-radius:0 16px 16px 0;background:#fff}
    .principle:nth-child(2n){border-left-color:var(--teal)}
    .principle h4{font-size:18px;margin-bottom:8px}
    .principle p{font-size:15px;color:var(--muted);margin:0}
    .references{display:grid;gap:12px}
    details.reference{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
    details.reference summary{cursor:pointer;list-style:none;padding:19px 22px;color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:18px}
    details.reference summary::-webkit-details-marker{display:none}
    details.reference summary:after{content:"+";font-size:25px;font-weight:400;color:var(--gold)}
    details.reference[open] summary:after{content:"âˆ’"}
    .reference-body{padding:0 24px 22px;border-top:1px solid var(--line)}
    .reference-body ul{margin:18px 0 0;padding-left:20px}
    .reference-body li{margin:10px 0}
    .security{margin-top:0;padding:45px;border-radius:32px;background:#18334e;color:#e7eef3;scroll-margin-top:26px}
    .security .section-label{color:#a9ced4}
    .security h3{color:#fff;font-size:clamp(34px,4vw,52px);margin-bottom:18px}
    .security .section-intro{color:#cbd8e1}
    .security .safety-card{border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:22px;background:rgba(255,255,255,.06)}
    .security .safety-card h4{color:#fff;margin-bottom:9px}
    .security .safety-card p{color:#d6e0e7;font-size:16px;margin:0}
    .security-note{margin-top:18px;padding:19px 21px;border-radius:14px;background:rgba(205,139,50,.18);color:#fff}
    footer{padding:34px 28px;background:#10283e;color:#bdcbd5;font-size:14px}
    footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .footer-attribution{display:grid;gap:3px}
    .toast{position:fixed;right:20px;bottom:20px;z-index:100;padding:13px 17px;border-radius:12px;background:#18334e;color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s ease}
    .toast.show{opacity:1;transform:translateY(0)}



    /* Compact portal navigation */
    .portal-nav-shell{position:sticky;top:0;z-index:80;background:rgba(248,246,241,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(30,48,65,.04)}
    .portal-nav{width:min(1180px,100%);margin:0 auto;padding:12px 28px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:thin}
    .portal-nav-btn{flex:0 0 auto;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--muted);padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
    .portal-nav-btn:hover{background:#fff;border-color:var(--line);color:var(--ink)}
    .portal-nav-btn[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
    .portal-page{display:none}
    .portal-page.is-active{display:block}
    .section-switcher{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px;padding:8px;border:1px solid var(--line);border-radius:16px;background:#f3f0ea}
    .section-switcher button{border:1px solid transparent;border-radius:11px;background:transparent;color:var(--muted);padding:10px 13px;font-weight:700;cursor:pointer}
    .section-switcher button:hover{background:#fff;color:var(--ink)}
    .section-switcher button[aria-selected="true"]{background:#fff;border-color:#d7c4a6;color:var(--ink);box-shadow:0 4px 14px rgba(30,48,65,.04)}
    .section-switcher button.is-visited:not([aria-selected="true"]){background:#eef2ef;color:#4f6762}
    .section-switcher button.is-visited:not([aria-selected="true"])::after{content:"âœ“";margin-left:8px;color:var(--teal);font-weight:700}
    @media(min-width:1100px){
      .wrap.has-subnav{width:min(1320px,100%);display:grid;grid-template-columns:minmax(0,1fr) 250px;grid-template-rows:auto 1fr;column-gap:36px;align-items:start}
      .wrap.has-subnav>.page-heading{grid-column:1;grid-row:1;min-width:0}
      .wrap.has-subnav>.page-body{grid-column:1;grid-row:2;min-width:0}
      .portal-page.is-active .section-switcher{position:sticky;top:78px;z-index:20;grid-column:2;grid-row:1 / span 2;align-self:start;width:250px;max-height:calc(100vh - 98px);overflow:auto;display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;margin:0;padding:10px}
      .portal-page.is-active .section-switcher button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;white-space:normal}
    }
    @media(min-width:761px) and (max-width:1099px){
      .section-switcher{position:sticky;top:64px;z-index:70;overflow-x:auto;flex-wrap:nowrap;box-shadow:0 8px 20px rgba(30,48,65,.05)}
      .section-switcher button{white-space:nowrap}
    }
    .pane-hidden{display:none!important}
    .local-output-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .local-output-card{border:1px solid var(--line);border-radius:20px;background:#fff;padding:25px;box-shadow:0 9px 26px rgba(30,48,65,.04)}
    .local-output-card h4{font-size:22px;margin-bottom:10px}
    .local-output-card p{margin:0;color:var(--muted)}
    .local-output-card ul{margin:14px 0 0;padding-left:20px}
    .local-output-card li{margin:6px 0}
    .local-output-card.profile{border-top:5px solid var(--teal)}
    .local-output-card.plan{border-top:5px solid var(--gold)}
    .section-nav-bottom{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
    .section-nav-bottom button{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:10px 14px;font-weight:700;cursor:pointer}
    .section-nav-bottom button:hover{border-color:#cda970;background:#fffaf2}
    @media(max-width:760px){.portal-nav{padding-left:16px;padding-right:16px}.local-output-grid{grid-template-columns:1fr}.section-switcher{position:sticky;top:64px;z-index:70;overflow-x:auto;flex-wrap:nowrap;box-shadow:0 8px 20px rgba(30,48,65,.05)}.section-switcher button{white-space:nowrap}}

    @media(max-width:980px){
      .scope-grid,.source-grid,.principles-grid{grid-template-columns:1fr 1fr}
      .weather-grid{grid-template-columns:1fr 1fr}
      .journey{grid-template-columns:1fr}.step-tabs{grid-template-columns:1fr 1fr}.step-panel{min-height:290px}
      .workflow-card{grid-template-columns:1fr}
    }
    @media(max-width:760px){
      body{font-size:16px}.hero-viewport{overflow-x:auto}.hero-stage{width:860px}
      .hero-guide{font-size:12px;border-radius:7px}.guide-arrow{font-size:14px}.hero-card strong{font-size:12px}.hero-card-copy>span{font-size:9.5px}.hero-card-icon{width:36px;height:36px}
      .section{padding:72px 20px}.scope-grid,.portal-grid,.source-grid,.owner-grid,.principles-grid,.safety-grid,.matrix-grid,.example-controls,.example-detail{grid-template-columns:1fr}
      .module-list{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}.step-tabs{grid-template-columns:1fr}.import-notes{grid-template-columns:1fr}.security{padding:30px 22px}
      .code-table{font-size:14px}.code-table th,.code-table td{padding:13px 12px}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast{transition:none}}
    @media print{
      .hero-viewport,.btn,.step-tabs,.example-controls,.toast{display:none!important}
      .section{padding:35px 0;border:0;break-inside:avoid}.card,.example,.security{box-shadow:none}.security{background:#fff;color:var(--text);border:1px solid var(--line)}.security h3,.security .safety-card h4{color:var(--ink)}.security .section-intro,.security .safety-card p{color:var(--text)}
    }
  
    /* semantic example refinement */
    .example-card-label{display:block;margin-bottom:8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
    .example-aspect-card h4{font-size:20px;font-weight:700;color:var(--storm);margin-bottom:16px}
    .example-aspect-section{margin-top:14px}
    .example-aspect-section h5{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--ink)}
    .example-aspect-section p{font-size:15px;line-height:1.55;color:var(--text)}
    .example-action-card h4{font-size:18px;color:var(--ink)}

/* coverage-calculator:start */
.bc-coverage-toggle{margin-top:20px}
.bc-coverage[hidden],.bc-coverage [hidden]{display:none!important}
.bc-coverage{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--text)}
.bc-coverage h4{margin:0;font-size:21px;color:var(--ink);line-height:1.3}
.bc-coverage-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:20px 0}
.bc-coverage-fields label{display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;color:var(--ink)}
.bc-coverage-fields input{width:100%;min-width:0;padding:12px;border:1px solid var(--teal);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:18px}
.bc-coverage-fields input[aria-invalid="true"]{border-color:var(--storm)}
.bc-coverage input:focus-visible,.bc-coverage-toggle:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.bc-coverage-value{font-size:42px;font-weight:700;line-height:1.2;color:var(--teal);margin-bottom:14px;font-variant-numeric:tabular-nums}
.bc-coverage-track{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.bc-coverage-fill{width:0;height:100%;background:var(--teal);transition:width .35s ease}
.bc-coverage-scale{display:flex;justify-content:space-between;font-size:12px;margin-top:5px;color:var(--text)}
.bc-coverage h5{margin:18px 0 10px;font-size:19px;color:var(--ink)}
.bc-coverage-note{font-size:13px;border-top:1px solid var(--line);padding-top:14px;margin-bottom:0}
.bc-coverage-error,.bc-coverage-minimum{color:var(--ink);padding:12px;border-left:3px solid var(--storm);background:var(--storm-soft)}
@media(max-width:600px){.bc-coverage-fields{grid-template-columns:1fr}.bc-coverage{padding:16px}}
@media(prefers-reduced-motion:reduce){.bc-coverage-fill{transition:none}}
/* coverage-calculator:end */
</style>
